<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">
  <defs>
    <style>
      .lbl { fill: #172033; font-weight: 700; }
      .sub { fill: #5a6578; }
      .keep { fill: #173b57; }
      .drop { fill: #087f72; }
      .axis { stroke: #b9c7c8; stroke-width: 1; }
      .cut  { stroke: #a85f08; stroke-width: 2; stroke-dasharray: 6 4; }
    </style>
  </defs>

  <text x="20" y="26" class="lbl" font-size="15">Heads sorted by retention horizon, one 24-layer GDN model (96 heads)</text>
  <text x="20" y="44" class="sub">Horizon = tokens until a stored write has decayed below 0.1%, computed from each head's learned decay parameters. Log scale.</text>

  <!-- axes -->
  <line x1="70" y1="270" x2="850" y2="270" class="axis"/>
  <line x1="70" y1="70" x2="70" y2="270" class="axis"/>
  <g class="sub" font-size="11">
    <text x="30" y="274">10</text>
    <text x="26" y="224">100</text>
    <text x="22" y="174">1k</text>
    <text x="22" y="124">10k</text>
    <text x="18" y="74">100k</text>
  </g>

  <!-- 96 bars; heights follow a smooth log curve for illustration; split at 56 dropped / 40 kept -->
  <g>
    <!-- dropped heads: horizons 10..256 -->
    <rect x="72" y="262" width="6" height="8" class="drop"/><rect x="80" y="261" width="6" height="9" class="drop"/><rect x="88" y="259" width="6" height="11" class="drop"/><rect x="96" y="258" width="6" height="12" class="drop"/>
    <rect x="104" y="256" width="6" height="14" class="drop"/><rect x="112" y="255" width="6" height="15" class="drop"/><rect x="120" y="253" width="6" height="17" class="drop"/><rect x="128" y="252" width="6" height="18" class="drop"/>
    <rect x="136" y="250" width="6" height="20" class="drop"/><rect x="144" y="249" width="6" height="21" class="drop"/><rect x="152" y="247" width="6" height="23" class="drop"/><rect x="160" y="246" width="6" height="24" class="drop"/>
    <rect x="168" y="244" width="6" height="26" class="drop"/><rect x="176" y="243" width="6" height="27" class="drop"/><rect x="184" y="241" width="6" height="29" class="drop"/><rect x="192" y="240" width="6" height="30" class="drop"/>
    <rect x="200" y="238" width="6" height="32" class="drop"/><rect x="208" y="237" width="6" height="33" class="drop"/><rect x="216" y="235" width="6" height="35" class="drop"/><rect x="224" y="234" width="6" height="36" class="drop"/>
    <rect x="232" y="232" width="6" height="38" class="drop"/><rect x="240" y="231" width="6" height="39" class="drop"/><rect x="248" y="229" width="6" height="41" class="drop"/><rect x="256" y="228" width="6" height="42" class="drop"/>
    <rect x="264" y="226" width="6" height="44" class="drop"/><rect x="272" y="225" width="6" height="45" class="drop"/><rect x="280" y="223" width="6" height="47" class="drop"/><rect x="288" y="222" width="6" height="48" class="drop"/>
    <rect x="296" y="220" width="6" height="50" class="drop"/><rect x="304" y="219" width="6" height="51" class="drop"/><rect x="312" y="217" width="6" height="53" class="drop"/><rect x="320" y="216" width="6" height="54" class="drop"/>
    <rect x="328" y="214" width="6" height="56" class="drop"/><rect x="336" y="213" width="6" height="57" class="drop"/><rect x="344" y="211" width="6" height="59" class="drop"/><rect x="352" y="210" width="6" height="60" class="drop"/>
    <rect x="360" y="208" width="6" height="62" class="drop"/><rect x="368" y="207" width="6" height="63" class="drop"/><rect x="376" y="205" width="6" height="65" class="drop"/><rect x="384" y="204" width="6" height="66" class="drop"/>
    <rect x="392" y="202" width="6" height="68" class="drop"/><rect x="400" y="201" width="6" height="69" class="drop"/><rect x="408" y="199" width="6" height="71" class="drop"/><rect x="416" y="198" width="6" height="72" class="drop"/>
    <rect x="424" y="196" width="6" height="74" class="drop"/><rect x="432" y="195" width="6" height="75" class="drop"/><rect x="440" y="193" width="6" height="77" class="drop"/><rect x="448" y="192" width="6" height="78" class="drop"/>
    <rect x="456" y="190" width="6" height="80" class="drop"/><rect x="464" y="189" width="6" height="81" class="drop"/><rect x="472" y="187" width="6" height="83" class="drop"/><rect x="480" y="186" width="6" height="84" class="drop"/>
    <rect x="488" y="184" width="6" height="86" class="drop"/><rect x="496" y="183" width="6" height="87" class="drop"/><rect x="504" y="181" width="6" height="89" class="drop"/><rect x="512" y="180" width="6" height="90" class="drop"/>
    <!-- kept heads: horizons above 256, rising to ~100k -->
    <rect x="524" y="176" width="6" height="94" class="keep"/><rect x="532" y="172" width="6" height="98" class="keep"/><rect x="540" y="168" width="6" height="102" class="keep"/><rect x="548" y="164" width="6" height="106" class="keep"/>
    <rect x="556" y="160" width="6" height="110" class="keep"/><rect x="564" y="156" width="6" height="114" class="keep"/><rect x="572" y="152" width="6" height="118" class="keep"/><rect x="580" y="148" width="6" height="122" class="keep"/>
    <rect x="588" y="144" width="6" height="126" class="keep"/><rect x="596" y="140" width="6" height="130" class="keep"/><rect x="604" y="136" width="6" height="134" class="keep"/><rect x="612" y="132" width="6" height="138" class="keep"/>
    <rect x="620" y="128" width="6" height="142" class="keep"/><rect x="628" y="124" width="6" height="146" class="keep"/><rect x="636" y="120" width="6" height="150" class="keep"/><rect x="644" y="116" width="6" height="154" class="keep"/>
    <rect x="652" y="112" width="6" height="158" class="keep"/><rect x="660" y="108" width="6" height="162" class="keep"/><rect x="668" y="104" width="6" height="166" class="keep"/><rect x="676" y="100" width="6" height="170" class="keep"/>
    <rect x="684" y="97" width="6" height="173" class="keep"/><rect x="692" y="94" width="6" height="176" class="keep"/><rect x="700" y="91" width="6" height="179" class="keep"/><rect x="708" y="88" width="6" height="182" class="keep"/>
    <rect x="716" y="86" width="6" height="184" class="keep"/><rect x="724" y="84" width="6" height="186" class="keep"/><rect x="732" y="82" width="6" height="188" class="keep"/><rect x="740" y="80" width="6" height="190" class="keep"/>
    <rect x="748" y="79" width="6" height="191" class="keep"/><rect x="756" y="78" width="6" height="192" class="keep"/><rect x="764" y="77" width="6" height="193" class="keep"/><rect x="772" y="76" width="6" height="194" class="keep"/>
    <rect x="780" y="75" width="6" height="195" class="keep"/><rect x="788" y="74" width="6" height="196" class="keep"/><rect x="796" y="73" width="6" height="197" class="keep"/><rect x="804" y="72" width="6" height="198" class="keep"/>
    <rect x="812" y="72" width="6" height="198" class="keep"/><rect x="820" y="71" width="6" height="199" class="keep"/><rect x="828" y="71" width="6" height="199" class="keep"/><rect x="836" y="70" width="6" height="200" class="keep"/>
  </g>

  <!-- cutoff line at Wmax = 256 (between 100 and 1k on log axis) -->
  <line x1="70" y1="200" x2="850" y2="200" class="cut"/>
  <text x="76" y="195" fill="#a85f08" font-weight="800" font-size="12">Wmax = 256 tokens</text>

  <!-- group labels -->
  <text x="72" y="292" class="drop" font-weight="800">56 heads: horizon &lt; Wmax, not stored</text>
  <text x="72" y="309" class="drop" font-size="12">rebuilt on load by replaying the last 256 prefix tokens</text>
  <text x="524" y="292" class="keep" font-weight="800">40 heads: horizon &gt; Wmax, stored exactly</text>
  <text x="20" y="332" class="sub" font-size="11">Bar shape is schematic; the 56/40 split, the threshold, and the axis scale are from the measured checkpoint.</text>
</svg>
