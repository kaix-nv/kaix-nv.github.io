<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">What a Qwen3-8B decode step is made of, RTX A6000</title>
<desc id="desc">Stacked bars of the model&#x27;s decode step by batch, 1 to 64 sequences, split into the weight GEMMs, the LM head, the small ops, attention and the sampler, with the measured step on the engine&#x27;s clock as a dot. Left: 128-token prompts at context 278 with top-p sampling; the GEMMs are about 21 to 24 ms of every step and the sampler grows to 4.7 ms at 64 sequences. Right: half 128-token and half 1920-token prompts, mean context 1124, greedy; attention grows to about 16 ms at 64 sequences. Every dot sits on its bar within 2 percent.</desc>
