<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
<title id="title">What one layer keeps for one sequence, by attention design</title>
<desc id="desc">Megabytes one layer stores for one sequence against context, 1k to 1M tokens, both axes logarithmic. Full attention, per-head K and V, the latent and the compressed layers grow in proportion to the context, at different levels: per-head K and V for Kimi-K3&#x27;s 96 heads is 53 times its latent. The linear-attention state (3.2 MB) and the 128-token window (0.26 MB) are flat. The state equals a full Qwen3.8-27B layer&#x27;s cache at 783 tokens.</desc>
<defs><style>
  .title { font: 700 22px system-ui, sans-serif; fill: #0f172a; }
  .axis { font: 500 14px system-ui, sans-serif; fill: #334155; }
  .tick { font: 500 12px system-ui, sans-serif; fill: #475569; }
  .legend { font: 600 13px system-ui, sans-serif; fill: #334155; }
  .note { font: 500 12px system-ui, sans-serif; fill: #64748b; }
</style></defs>
