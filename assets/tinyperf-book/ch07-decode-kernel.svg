<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">Decode attention per layer: measured and model</title>
<desc id="desc">Microseconds per layer for one decode-attention call, Qwen3-8B, against context from 256 to 8192 tokens, both axes logarithmic, at batch 1, 8 and 64. Measured points and the fitted model (7 us per call plus the cache at 0.96 of the fitted DRAM rate) track each other; at batch 1 the kernel costs 12 to 13 us up to 1024 tokens, a floor the generic price (the cache at the DRAM rate plus a launch, 5 us at 256 tokens) misses.</desc>
<defs><style>
  .title { font: 700 22px system-ui, sans-serif; fill: #0f172a; }
  .axis { font: 500 14px system-ui, sans-serif; fill: #334155; }
  .tick { font: 500 12px system-ui, sans-serif; fill: #475569; }
  .legend { font: 600 13px system-ui, sans-serif; fill: #334155; }
  .note { font: 500 12px system-ui, sans-serif; fill: #64748b; }
</style></defs>
