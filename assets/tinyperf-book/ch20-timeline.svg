<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
<title id="title">Plain decoding against draft and verify</title>
<desc id="desc">A timeline to scale for Qwen3-8B on an RTX A6000, batch 1, context 1024. Plain decoding runs four target decode steps of 24.2 ms and emits four tokens by 96.9 ms. Speculative decoding runs four Qwen3-0.6B draft steps of 3.41 ms, then one target verify step of 24.3 ms over five positions. In the first cycle the target accepts two drafted tokens, rejects the third and replaces it with its own sample, and the fourth is discarded: three tokens. In the second cycle it accepts all four and adds its own fifth token. Eight tokens by 75.9 ms.</desc>
<defs><style>.title { font: 700 22px system-ui, sans-serif; fill: #0f172a; }.sub { font: 500 14px system-ui, sans-serif; fill: #475569; }.row { font: 700 15px system-ui, sans-serif; fill: #334155; }.small { font: 500 13px system-ui, sans-serif; fill: #475569; }.box { font: 600 13px system-ui, sans-serif; fill: #0f172a; }.num { font: 600 12px ui-monospace, monospace; fill: #334155; }.tok { font: 700 11px ui-monospace, monospace; }</style></defs>
