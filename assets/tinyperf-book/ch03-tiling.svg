<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img"
     aria-labelledby="title description">
  <title id="title">How a GEMM kernel divides the work into tiles</title>
  <desc id="description">
    C equals A times B. C is divided into a grid of BM by BN tiles, and one
    thread block (CTA) computes one tile. That tile needs a BM-row panel of A
    and a BN-column panel of B, both K long. The CTA walks the K dimension in
    steps of BK, staging a BM by BK slice of A and a BK by BN slice of B in
    shared memory at each step and accumulating into its tile.
  </desc>
  <defs>
    <style>
      .title { font: 700 26px system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px system-ui, sans-serif; fill: #475569; }
      .label { font: 700 17px system-ui, sans-serif; fill: #0f172a; }
      .small { font: 500 14px system-ui, sans-serif; fill: #334155; }
      .dim { font: 500 13px ui-monospace, monospace; fill: #64748b; }
      .grid { stroke: #cbd5e1; stroke-width: 1; }
    </style>
  </defs>
  <rect width="1100" height="650" rx="18" fill="#f8fafc"/>
  <text x="40" y="46" class="title">A GEMM kernel, one tile per thread block</text>
  <text x="40" y="72" class="subtitle">C[M,N] = A[M,K] · B[K,N]. The kernel never sees "a matrix multiply", only its tiles.</text>

  <!-- B: K x N, above C -->
  <rect x="420" y="100" width="360" height="160" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <rect x="600" y="100" width="60" height="160" fill="#dbeafe"/>
  <rect x="600" y="150" width="60" height="30" fill="#fdba74"/>
  <g class="grid">
    <line x1="480" y1="100" x2="480" y2="260"/><line x1="540" y1="100" x2="540" y2="260"/>
    <line x1="600" y1="100" x2="600" y2="260"/><line x1="660" y1="100" x2="660" y2="260"/>
    <line x1="720" y1="100" x2="720" y2="260"/>
  </g>
  <rect x="420" y="100" width="360" height="160" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="800" y="170" class="label">B</text>
  <text x="800" y="192" class="dim">K × N</text>

  <!-- A: M x K, left of C -->
  <rect x="200" y="290" width="160" height="240" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <rect x="200" y="350" width="160" height="60" fill="#dbeafe"/>
  <rect x="250" y="350" width="30" height="60" fill="#fdba74"/>
  <g class="grid">
    <line x1="200" y1="350" x2="360" y2="350"/><line x1="200" y1="410" x2="360" y2="410"/>
    <line x1="200" y1="470" x2="360" y2="470"/>
  </g>
  <rect x="200" y="290" width="160" height="240" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="150" y="400" class="label">A</text>
  <text x="120" y="422" class="dim">M × K</text>

  <!-- C: M x N, 4 x 6 tiles -->
  <rect x="420" y="290" width="360" height="240" fill="#ffffff"/>
  <rect x="600" y="350" width="60" height="60" fill="#2563eb"/>
  <g class="grid">
    <line x1="480" y1="290" x2="480" y2="530"/><line x1="540" y1="290" x2="540" y2="530"/>
    <line x1="600" y1="290" x2="600" y2="530"/><line x1="660" y1="290" x2="660" y2="530"/>
    <line x1="720" y1="290" x2="720" y2="530"/>
    <line x1="420" y1="350" x2="780" y2="350"/><line x1="420" y1="410" x2="780" y2="410"/>
    <line x1="420" y1="470" x2="780" y2="470"/>
  </g>
  <rect x="420" y="290" width="360" height="240" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="800" y="420" class="label">C</text>
  <text x="800" y="442" class="dim">M × N</text>
  <text x="630" y="385" class="dim" fill="#ffffff" text-anchor="middle" style="fill:#ffffff">BM×BN</text>

  <!-- dimension marks -->
  <path d="M 600 536 L 600 544 L 660 544 L 660 536" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="630" y="562" class="dim" text-anchor="middle">BN</text>
  <path d="M 414 350 L 406 350 L 406 410 L 414 410" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="398" y="385" class="dim" text-anchor="end">BM</text>
  <text x="265" y="342" class="dim" text-anchor="middle">BK</text>
  <text x="590" y="170" class="dim" text-anchor="end">BK</text>

  <!-- legend -->
  <rect x="40" y="590" width="22" height="22" fill="#2563eb"/>
  <text x="72" y="607" class="small">one output tile = one CTA</text>
  <rect x="300" y="590" width="22" height="22" fill="#dbeafe" stroke="#94a3b8"/>
  <text x="332" y="607" class="small">the A rows and B columns that tile reads (K long)</text>
  <rect x="710" y="590" width="22" height="22" fill="#fdba74"/>
  <text x="742" y="607" class="small">one K step: slices staged in shared memory</text>
</svg>
