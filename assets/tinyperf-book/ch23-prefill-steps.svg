<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">One fresh prompt: model/measured, piece by piece</title>
<desc id="desc">Model over measured for the engine&#x27;s forward on one fresh gpt-oss-20b prompt of 128 to 2,048 tokens. With the fitted 0.66 and FlashAttention-2&#x27;s attention price the steps read 0.90 to 1.05, low for mid-size prompts and high for some long ones. Measuring Marlin alone lowers the long prompts to about 0.94; measuring Triton&#x27;s attention alone raises them to as much as 1.10; with both measured every length reads 0.98 to 1.03.</desc>
<defs><style>
  .title { font: 700 22px system-ui, sans-serif; fill: #0f172a; }
  .axis { font: 500 14px system-ui, sans-serif; fill: #334155; }
  .tick { font: 500 12px system-ui, sans-serif; fill: #475569; }
  .legend { font: 600 13px system-ui, sans-serif; fill: #334155; }
  .note { font: 500 12px system-ui, sans-serif; fill: #64748b; }
</style></defs>
