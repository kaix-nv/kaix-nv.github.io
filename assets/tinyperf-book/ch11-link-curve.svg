<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">NCCL on two RTX A6000s against the ring model</title>
<desc id="desc">Bytes per GPU divided by time for NCCL all-reduce and all-gather on two RTX A6000s over a PCIe host bridge, each call timed inside a CUDA graph, from 8 KB to 32 MB, with the ring model&#x27;s line for each. Large all-reduces reach 3.85 GB/s and all-gathers 3.30. Between 64 KB and 512 KB, where a decode step&#x27;s all-reduces fall at batch 8 to 64, the measured all-reduce delivers 0.72 to 0.91 of what the ring model assumes; at 8 KB it is faster than the model. The ring model&#x27;s all-gather line sits above its all-reduce line because an all-gather pays half the hops.</desc>
<defs><style>
  .title { font: 700 22px system-ui, sans-serif; fill: #0f172a; }
  .axis { font: 500 14px system-ui, sans-serif; fill: #334155; }
  .tick { font: 500 12px system-ui, sans-serif; fill: #475569; }
  .legend { font: 600 13px system-ui, sans-serif; fill: #334155; }
  .note { font: 500 12px system-ui, sans-serif; fill: #64748b; }
</style></defs>
