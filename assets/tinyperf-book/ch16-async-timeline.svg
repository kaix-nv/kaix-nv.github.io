<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img"
     aria-labelledby="title description">
  <title id="title">The model admits an arrival at step k+2</title>
  <desc id="description">
    A timeline of five steps in the model: three decode steps of 40 sequences
    (k-1, k and k+1), then two steps that each carry the 40 decodes and a
    chunk of a 4,000-token prompt. The model assumes the engine thread plans
    each step at the moment the step before it begins, drawn as a tick at
    each step's start. The prompt arrives 3.3 ms into step k, just after the
    plan for step k+1, so the model admits it at step k+2. It waits 55.0 ms,
    the rest of step k and all of step k+1, then its two chunks run in 298.0
    and 329.5 ms, and the last chunk emits its first token. With the 25 ms
    per-request overhead the model's TTFT is 707.5 ms. In the engine an
    arrival during step k usually, not always, misses step k+1.
  </desc>
  <defs>
    <style>
      .title { font: 700 26px system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px system-ui, sans-serif; fill: #475569; }
      .row { font: 700 15px system-ui, sans-serif; fill: #334155; }
      .label { font: 600 14px system-ui, sans-serif; fill: #0f172a; }
      .small { font: 500 13px system-ui, sans-serif; fill: #334155; }
      .note { font: 500 13px system-ui, sans-serif; fill: #475569; }
      .num { font: 600 13px ui-monospace, monospace; fill: #0f172a; }
      .tick { font: 600 12px ui-monospace, monospace; fill: #475569; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
    <marker id="arrowgrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1100" height="500" rx="18" fill="#f8fafc"/>
  <text x="40" y="46" class="title">The model admits an arrival at step k+2</text>
  <text x="40" y="72" class="subtitle">40 sequences decode; a 4,000-token prompt arrives 3.3 ms into step k. The model's steps (Table 16.4), not to scale.</text>

  <!-- row labels -->
  <text x="40" y="132" class="row">client</text>
  <text x="40" y="212" class="row">engine thread</text>
  <text x="40" y="232" class="small">plans each step</text>
  <text x="40" y="304" class="row">GPU</text>
  <text x="40" y="324" class="small">runs the steps</text>

  <!-- client: the request and the per-request overhead -->
  <line x1="180" y1="140" x2="1060" y2="140" stroke="#cbd5e1"/>
  <circle cx="186" cy="140" r="6" fill="#ea580c"/>
  <text x="180" y="120" class="small">prompt sent</text>
  <rect x="192" y="133" width="106" height="14" rx="3" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="294" y="165" class="note" text-anchor="end">per-request overhead</text>
  <path d="M 303 147 L 303 202" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <!-- engine thread: in the model, the plan for each step is made as the step before it begins -->
  <line x1="180" y1="215" x2="1060" y2="215" stroke="#cbd5e1"/>
  <g stroke="#475569" stroke-width="3">
    <line x1="181" y1="204" x2="181" y2="226"/>
    <line x1="290" y1="204" x2="290" y2="226"/>
    <line x1="510" y1="204" x2="510" y2="226"/>
  </g>
  <line x1="400" y1="204" x2="400" y2="226" stroke="#ea580c" stroke-width="3"/>
  <text x="186" y="244" class="tick">plan k</text>
  <text x="274" y="244" class="tick">plan k+1</text>
  <text x="384" y="244" class="tick" style="fill:#ea580c">plan k+2</text>
  <text x="494" y="244" class="tick">plan k+3</text>
  <circle cx="303" cy="215" r="6" fill="#ea580c"/>
  <path d="M 309 209 C 330 186, 376 186, 396 206" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="598" y="206" class="small">The model assumes each plan is made as the step before it</text>
  <text x="598" y="224" class="small">begins, so the prompt misses k+1 and joins k+2. In the engine</text>
  <text x="598" y="242" class="small">an arrival during step k usually, not always, misses k+1.</text>

  <!-- GPU: the steps -->
  <rect x="180" y="284" width="110" height="46" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="235" y="304" class="label" text-anchor="middle">step k-1</text>
  <text x="235" y="322" class="num" text-anchor="middle">29.1 ms</text>
  <rect x="290" y="284" width="110" height="46" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="352" y="304" class="label" text-anchor="middle">step k</text>
  <text x="352" y="322" class="num" text-anchor="middle">29.1 ms</text>
  <rect x="400" y="284" width="110" height="46" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="455" y="304" class="label" text-anchor="middle">step k+1</text>
  <text x="455" y="322" class="num" text-anchor="middle">29.2 ms</text>
  <rect x="510" y="284" width="270" height="46" rx="4" fill="#fdba74" stroke="#ea580c"/>
  <rect x="510" y="284" width="40" height="46" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="665" y="304" class="label" text-anchor="middle">step k+2: chunk of 2,008</text>
  <text x="665" y="322" class="num" text-anchor="middle">298.0 ms</text>
  <rect x="780" y="284" width="270" height="46" rx="4" fill="#fdba74" stroke="#ea580c"/>
  <rect x="780" y="284" width="40" height="46" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="935" y="304" class="label" text-anchor="middle">step k+3: chunk of 1,992</text>
  <text x="935" y="322" class="num" text-anchor="middle">329.5 ms</text>
  <line x1="303" y1="252" x2="303" y2="340" stroke="#ea580c" stroke-dasharray="3 4"/>

  <!-- braces: the wait, the chunks, the first token -->
  <path d="M 303 350 L 303 358 L 510 358 L 510 350" fill="none" stroke="#475569" stroke-width="1.5"/>
  <text x="406" y="378" class="num" text-anchor="middle">waits 55.0 ms</text>
  <text x="406" y="396" class="note" text-anchor="middle">rest of k, all of k+1</text>
  <path d="M 510 350 L 510 358 L 1050 358 L 1050 350" fill="none" stroke="#475569" stroke-width="1.5"/>
  <text x="780" y="378" class="num" text-anchor="middle">its prompt in two chunks: 298.0 + 329.5 ms</text>
  <text x="780" y="396" class="note" text-anchor="middle">the last chunk emits the first token</text>
  <path d="M 1050 284 L 1050 150" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowgrey)"/>
  <text x="1040" y="120" class="small" text-anchor="end">first token: TTFT 707.5 ms with the overhead</text>

  <text x="40" y="440" class="note">Blue: the 40 decodes' rows; orange: the prompt's chunk. Ticks: the moment the model makes each plan (async scheduling).</text>
  <text x="40" y="462" class="note">Planned just before each step runs instead, the prompt would join step k+1: one decode step, 29.2 ms, sooner. On an idle engine the two rules agree.</text>
</svg>
