<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">Speed-up over bf16 as the KV cache grows</title>
<desc id="desc">Speed-up of a Qwen3-8B decode step of 64 sequences over bf16, at datasheet rates, against context from 1024 to 32768 tokens. With the weight GEMMs in fp4 and a 16-bit cache the speed-up falls from 1.3x toward 1 as the cache dominates. The deployable FP4 recipe, with an fp8 cache, rises toward 2x; so does the H100&#x27;s FP8 recipe. The naive estimate, every tensor in fp4, rises toward 4x.</desc>
<defs><style>
  .title { font: 700 22px system-ui, sans-serif; fill: #0f172a; }
  .axis { font: 500 14px system-ui, sans-serif; fill: #334155; }
  .tick { font: 500 12px system-ui, sans-serif; fill: #475569; }
  .legend { font: 600 13px system-ui, sans-serif; fill: #334155; }
  .note { font: 500 12px system-ui, sans-serif; fill: #64748b; }
</style></defs>
<rect width="900" height="520" rx="16" fill="#f8fafc"/>
<text x="80" y="36" class="title">Speed-up over bf16 as the KV cache grows</text>
<line x1="80" y1="450.0" x2="870" y2="450.0" stroke="#e2e8f0"/>
<text x="72" y="454.0" class="tick" text-anchor="end">0</text>
<line x1="80" y1="352.5" x2="870" y2="352.5" stroke="#e2e8f0"/>
<text x="72" y="356.5" class="tick" text-anchor="end">1</text>
<line x1="80" y1="255.0" x2="870" y2="255.0" stroke="#e2e8f0"/>
<text x="72" y="259.0" class="tick" text-anchor="end">2</text>
<line x1="80" y1="157.5" x2="870" y2="157.5" stroke="#e2e8f0"/>
<text x="72" y="161.5" class="tick" text-anchor="end">3</text>
<line x1="80" y1="60.0" x2="870" y2="60.0" stroke="#e2e8f0"/>
<text x="72" y="64.0" class="tick" text-anchor="end">4</text>
<text x="80.0" y="470" class="tick" text-anchor="middle">1024</text>
<text x="238.0" y="470" class="tick" text-anchor="middle">2048</text>
<text x="396.0" y="470" class="tick" text-anchor="middle">4096</text>
<text x="554.0" y="470" class="tick" text-anchor="middle">8192</text>
<text x="712.0" y="470" class="tick" text-anchor="middle">16384</text>
<text x="870.0" y="470" class="tick" text-anchor="middle">32768</text>
<line x1="80" y1="450" x2="870" y2="450" stroke="#64748b"/>
<line x1="80" y1="60" x2="80" y2="450" stroke="#64748b"/>
