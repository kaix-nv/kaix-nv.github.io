<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">One weight GEMM in four formats, H100 roofline</title>
<desc id="desc">Log-log roofline time of a GEMM with a 4096 by 4096 weight on an H100 at datasheet rates, from 1 to 4096 rows. Each curve is flat while the weights&#x27; bytes set the time, then rises with the rows once math does. fp8 lowers both parts by half, and turns at the same 345 rows as bf16. 4-bit weights with bf16 math lower only the flat part, to about a quarter, turn up at 92 rows and join the bf16 line at 345. 2:4 sparsity lowers the flat part to 0.56 and the rising part to half, and turns at 467 rows; above that it runs on the fp8 line, since both double the rate.</desc>
