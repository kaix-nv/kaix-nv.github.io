<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
<title id="title">Where an RTX A6000's memory goes when vLLM starts</title>
<desc id="desc">Two stacked bars, each the 47.40 GiB CUDA reports on an RTX A6000. Qwen3-8B on one GPU: weights 15.26 GiB, profiling peak 1.40, 0.04 held outside PyTorch, KV pool 25.97 GiB (189,072 tokens), and 4.74 not requested at utilization 0.9. Qwen3-30B-A3B on each of two GPUs: weights 28.44, profiling peak 1.40, MoE workspace 0.50, 0.03 outside PyTorch, KV pool 9.93 GiB (216,848 tokens), 7.11 not requested at utilization 0.85.</desc>
<defs><style>.title { font: 700 24px system-ui, sans-serif; fill: #0f172a; }.sub { font: 400 15px system-ui, sans-serif; fill: #475569; }.label { font: 600 15px system-ui, sans-serif; fill: #0f172a; }.small { font: 500 13px system-ui, sans-serif; fill: #334155; }.num { font: 700 14px ui-monospace, monospace; }.tick { font: 500 12px ui-monospace, monospace; fill: #475569; }</style></defs>
<rect width="1100" height="500" rx="16" fill="#f8fafc"/>
<text x="60" y="42" class="title">Where the memory goes when vLLM starts</text>
<text x="60" y="68" class="sub">Each bar is the 47.40 GiB CUDA reports on one RTX A6000. The KV pool is what is left.</text>
<text x="60" y="108" class="label">Qwen3-8B, one GPU: utilization 0.9, 2,048-token budget, 256 sequences</text>
<rect x="60.0" y="120" width="321.9" height="54" fill="#2563eb"/>
<text x="70.0" y="143" class="small" fill="#ffffff" style="fill:#ffffff">weights</text>
<text x="70.0" y="163" class="num" style="fill:#ffffff">15.26</text>
<rect x="381.9" y="120" width="29.5" height="54" fill="#ea580c"/>
<rect x="411.4" y="120" width="1.5" height="54" fill="#475569"/>
<rect x="412.2" y="120" width="547.8" height="54" fill="#15803d"/>
<text x="422.2" y="143" class="small" fill="#ffffff" style="fill:#ffffff">KV pool</text>
<text x="422.2" y="163" class="num" style="fill:#ffffff">25.97</text>
<rect x="960.0" y="120" width="100.0" height="54" fill="#e2e8f0"/>
<text x="970.0" y="143" class="small" fill="#334155" style="fill:#334155">not requested</text>
<text x="970.0" y="163" class="num" style="fill:#334155">4.74</text>
<line x1="396.6" y1="176" x2="396.6" y2="188" stroke="#94a3b8"/>
<text x="392.6" y="200" class="small" text-anchor="end">profiling peak <tspan class="num" style="fill:#0f172a">1.40</tspan></text>
<line x1="411.8" y1="176" x2="411.8" y2="206" stroke="#94a3b8"/>
<text x="407.8" y="218" class="small" text-anchor="end">outside PyTorch <tspan class="num" style="fill:#0f172a">0.04</tspan></text>
<line x1="960.0" y1="114" x2="960.0" y2="180" stroke="#0f172a" stroke-width="2" stroke-dasharray="4 3"/>
<text x="1060" y="236" class="small" text-anchor="end">KV pool: <tspan class="num" style="fill:#15803d">189,072</tspan> tokens. Dashed line: utilization 0.9 of the total, what vLLM requests</text>
<text x="60" y="283" class="label">Qwen3-30B-A3B, each of two GPUs (tp=2): utilization 0.85, 8,192-token budget, 256 sequences</text>
<rect x="60.0" y="295" width="599.9" height="54" fill="#2563eb"/>
<text x="70.0" y="318" class="small" fill="#ffffff" style="fill:#ffffff">weights</text>
<text x="70.0" y="338" class="num" style="fill:#ffffff">28.44</text>
<rect x="659.9" y="295" width="29.5" height="54" fill="#ea580c"/>
<rect x="689.4" y="295" width="10.5" height="54" fill="#fdba74"/>
<rect x="699.9" y="295" width="1.5" height="54" fill="#475569"/>
<rect x="700.6" y="295" width="209.4" height="54" fill="#15803d"/>
<text x="710.6" y="318" class="small" fill="#ffffff" style="fill:#ffffff">KV pool</text>
<text x="710.6" y="338" class="num" style="fill:#ffffff">9.93</text>
<rect x="910.0" y="295" width="150.0" height="54" fill="#e2e8f0"/>
<text x="920.0" y="318" class="small" fill="#334155" style="fill:#334155">not requested</text>
<text x="920.0" y="338" class="num" style="fill:#334155">7.11</text>
<line x1="674.6" y1="351" x2="674.6" y2="363" stroke="#94a3b8"/>
<text x="670.6" y="375" class="small" text-anchor="end">profiling peak <tspan class="num" style="fill:#0f172a">1.40</tspan></text>
<line x1="694.7" y1="351" x2="694.7" y2="381" stroke="#94a3b8"/>
<text x="690.7" y="393" class="small" text-anchor="end">MoE workspace <tspan class="num" style="fill:#0f172a">0.50</tspan></text>
<line x1="700.3" y1="351" x2="700.3" y2="399" stroke="#94a3b8"/>
<text x="696.3" y="411" class="small" text-anchor="end">outside PyTorch <tspan class="num" style="fill:#0f172a">0.03</tspan></text>
<line x1="910.0" y1="289" x2="910.0" y2="355" stroke="#0f172a" stroke-width="2" stroke-dasharray="4 3"/>
<text x="1060" y="429" class="small" text-anchor="end">KV pool: <tspan class="num" style="fill:#15803d">216,848</tspan> tokens. Dashed line: utilization 0.85 of the total, what vLLM requests</text>
<line x1="60" y1="456" x2="1060" y2="456" stroke="#94a3b8"/>
<line x1="60.0" y1="456" x2="60.0" y2="461" stroke="#94a3b8"/>
<text x="60.0" y="476" class="tick" text-anchor="middle">0</text>
<line x1="228.8" y1="456" x2="228.8" y2="461" stroke="#94a3b8"/>
<text x="228.8" y="476" class="tick" text-anchor="middle">8</text>
<line x1="397.6" y1="456" x2="397.6" y2="461" stroke="#94a3b8"/>
<text x="397.6" y="476" class="tick" text-anchor="middle">16</text>
<line x1="566.3" y1="456" x2="566.3" y2="461" stroke="#94a3b8"/>
<text x="566.3" y="476" class="tick" text-anchor="middle">24</text>
<line x1="735.1" y1="456" x2="735.1" y2="461" stroke="#94a3b8"/>
<text x="735.1" y="476" class="tick" text-anchor="middle">32</text>
<line x1="903.9" y1="456" x2="903.9" y2="461" stroke="#94a3b8"/>
<text x="903.9" y="476" class="tick" text-anchor="middle">40</text>
<text x="1060" y="476" class="tick" text-anchor="end">GiB</text>
</svg>
