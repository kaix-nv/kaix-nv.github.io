<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc">
<title id="title">Memory per GPU: Llama-2-7B, 8 data-parallel H100s, by ZeRO stage</title>
<desc id="desc">Stacked bars of weights, gradients, optimizer state and activations per GPU for Llama-2-7B trained data-parallel on 8 GPUs with one 4096-token sequence per GPU, no recompute. ZeRO-0 needs 121 GB, over an 80 GB H100; ZeRO-1 shards the optimizer state and needs 50 GB; ZeRO-2 38 GB; ZeRO-3 26 GB. Activations, 12.9 GB, are the same in every bar.</desc>
<defs><style>
  .title { font: 700 20px system-ui, sans-serif; fill: #0f172a; }
  .head { font: 600 14px system-ui, sans-serif; fill: #0f172a; }
  .label { font: 500 13px system-ui, sans-serif; fill: #334155; }
  .note { font: 500 12px system-ui, sans-serif; fill: #475569; }
  .num { font: 600 11px ui-monospace, monospace; fill: #0f172a; }
  .dim { font: 600 13px ui-monospace, monospace; fill: #334155; }
</style></defs>
<rect width="1000" height="400" rx="16" fill="#f8fafc"/>
<text x="30" y="36" class="title">Memory per GPU: Llama-2-7B on 8 data-parallel GPUs, 4096-token micro-batch</text>
<text x="98" y="97.0" class="head" text-anchor="end">ZeRO-0</text>
