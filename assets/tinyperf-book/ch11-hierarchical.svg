<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" role="img"
     aria-labelledby="title description">
  <title id="title">A hierarchical all-reduce across two nodes, in three phases</title>
  <desc id="description">
    Eight GPUs in two nodes of four. Every GPU starts with its own partial result for a whole
    buffer, drawn as four chunks. Phase 1, a reduce-scatter inside each node over NVLink, leaves
    GPU i with chunk i summed over its node. Phase 2, an all-reduce across nodes over InfiniBand,
    pairs GPU i of one node with GPU i of the other; each pair sums only its own chunk, a quarter
    of the buffer, so four exchanges run side by side, one per network card. Afterwards GPU i
    holds chunk i summed over all eight GPUs. Phase 3, an all-gather inside each node over
    NVLink, gives every GPU all four summed chunks. The time is the NVLink ring's bandwidth term
    over the whole buffer plus the InfiniBand ring's over one GPU's chunk of it. On H100s the
    InfiniBand phase moves an eighth of the bytes at a ninth of NVLink's rate.
  </desc>
