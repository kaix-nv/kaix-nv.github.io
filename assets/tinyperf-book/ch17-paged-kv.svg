<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" role="img" aria-labelledby="title desc">
  <title id="title">Paged KV: blocks on demand, a preemption, and what reservation holds back</title>
  <desc id="desc">A pool of 24 KV blocks of 16 tokens each shared by three requests, A (oldest), B and C (newest). Top row, paged admission as vLLM does it: 1, the pool is full, with A holding 9 blocks, B 8 and C 7, scattered through the pool, and A needs a tenth; 2, the newest request, C, is preempted: its 7 blocks are freed, A takes one, and C goes to the front of the queue; 3, once A finishes, C is admitted again and recomputes its prompt and the tokens it had generated, while B, which kept growing, holds 10 blocks. Bottom row, a reserving scheduler: A and B each hold 12 blocks from admission, what prompt plus maximum output could need; 7 of the 24 blocks hold nothing yet, and C waits in the queue.</desc>
  <defs>
    <style>
      .title { font: 700 24px system-ui, sans-serif; fill: #0f172a; }
      .sub { font: 400 15px system-ui, sans-serif; fill: #475569; }
      .head { font: 700 16px system-ui, sans-serif; fill: #0f172a; }
      .label { font: 600 15px system-ui, sans-serif; fill: #0f172a; }
      .small { font: 500 14px system-ui, sans-serif; fill: #334155; }
      .blk { font: 700 12px ui-monospace, monospace; }
    </style>
  </defs>
  <rect width="1100" height="640" rx="16" fill="#f8fafc"/>
  <text x="40" y="44" class="title">Paged KV: blocks on demand, and a preemption</text>
  <text x="40" y="70" class="sub">A pool of 24 blocks of 16 tokens. A request takes a new block when it fills its last one; its blocks need not be adjacent.</text>
  <text x="40" y="112" class="label">Paged, as vLLM admits: blocks for the tokens a request holds now</text>
  <text x="40" y="144" class="head">1. The pool is full</text>
  <text x="400" y="144" class="head">2. Preempt the newest</text>
  <text x="760" y="144" class="head">3. Later, C resumes</text>
