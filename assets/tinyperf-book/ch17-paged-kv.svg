  <text x="40" y="316" class="small">A (oldest) holds 9 blocks, B 8,</text>
  <text x="40" y="336" class="small">C (newest) 7. A has filled its</text>
  <text x="40" y="356" class="small">last block and needs a tenth:</text>
  <text x="40" y="376" class="small">none is free.</text>
  <text x="400" y="316" class="small">C's 7 blocks are freed; A takes</text>
  <text x="400" y="336" class="small">one (outlined). C goes back to</text>
  <text x="400" y="356" class="small">the front of the queue, and no one</text>
  <text x="400" y="376" class="small">new is admitted this step.</text>
  <text x="760" y="316" class="small">A has finished; B has grown to 10.</text>
  <text x="760" y="336" class="small">C is admitted again and recomputes</text>
  <text x="760" y="356" class="small">its prompt and every token it had</text>
  <text x="760" y="376" class="small">generated. Its first token stands.</text>
