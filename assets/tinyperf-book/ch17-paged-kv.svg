  <text x="360" y="460" class="small">A and B each hold 12 blocks, what prompt + maximum output could need. They have</text>
  <text x="360" y="480" class="small">filled 9 and 8; the other 7 (dashed) hold nothing yet: phantom blocks, reserved</text>
  <text x="360" y="500" class="small">for output not yet generated, or never to be generated if the reply stops early.</text>
  <text x="360" y="520" class="small">C waits in the queue, though the paged pool above runs it. Reservation never</text>
  <text x="360" y="540" class="small">preempts, and never runs more requests than it can finish.</text>
