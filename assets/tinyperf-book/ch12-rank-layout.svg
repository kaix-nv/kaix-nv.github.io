  <!-- all-reduce inside each pair -->
  <g stroke="#2563eb" stroke-width="2" fill="none">
    <line x1="178" y1="185" x2="202" y2="185" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <line x1="418" y1="185" x2="442" y2="185" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <line x1="658" y1="185" x2="682" y2="185" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <line x1="898" y1="185" x2="922" y2="185" marker-start="url(#arr)" marker-end="url(#arr)"/>
  </g>

  <!-- the expert band -->
  <g stroke="#ea580c" stroke-width="2">
    <line x1="135" y1="372" x2="135" y2="398"/><line x1="245" y1="372" x2="245" y2="398"/>
    <line x1="375" y1="372" x2="375" y2="398"/><line x1="485" y1="372" x2="485" y2="398"/>
    <line x1="615" y1="372" x2="615" y2="398"/><line x1="725" y1="372" x2="725" y2="398"/>
    <line x1="855" y1="372" x2="855" y2="398"/><line x1="965" y1="372" x2="965" y2="398"/>
  </g>
  <rect x="85" y="398" width="930" height="42" rx="10" fill="#fdba74"/>
  <text x="550" y="424" class="label" text-anchor="middle">every MoE layer: each token goes to its experts' GPUs and comes back (ep = 8)</text>

  <text x="85" y="478" class="small">↔ inside a pair: tensor parallelism (tp = 2), two all-reduces per layer, as in chapter 11.</text>
  <text x="85" y="502" class="small">world = tp × cp × dp × pp = <tspan class="num">2 × 1 × 4 × 1 = 8</tspan>. The global batch of 64 is split 16 per replica; the experts see all 64.</text>
  <text x="85" y="526" class="small">A pipeline (pp = 2) would repeat this picture for the second half of the layers and hand activations across.</text>
  <text x="85" y="550" class="small">Context parallelism (cp = 2) would repeat it for the second half of every sequence.</text>
</svg>
