    <text x="965" y="200" class="inbox" text-anchor="middle">32 heads</text>
    <rect x="923" y="222" width="84" height="46" rx="6" fill="#dbeafe"/>
    <text x="965" y="242" class="inboxdark" text-anchor="middle">KV cache,</text>
    <text x="965" y="259" class="inboxdark" text-anchor="middle">16 requests</text>
    <rect x="923" y="290" width="84" height="62" rx="6" fill="#ea580c"/>
