    <text x="135" y="144" class="label" text-anchor="middle">GPU 0</text>
    <rect x="93" y="154" width="84" height="62" rx="6" fill="#2563eb"/>
    <text x="135" y="180" class="inbox" text-anchor="middle">attention</text>
    <text x="135" y="200" class="inbox" text-anchor="middle">32 heads</text>
    <rect x="93" y="222" width="84" height="46" rx="6" fill="#dbeafe"/>
    <text x="135" y="242" class="inboxdark" text-anchor="middle">KV cache,</text>
    <text x="135" y="259" class="inboxdark" text-anchor="middle">16 requests</text>
    <rect x="93" y="290" width="84" height="62" rx="6" fill="#ea580c"/>
    <text x="135" y="316" class="inbox" text-anchor="middle">experts</text>
    <text x="135" y="336" class="inbox" text-anchor="middle">0–15</text>

    <rect x="195" y="122" width="100" height="250" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="245" y="144" class="label" text-anchor="middle">GPU 1</text>
    <rect x="203" y="154" width="84" height="62" rx="6" fill="#2563eb"/>
    <text x="245" y="180" class="inbox" text-anchor="middle">attention</text>
    <text x="245" y="200" class="inbox" text-anchor="middle">32 heads</text>
    <rect x="203" y="222" width="84" height="46" rx="6" fill="#dbeafe"/>
    <text x="245" y="242" class="inboxdark" text-anchor="middle">KV cache,</text>
    <text x="245" y="259" class="inboxdark" text-anchor="middle">16 requests</text>
    <rect x="203" y="290" width="84" height="62" rx="6" fill="#ea580c"/>
    <text x="245" y="316" class="inbox" text-anchor="middle">experts</text>
    <text x="245" y="336" class="inbox" text-anchor="middle">16–31</text>

    <!-- group 1 -->
    <rect x="325" y="122" width="100" height="250" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="375" y="144" class="label" text-anchor="middle">GPU 2</text>
    <rect x="333" y="154" width="84" height="62" rx="6" fill="#2563eb"/>
    <text x="375" y="180" class="inbox" text-anchor="middle">attention</text>
    <text x="375" y="200" class="inbox" text-anchor="middle">32 heads</text>
    <rect x="333" y="222" width="84" height="46" rx="6" fill="#dbeafe"/>
    <text x="375" y="242" class="inboxdark" text-anchor="middle">KV cache,</text>
    <text x="375" y="259" class="inboxdark" text-anchor="middle">16 requests</text>
    <rect x="333" y="290" width="84" height="62" rx="6" fill="#ea580c"/>
    <text x="375" y="316" class="inbox" text-anchor="middle">experts</text>
    <text x="375" y="336" class="inbox" text-anchor="middle">32–47</text>

    <rect x="435" y="122" width="100" height="250" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="485" y="144" class="label" text-anchor="middle">GPU 3</text>
    <rect x="443" y="154" width="84" height="62" rx="6" fill="#2563eb"/>
    <text x="485" y="180" class="inbox" text-anchor="middle">attention</text>
    <text x="485" y="200" class="inbox" text-anchor="middle">32 heads</text>
    <rect x="443" y="222" width="84" height="46" rx="6" fill="#dbeafe"/>
    <text x="485" y="242" class="inboxdark" text-anchor="middle">KV cache,</text>
    <text x="485" y="259" class="inboxdark" text-anchor="middle">16 requests</text>
    <rect x="443" y="290" width="84" height="62" rx="6" fill="#ea580c"/>
    <text x="485" y="316" class="inbox" text-anchor="middle">experts</text>
    <text x="485" y="336" class="inbox" text-anchor="middle">48–63</text>

    <!-- group 2 -->
    <rect x="565" y="122" width="100" height="250" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="615" y="144" class="label" text-anchor="middle">GPU 4</text>
    <rect x="573" y="154" width="84" height="62" rx="6" fill="#2563eb"/>
    <text x="615" y="180" class="inbox" text-anchor="middle">attention</text>
    <text x="615" y="200" class="inbox" text-anchor="middle">32 heads</text>
    <rect x="573" y="222" width="84" height="46" rx="6" fill="#dbeafe"/>
    <text x="615" y="242" class="inboxdark" text-anchor="middle">KV cache,</text>
    <text x="615" y="259" class="inboxdark" text-anchor="middle">16 requests</text>
    <rect x="573" y="290" width="84" height="62" rx="6" fill="#ea580c"/>
    <text x="615" y="316" class="inbox" text-anchor="middle">experts</text>
    <text x="615" y="336" class="inbox" text-anchor="middle">64–79</text>

    <rect x="675" y="122" width="100" height="250" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="725" y="144" class="label" text-anchor="middle">GPU 5</text>
    <rect x="683" y="154" width="84" height="62" rx="6" fill="#2563eb"/>
    <text x="725" y="180" class="inbox" text-anchor="middle">attention</text>
    <text x="725" y="200" class="inbox" text-anchor="middle">32 heads</text>
    <rect x="683" y="222" width="84" height="46" rx="6" fill="#dbeafe"/>
    <text x="725" y="242" class="inboxdark" text-anchor="middle">KV cache,</text>
    <text x="725" y="259" class="inboxdark" text-anchor="middle">16 requests</text>
    <rect x="683" y="290" width="84" height="62" rx="6" fill="#ea580c"/>
    <text x="725" y="316" class="inbox" text-anchor="middle">experts</text>
    <text x="725" y="336" class="inbox" text-anchor="middle">80–95</text>

    <!-- group 3 -->
    <rect x="805" y="122" width="100" height="250" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="855" y="144" class="label" text-anchor="middle">GPU 6</text>
    <rect x="813" y="154" width="84" height="62" rx="6" fill="#2563eb"/>
    <text x="855" y="180" class="inbox" text-anchor="middle">attention</text>
    <text x="855" y="200" class="inbox" text-anchor="middle">32 heads</text>
    <rect x="813" y="222" width="84" height="46" rx="6" fill="#dbeafe"/>
    <text x="855" y="242" class="inboxdark" text-anchor="middle">KV cache,</text>
    <text x="855" y="259" class="inboxdark" text-anchor="middle">16 requests</text>
    <rect x="813" y="290" width="84" height="62" rx="6" fill="#ea580c"/>
    <text x="855" y="316" class="inbox" text-anchor="middle">experts</text>
