    <rect x="915" y="122" width="100" height="250" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="965" y="144" class="label" text-anchor="middle">GPU 7</text>
    <rect x="923" y="154" width="84" height="62" rx="6" fill="#2563eb"/>
