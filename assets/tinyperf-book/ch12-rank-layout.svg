<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" role="img"
     aria-labelledby="title description">
  <title id="title">One rank layout: eight GPUs as tp=2 x dp=4, with experts over all eight (ep=8)</title>
  <desc id="description">
    Eight GPUs drawn as four pairs. Each pair is a tensor-parallel group of two
    GPUs and one attention replica: each GPU of the pair holds half of the
    attention heads and runs the attention for the replica's own sixteen
    requests of a global batch of sixty-four, all-reducing inside the pair.
    Every GPU also holds sixteen whole experts of the model's 128, so experts
    0 to 15 sit on GPU 0, 16 to 31 on GPU 1, and so on. Below the GPUs, one
    band spans all eight: in every MoE layer tokens travel to their experts'
    GPUs and back. A note says the world is tp x cp x dp x pp = 8, that a
    pipeline of two stages would repeat the picture for the second half of
    the layers, and that two context-parallel ranks would repeat it for the
    second half of every sequence.
  </desc>
  <defs>
    <style>
      .title { font: 700 24px system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px system-ui, sans-serif; fill: #475569; }
      .label { font: 600 15px system-ui, sans-serif; fill: #0f172a; }
      .small { font: 500 13px system-ui, sans-serif; fill: #334155; }
      .inbox { font: 600 13px system-ui, sans-serif; fill: #ffffff; }
      .inboxdark { font: 600 13px system-ui, sans-serif; fill: #0f172a; }
      .num { font: 700 14px ui-monospace, monospace; fill: #0f172a; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1100" height="580" rx="18" fill="#f8fafc"/>
  <text x="40" y="44" class="title">Eight GPUs as tp=2 × dp=4, with experts over all eight (ep=8)</text>
  <text x="40" y="70" class="subtitle">Each pair is an attention replica: each GPU holds 32 of the 64 heads, and 16 whole experts of the 128.</text>

  <!-- replica brackets -->
  <g>
    <path d="M 85 112 L 85 104 L 295 104 L 295 112" fill="none" stroke="#2563eb" stroke-width="2"/>
    <text x="190" y="96" class="label" text-anchor="middle">replica 0: requests 0–15</text>
    <path d="M 325 112 L 325 104 L 535 104 L 535 112" fill="none" stroke="#2563eb" stroke-width="2"/>
    <text x="430" y="96" class="label" text-anchor="middle">replica 1: requests 16–31</text>
    <path d="M 565 112 L 565 104 L 775 104 L 775 112" fill="none" stroke="#2563eb" stroke-width="2"/>
    <text x="670" y="96" class="label" text-anchor="middle">replica 2: requests 32–47</text>
    <path d="M 805 112 L 805 104 L 1015 104 L 1015 112" fill="none" stroke="#2563eb" stroke-width="2"/>
    <text x="910" y="96" class="label" text-anchor="middle">replica 3: requests 48–63</text>
  </g>

