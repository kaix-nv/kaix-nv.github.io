<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 460" role="img" aria-labelledby="title desc">
<title id="title">The colocated pair and 1P1D against load: Qwen3-8B on two RTX A6000s</title>
<desc id="desc">Two panels against the offered load, 1 to 8 requests per second, for 240 requests of 1024 tokens in and 128 out. Left: median TTFT on a log scale. The colocated pair stays between about 220 and 460 ms; 1P1D starts about 50 ms higher and climbs from 3 requests per second, past 4.5 seconds at 8, as its one prefill GPU saturates. Right: mean TPOT. The pair's rises from 27 to 93 ms as prompt steps interrupt more decodes; 1P1D's rises only from 26 to 35 ms. The model (dashed) follows the measurements (solid, through points); its 1P1D TTFT runs low at 6 to 8 requests per second.</desc>
