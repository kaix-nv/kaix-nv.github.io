<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 310" role="img" aria-labelledby="title desc">
<title id="title">Where the time goes: Llama-2-7B on the A100, datasheet rates</title>
<desc id="desc">Share of each step&#x27;s time in four groups, each row&#x27;s launch overhead counted apart. Decode at batch 1 (8.33 ms): weight GEMMs 78%, attention 7%, launches 15%. Prefill of 2048 tokens (112 ms): weight GEMMs 81%, attention as built 12%, other memory-bound operations 5%, launches 1%.</desc>
<defs><style>.title { font: 700 22px system-ui, sans-serif; fill: #0f172a; } .label { font: 600 14px system-ui, sans-serif; fill: #0f172a; } .num { font: 500 13px ui-monospace, monospace; fill: #475569; } .in { font: 600 13px ui-monospace, monospace; fill: #ffffff; } .legend { font: 600 13px system-ui, sans-serif; fill: #334155; } .tick { font: 500 12px system-ui, sans-serif; fill: #475569; }</style></defs>
<rect width="1000" height="310" rx="16" fill="#f8fafc"/>
<text x="40" y="40" class="title">Where the time goes: Llama-2-7B on the A100, datasheet rates</text>
<rect x="40" y="62" width="14" height="14" rx="2" fill="#2563eb"/>
<text x="60" y="74" class="legend">weight GEMMs</text>
<rect x="200" y="62" width="14" height="14" rx="2" fill="#ea580c"/>
<text x="220" y="74" class="legend">attention: QKᵀ, softmax, PV</text>
<rect x="460" y="62" width="14" height="14" rx="2" fill="#15803d"/>
<text x="480" y="74" class="legend">other memory-bound ops</text>
<rect x="700" y="62" width="14" height="14" rx="2" fill="#94a3b8"/>
<text x="720" y="74" class="legend">launch overhead</text>
<line x1="190.0" y1="112" x2="190.0" y2="260" stroke="#cbd5e1" stroke-dasharray="3 4"/>
<text x="190.0" y="276" class="tick" text-anchor="middle">0%</text>
<line x1="382.5" y1="112" x2="382.5" y2="260" stroke="#cbd5e1" stroke-dasharray="3 4"/>
<text x="382.5" y="276" class="tick" text-anchor="middle">25%</text>
<line x1="575.0" y1="112" x2="575.0" y2="260" stroke="#cbd5e1" stroke-dasharray="3 4"/>
<text x="575.0" y="276" class="tick" text-anchor="middle">50%</text>
<line x1="767.5" y1="112" x2="767.5" y2="260" stroke="#cbd5e1" stroke-dasharray="3 4"/>
<text x="767.5" y="276" class="tick" text-anchor="middle">75%</text>
<line x1="960.0" y1="112" x2="960.0" y2="260" stroke="#cbd5e1" stroke-dasharray="3 4"/>
<text x="960.0" y="276" class="tick" text-anchor="middle">100%</text>
<text x="176" y="143.0" class="label" text-anchor="end">decode, batch 1</text>
<text x="176" y="161.0" class="num" text-anchor="end">8.33 ms</text>
<rect x="190.0" y="120" width="600.4" height="52" fill="#2563eb"/>
<text x="490.2" y="151.0" class="in" text-anchor="middle">78%</text>
<rect x="790.4" y="120" width="52.9" height="52" fill="#ea580c"/>
<text x="816.9" y="151.0" class="in" text-anchor="middle">7%</text>
<rect x="843.3" y="120" width="0.3" height="52" fill="#15803d"/>
<rect x="843.6" y="120" width="116.4" height="52" fill="#94a3b8"/>
<text x="901.8" y="151.0" class="in" text-anchor="middle">15%</text>
<text x="176" y="225.0" class="label" text-anchor="end">prefill, 2048 tokens</text>
<text x="176" y="243.0" class="num" text-anchor="end">112.07 ms</text>
<rect x="190.0" y="202" width="625.7" height="52" fill="#2563eb"/>
<text x="502.9" y="233.0" class="in" text-anchor="middle">81%</text>
<rect x="815.7" y="202" width="94.4" height="52" fill="#ea580c"/>
<text x="862.9" y="233.0" class="in" text-anchor="middle">12%</text>
<rect x="910.1" y="202" width="41.3" height="52" fill="#15803d"/>
<text x="930.7" y="233.0" class="in" text-anchor="middle">5%</text>
<rect x="951.3" y="202" width="8.7" height="52" fill="#94a3b8"/>
</svg>
