<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
<title id="title">Where speculation wins: speedup by batch and context</title>
<desc id="desc">Two heat maps of the speedup of speculative decoding over plain decoding on an RTX A6000, k = 4, acceptance 0.8, by batch (1 to 128) and context (256 to 16384 tokens). Left, Qwen3-8B with a Qwen3-0.6B draft: 2.17 at batch 1 and 256 tokens, falling with batch and context, because the draft&#x27;s own cache is 78 percent the size of the target&#x27;s; the only loss that fits in memory is 0.85 at batch 128 and 256 tokens, and the losses at 4096 tokens and more are in cells that need more than 48 GB. Right, Llama-2-7B with a TinyLlama-1.1B draft, whose cache is 4 percent of the target&#x27;s: in cells that fit, 1.92 to 2.07 at 1024 tokens and 1.99 to 2.25 at 4096; its largest gains, up to 2.85, are in cells that do not fit. Cells that do not fit are faded with a dashed outline.</desc>
