<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">How far ahead to draft: an MTP head run k times</title>
<desc id="desc">Speedup over plain decoding against the number of drafted tokens k, 1 to 16, for Qwen3.8-27B with its MTP head on a B200 at batch 1, context 4096, first-position acceptance 0.8. With i.i.d. acceptance the speedup rises to about 3.0 at k = 8. When acceptance decays with position it peaks at k = 3 or 4, between 2.0 and 2.5, and falls for deeper drafts.</desc>
<defs><style>
  .title { font: 700 22px system-ui, sans-serif; fill: #0f172a; }
  .axis { font: 500 14px system-ui, sans-serif; fill: #334155; }
  .tick { font: 500 12px system-ui, sans-serif; fill: #475569; }
  .legend { font: 600 13px system-ui, sans-serif; fill: #334155; }
  .note { font: 500 12px system-ui, sans-serif; fill: #64748b; }
</style></defs>
<rect width="900" height="520" rx="16" fill="#f8fafc"/>
<text x="80" y="36" class="title">How far ahead to draft: an MTP head run k times</text>
<line x1="80" y1="450.0" x2="870" y2="450.0" stroke="#e2e8f0"/>
<text x="72" y="454.0" class="tick" text-anchor="end">1</text>
<line x1="80" y1="372.0" x2="870" y2="372.0" stroke="#e2e8f0"/>
<text x="72" y="376.0" class="tick" text-anchor="end">1.5</text>
<line x1="80" y1="294.0" x2="870" y2="294.0" stroke="#e2e8f0"/>
<text x="72" y="298.0" class="tick" text-anchor="end">2</text>
<line x1="80" y1="216.0" x2="870" y2="216.0" stroke="#e2e8f0"/>
<text x="72" y="220.0" class="tick" text-anchor="end">2.5</text>
<line x1="80" y1="138.0" x2="870" y2="138.0" stroke="#e2e8f0"/>
<text x="72" y="142.0" class="tick" text-anchor="end">3</text>
<line x1="80" y1="60.0" x2="870" y2="60.0" stroke="#e2e8f0"/>
<text x="72" y="64.0" class="tick" text-anchor="end">3.5</text>
<text x="80.0" y="470" class="tick" text-anchor="middle">1</text>
<text x="132.7" y="470" class="tick" text-anchor="middle">2</text>
<text x="238.0" y="470" class="tick" text-anchor="middle">4</text>
<text x="343.3" y="470" class="tick" text-anchor="middle">6</text>
<text x="448.7" y="470" class="tick" text-anchor="middle">8</text>
<text x="554.0" y="470" class="tick" text-anchor="middle">10</text>
<text x="659.3" y="470" class="tick" text-anchor="middle">12</text>
<text x="764.7" y="470" class="tick" text-anchor="middle">14</text>
<text x="870.0" y="470" class="tick" text-anchor="middle">16</text>
<line x1="448.7" y1="60" x2="448.7" y2="450" stroke="#cbd5e1" stroke-dasharray="3 4"/>
<text x="452.7" y="442" class="note">best k, i.i.d.</text>
<line x1="185.3" y1="60" x2="185.3" y2="450" stroke="#cbd5e1" stroke-dasharray="3 4"/>
<text x="189.3" y="442" class="note">best k, decay 0.8</text>
<line x1="80" y1="450" x2="870" y2="450" stroke="#64748b"/>
<line x1="80" y1="60" x2="80" y2="450" stroke="#64748b"/>
