<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img"
     aria-labelledby="title description">
  <title id="title">A decode step of 9 sequences in the 16-row CUDA graph</title>
  <desc id="description">
    A decode step with 9 running sequences replays the CUDA graph captured
    for 16 rows. The weight GEMMs, the LM head and the small ops run all 16
    rows; below 32 rows that costs almost nothing, because their time is
    reading the weights once. Attention reads only the 9 real sequences'
    caches, each at its own length, since a padded slot holds no KV. The
    sampler runs on the 9 real rows. At context 1024 the model prices the
    step at 26.58 ms; charging attention for all 16 rows would read 28.18 ms,
    6.0 percent high, and the step unpadded, at 9 rows, would be 0.4 percent
    cheaper. A step of 33 sequences runs the 40-row graph, where
    cuBLAS is slower, and padding costs 5.2 percent.
  </desc>
  <defs>
    <style>
      .title { font: 700 26px system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px system-ui, sans-serif; fill: #475569; }
      .label { font: 600 15px system-ui, sans-serif; fill: #0f172a; }
      .small { font: 500 14px system-ui, sans-serif; fill: #334155; }
      .tiny { font: 500 12px system-ui, sans-serif; fill: #475569; }
      .num { font: 700 15px ui-monospace, monospace; fill: #0f172a; }
    </style>
  </defs>
  <rect width="1100" height="560" rx="18" fill="#f8fafc"/>
  <text x="40" y="46" class="title">A padded step: 9 sequences in the 16-row graph</text>
  <text x="40" y="72" class="subtitle">The GEMMs run every row the graph was captured for. Attention and the sampler run only on the real sequences.</text>

  <!-- the graph's 16 rows: 9 real, 7 padded -->
  <text x="60" y="112" class="label">the graph's 16 rows</text>
  <g fill="#2563eb">
    <rect x="60" y="124" width="150" height="20" rx="3"/><rect x="60" y="148" width="150" height="20" rx="3"/>
    <rect x="60" y="172" width="150" height="20" rx="3"/><rect x="60" y="196" width="150" height="20" rx="3"/>
    <rect x="60" y="220" width="150" height="20" rx="3"/><rect x="60" y="244" width="150" height="20" rx="3"/>
    <rect x="60" y="268" width="150" height="20" rx="3"/><rect x="60" y="292" width="150" height="20" rx="3"/>
    <rect x="60" y="316" width="150" height="20" rx="3"/>
  </g>
  <g fill="#e2e8f0" stroke="#94a3b8" stroke-dasharray="4 3">
    <rect x="60" y="340" width="150" height="20" rx="3"/><rect x="60" y="364" width="150" height="20" rx="3"/>
    <rect x="60" y="388" width="150" height="20" rx="3"/><rect x="60" y="412" width="150" height="20" rx="3"/>
    <rect x="60" y="436" width="150" height="20" rx="3"/><rect x="60" y="460" width="150" height="20" rx="3"/>
    <rect x="60" y="484" width="150" height="20" rx="3"/>
  </g>
  <text x="135" y="232" class="small" fill="#ffffff" text-anchor="middle" style="fill:#ffffff">9 sequences</text>
  <text x="135" y="428" class="small" text-anchor="middle">7 padded slots</text>

  <!-- GEMMs: all 16 rows -->
  <text x="250" y="104" class="label">GEMMs, LM head,</text>
  <text x="250" y="120" class="label">small ops: 16 rows</text>
  <rect x="250" y="124" width="140" height="380" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="320" y="296" class="small" text-anchor="middle">weights read</text>
  <text x="320" y="316" class="small" text-anchor="middle">once for</text>
  <text x="320" y="336" class="small" text-anchor="middle">all 16 rows</text>

  <!-- attention: the 9 caches, each its own length -->
  <text x="430" y="120" class="label">attention: 9 caches</text>
  <g fill="#ea580c">
    <rect x="430" y="128" width="190" height="12" rx="2"/><rect x="430" y="152" width="80" height="12" rx="2"/>
    <rect x="430" y="176" width="230" height="12" rx="2"/><rect x="430" y="200" width="120" height="12" rx="2"/>
    <rect x="430" y="224" width="160" height="12" rx="2"/><rect x="430" y="248" width="60" height="12" rx="2"/>
    <rect x="430" y="272" width="210" height="12" rx="2"/><rect x="430" y="296" width="140" height="12" rx="2"/>
    <rect x="430" y="320" width="100" height="12" rx="2"/>
  </g>
  <line x1="573" y1="124" x2="573" y2="340" stroke="#0f172a" stroke-dasharray="5 4" stroke-width="1.5"/>
  <text x="579" y="354" class="tiny">mean context</text>
  <text x="430" y="400" class="small">no KV in a padded slot:</text>
  <text x="430" y="420" class="small">nothing to read</text>

  <!-- sampler: 9 rows -->
  <text x="700" y="104" class="label">sampler:</text>
  <text x="700" y="120" class="label">9 rows</text>
  <g fill="#15803d">
    <rect x="700" y="126" width="46" height="16" rx="3"/><rect x="700" y="150" width="46" height="16" rx="3"/>
    <rect x="700" y="174" width="46" height="16" rx="3"/><rect x="700" y="198" width="46" height="16" rx="3"/>
    <rect x="700" y="222" width="46" height="16" rx="3"/><rect x="700" y="246" width="46" height="16" rx="3"/>
    <rect x="700" y="270" width="46" height="16" rx="3"/><rect x="700" y="294" width="46" height="16" rx="3"/>
    <rect x="700" y="318" width="46" height="16" rx="3"/>
  </g>

  <!-- what it costs, from Table 15.4 -->
  <text x="810" y="104" class="label">at context 1,024</text>
  <text x="810" y="120" class="label">(Table 15.4)</text>
  <text x="810" y="156" class="small">as the engine runs it</text>
  <text x="810" y="178" class="num">26.58 ms</text>
  <text x="810" y="216" class="small">attention for all 16 rows</text>
  <text x="810" y="238" class="num">28.18 ms, 6.0% high</text>
  <text x="810" y="276" class="small">unpadded, 9 rows</text>
  <text x="810" y="298" class="num">26.48 ms: padding 0.4%</text>
  <line x1="810" y1="330" x2="1070" y2="330" stroke="#cbd5e1"/>
  <text x="810" y="362" class="small">33 sequences run the 40-row</text>
  <text x="810" y="382" class="small">graph, past cuBLAS's change</text>
  <text x="810" y="402" class="small">at 32 rows:</text>
  <text x="810" y="424" class="num">padding costs 5.2%</text>
</svg>
