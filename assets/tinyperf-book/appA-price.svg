<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">The price of latency: Qwen3-8B, 1024 tokens in, 128 out</title>
<desc id="desc">Dollars per million output tokens (log scale) against the p95 TPOT target (log scale) for an RTX A6000, an H100 SXM and a B200, each serving at the busiest rate that meets the target and a p95 TTFT of 1 s. Each curve starts at its GPU&#x27;s wall, a decode step with one sequence, falls steeply, then turns flat where the TTFT target and the 64 seats bind instead.</desc>
