<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">The cost of one generated token: Qwen3-8B decode on an A100</title>
<desc id="desc">Microseconds per generated token against the decode batch, 1 to 512, both axes logarithmic, A100 at datasheet rates. The weight GEMMs&#x27; cost per token falls as one over the batch until about 128 sequences, then flattens near the math floor of 48 microseconds; the dashed roofline turns at the ridge point, 153. The whole step flattens earlier the longer the context: at 8192 tokens of context the KV cache reads overtake the weights at about 13 sequences.</desc>
<defs><style>
  .title { font: 700 22px system-ui, sans-serif; fill: #0f172a; }
  .axis { font: 500 14px system-ui, sans-serif; fill: #334155; }
  .tick { font: 500 12px system-ui, sans-serif; fill: #475569; }
  .legend { font: 600 13px system-ui, sans-serif; fill: #334155; }
  .note { font: 500 12px system-ui, sans-serif; fill: #64748b; }
</style></defs>
