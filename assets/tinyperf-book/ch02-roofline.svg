<text x="72" y="298.0" class="tick" text-anchor="end">10</text>
<line x1="80" y1="216.0" x2="870" y2="216.0" stroke="#e2e8f0"/>
<text x="72" y="220.0" class="tick" text-anchor="end">100</text>
<line x1="80" y1="138.0" x2="870" y2="138.0" stroke="#e2e8f0"/>
<text x="72" y="142.0" class="tick" text-anchor="end">1,000</text>
<line x1="80" y1="60.0" x2="870" y2="60.0" stroke="#e2e8f0"/>
<text x="72" y="64.0" class="tick" text-anchor="end">10,000</text>
<text x="80.0" y="470" class="tick" text-anchor="middle">0.5</text>
<text x="140.8" y="470" class="tick" text-anchor="middle">1</text>
<text x="201.5" y="470" class="tick" text-anchor="middle">2</text>
<text x="262.3" y="470" class="tick" text-anchor="middle">4</text>
<text x="323.1" y="470" class="tick" text-anchor="middle">8</text>
<text x="383.8" y="470" class="tick" text-anchor="middle">16</text>
<text x="444.6" y="470" class="tick" text-anchor="middle">32</text>
<text x="505.4" y="470" class="tick" text-anchor="middle">64</text>
<text x="566.2" y="470" class="tick" text-anchor="middle">128</text>
<text x="626.9" y="470" class="tick" text-anchor="middle">256</text>
<text x="687.7" y="470" class="tick" text-anchor="middle">512</text>
<text x="748.5" y="470" class="tick" text-anchor="middle">1K</text>
<text x="809.2" y="470" class="tick" text-anchor="middle">2K</text>
<text x="870.0" y="470" class="tick" text-anchor="middle">4K</text>
<line x1="80" y1="450" x2="870" y2="450" stroke="#64748b"/>
<line x1="80" y1="60" x2="80" y2="450" stroke="#64748b"/>
<text x="475.0" y="498" class="axis" text-anchor="middle">arithmetic intensity (FLOPs per byte of DRAM traffic, log scale)</text>
<text x="22" y="255.0" class="axis" text-anchor="middle" transform="rotate(-90 22 255.0)">attainable TFLOPS (log scale)</text>
<polyline points="80.0,325.0 633.9,111.0 870.0,111.0" fill="none" stroke="#ea580c" stroke-width="2.2"/>
<line x1="92.2" y1="71.7" x2="122.2" y2="71.7" stroke="#ea580c" stroke-width="2.2"/>
<text x="130.2" y="75.7" class="legend">B200 SXM: 2,218 TFLOPS, 8,000 GB/s, ridge 277</text>
<polyline points="80.0,354.5 639.4,138.4 870.0,138.4" fill="none" stroke="#2563eb" stroke-width="2.2"/>
