<circle cx="616.6" cy="147.2" r="4" fill="#2563eb" stroke="#f8fafc" stroke-width="1.2"/>
<circle cx="616.6" cy="117.7" r="4" fill="#ea580c" stroke="#f8fafc" stroke-width="1.2"/>
<text x="609.6" y="95.7" class="legend" text-anchor="end">decode, 256 seqs</text>
<text x="609.6" y="111.7" class="note" text-anchor="end">228 FLOP/byte</text>
<line x1="262.2" y1="450.0" x2="262.2" y2="254.6" stroke="#475569" stroke-dasharray="3 4"/>
<circle cx="262.2" cy="334.0" r="4" fill="#94a3b8" stroke="#f8fafc" stroke-width="1.2"/>
