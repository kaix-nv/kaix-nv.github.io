<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">The roofline: attainable fp16 TFLOPS by arithmetic intensity</title>
<desc id="desc">Log-log roofline of four GPUs at fp16. Each roof rises at the DRAM bandwidth and flattens at the peak tensor-core rate; the kink is the ridge point: RTX A6000 202, A100 153, H100 295, B200 277 FLOPs per byte. Vertical markers show one Qwen3-8B layer&#x27;s operations: decode of one sequence at about 1 FLOP per byte and decode attention at 4, far left of every ridge; decode of 64 sequences at 62 and of 256 at 228, near the ridges; prefill of 4096 tokens at 1365, math-bound everywhere.</desc>
<defs><style>
  .title { font: 700 22px system-ui, sans-serif; fill: #0f172a; }
  .axis { font: 500 14px system-ui, sans-serif; fill: #334155; }
  .tick { font: 500 12px system-ui, sans-serif; fill: #475569; }
  .legend { font: 600 13px system-ui, sans-serif; fill: #334155; }
  .note { font: 500 12px system-ui, sans-serif; fill: #64748b; }
</style></defs>
<rect width="900" height="520" rx="16" fill="#f8fafc"/>
<text x="80" y="36" class="title">The roofline: attainable fp16 TFLOPS by arithmetic intensity</text>
<line x1="80" y1="450.0" x2="870" y2="450.0" stroke="#e2e8f0"/>
<text x="72" y="454.0" class="tick" text-anchor="end">0.1</text>
<line x1="80" y1="372.0" x2="870" y2="372.0" stroke="#e2e8f0"/>
<text x="72" y="376.0" class="tick" text-anchor="end">1</text>
