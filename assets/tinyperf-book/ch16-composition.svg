<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
<title id="title">What a mixed step is made of</title>
<desc id="desc">Stacked bars of six Qwen3-8B mixed steps on an RTX A6000, each split into the model&#x27;s parts, with the engine&#x27;s measured step time marked. With 8 decodes the step is almost all per-token GEMM work, and a 1,024-token chunk makes it 4 times longer. With 63 decodes at a 2,048-token context beside a 128-token chunk, FlashAttention-2&#x27;s re-read of the decodes&#x27; cache is over half the step; under FlashInfer it is gone and the step takes under half as long.</desc>
<defs><style>.title{font:700 22px system-ui,sans-serif;fill:#0f172a}.sub{font:400 14px system-ui,sans-serif;fill:#475569}.lab{font:600 13px system-ui,sans-serif;fill:#334155}.tick{font:500 12px ui-monospace,monospace;fill:#475569}.leg{font:600 13px system-ui,sans-serif;fill:#334155}.num{font:600 12px ui-monospace,monospace;fill:#0f172a}</style></defs>
<rect width="1100" height="520" rx="16" fill="#f8fafc"/>
<text x="40" y="38" class="title">What a mixed step is made of</text>
<text x="40" y="62" class="sub">Qwen3-8B on an RTX A6000: the model's parts as bars, the step on the engine's clock as a black mark.</text>
<rect x="40" y="80" width="14" height="14" fill="#2563eb"/>
<text x="60" y="92" class="leg">GEMMs and other per-token work</text>
<rect x="320" y="80" width="14" height="14" fill="#94a3b8"/>
<text x="340" y="92" class="leg">LM head and sampler</text>
<rect x="510" y="80" width="14" height="14" fill="#15803d"/>
<text x="530" y="92" class="leg">chunk&#x27;s attention</text>
<rect x="675" y="80" width="14" height="14" fill="#ea580c"/>
<text x="695" y="92" class="leg">decodes&#x27; attention</text>
<rect x="850" y="80" width="14" height="14" fill="#fdba74"/>
<text x="870" y="92" class="leg">re-read (FA2)</text>
<line x1="320.0" y1="118" x2="320.0" y2="460" stroke="#e2e8f0"/>
<text x="320.0" y="478" class="tick" text-anchor="middle">0</text>
<line x1="418.3" y1="118" x2="418.3" y2="460" stroke="#e2e8f0"/>
<text x="418.3" y="478" class="tick" text-anchor="middle">50</text>
<line x1="516.7" y1="118" x2="516.7" y2="460" stroke="#e2e8f0"/>
<text x="516.7" y="478" class="tick" text-anchor="middle">100</text>
<line x1="615.0" y1="118" x2="615.0" y2="460" stroke="#e2e8f0"/>
<text x="615.0" y="478" class="tick" text-anchor="middle">150</text>
<line x1="713.3" y1="118" x2="713.3" y2="460" stroke="#e2e8f0"/>
<text x="713.3" y="478" class="tick" text-anchor="middle">200</text>
<line x1="811.7" y1="118" x2="811.7" y2="460" stroke="#e2e8f0"/>
<text x="811.7" y="478" class="tick" text-anchor="middle">250</text>
<line x1="910.0" y1="118" x2="910.0" y2="460" stroke="#e2e8f0"/>
<text x="910.0" y="478" class="tick" text-anchor="middle">300</text>
<text x="615.0" y="502" class="lab" text-anchor="middle">milliseconds</text>
<text x="308" y="139" class="lab" text-anchor="end">8 decodes, prompt 256, chunk 128</text>
