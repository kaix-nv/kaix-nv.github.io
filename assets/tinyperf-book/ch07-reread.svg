<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">Extra reads of each decode row&#x27;s cache beside a prompt chunk</title>
<desc id="desc">Extra reads of the decode rows&#x27; KV cache when 1 to 63 decode rows share one attention call with a 512-token prompt chunk, context 1150, Qwen3-8B on an RTX A6000. FlashAttention-2&#x27;s extra reads rise from about zero at 1 to 4 rows to 2.8 of a possible 3 at 63 rows; the model&#x27;s linear fit runs above the measurements below 16 rows. FlashInfer&#x27;s stay at zero at every row count.</desc>
