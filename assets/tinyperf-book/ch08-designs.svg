<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc">
<title id="title">Six ways to keep the past: what one attention layer stores for one sequence</title>
<desc id="desc">Six rows, context running left to right with the newest token on the right. Full attention stores a key and value for every past token and reads them all. A sliding window stores and reads only the last W tokens. Linear attention stores no tokens: each one is folded into a fixed-size state. A latent cache stores every token, as one thin vector instead of per-head keys and values. Sparse attention stores every token plus a small index key; an indexer scores them all and attention reads only the top k. Compressed attention pools every r tokens into one entry and keeps the last few raw in a window.</desc>
