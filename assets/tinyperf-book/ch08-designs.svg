<text x="645" y="324" class="small" text-anchor="middle">state: k dim x v dim per head, updated by each token</text>
<text x="645" y="339" class="note" text-anchor="middle">a decode step reads and writes all of it</text>
<text x="875" y="324" class="rule">fixed size</text>
<text x="875" y="344" class="small">whatever the context</text>
