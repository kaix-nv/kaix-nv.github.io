<text x="40" y="324" class="label">Linear attention</text>
<text x="40" y="344" class="small">no per-token cache: each token</text>
<text x="40" y="362" class="small">is folded into a fixed state</text>
<rect x="290" y="312" width="20" height="30" rx="3" fill="none" stroke="#e2e8f0" stroke-dasharray="3 3"/>
