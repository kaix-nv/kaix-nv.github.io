  .small { font: 500 13px system-ui, sans-serif; fill: #334155; }
  .note { font: 500 12px system-ui, sans-serif; fill: #475569; }
  .rule { font: 600 14px system-ui, sans-serif; fill: #0f172a; }
  .mono { font: 500 13px ui-monospace, monospace; fill: #334155; }
</style></defs>
