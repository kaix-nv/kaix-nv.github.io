<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 880" role="img" aria-labelledby="title description">
<title id="title">What the graph holds: one decoder layer as operator records and the tensors they consume</title>
<desc id="description">The sixteen operators of a Llama-2-7B decode step in the order the builder appends them to graph.ops, each with its index, name, family (gemm or rw), class and attributes. Between operators are the tensors each one consumes. Solid tensors were produced by the operator above, a link a pass can follow; dashed tensors are new ones the builder made with only a shape: x, q, ctx, act and head_in. The thirteen operators of one decoder layer sit in a frame and carry count=32; the embedding and the head carry count=1. The KV cache is not a tensor: the attention GEMMs carry its length, 2048, as an attribute.</desc>
<defs><style>.title { font: 700 26px system-ui, sans-serif; fill: #0f172a; } .subtitle { font: 400 16px system-ui, sans-serif; fill: #475569; } .frame { font: 600 15px system-ui, sans-serif; fill: #334155; } .note { font: 500 14px system-ui, sans-serif; fill: #334155; } .op { font: 700 14px ui-monospace, monospace; fill: #0f172a; } .idx { font: 500 12px ui-monospace, monospace; fill: #475569; } .cls { font: 500 13px system-ui, sans-serif; fill: #334155; } .attr { font: 500 12px ui-monospace, monospace; fill: #475569; } .chip { font: 700 12px ui-monospace, monospace; fill: #ffffff; } .tensor { font: 500 12px ui-monospace, monospace; fill: #0f172a; } .flow { fill: none; stroke: #64748b; stroke-width: 1.6; }</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
