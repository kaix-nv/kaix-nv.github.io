<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">Pure decode steps against the model, per 30-second window</title>
<desc id="desc">Two runs of the same long-prompt sweep of Qwen3-8B on one RTX A6000. Each point is the model/measured ratio of the pure decode steps in a 30-second window, from the engine&#x27;s step log. In the re-run, and in the first run&#x27;s other windows, every window lies between 0.99 and 1.05. In the first run 3 windows after 720 seconds fall to 0.47-0.52: steps took about twice their price while another job ran on the neighbouring GPU.</desc>
