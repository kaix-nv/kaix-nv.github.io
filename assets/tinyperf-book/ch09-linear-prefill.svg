<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">One layer&#x27;s attention in a prefill: Qwen3.8-27B on a B200</title>
<desc id="desc">Milliseconds per layer against prompt length, 512 to 131,072 tokens, both axes logarithmic. Full attention grows with the square of the prompt. The linear core grows in proportion to it: at the asserted efficiency it is far below full attention everywhere; with the constants fitted to vLLM&#x27;s prefill times it sits on a 0.55 ms floor up to about 2,000 tokens and costs more than full attention below about 23,000 tokens.</desc>
