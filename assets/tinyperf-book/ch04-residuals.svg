<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
<title id="title">Predicted / measured for 27 cuBLAS GEMMs, RTX A6000</title>
<desc id="desc">Ratio of predicted to measured time for each of 27 fp16 GEMMs on an RTX A6000, grouped by regime, on a log scale. On datasheet rates (PROJ, orange) every ratio is below 1. Where one term dominates, the ratio is nearly level (the tall GEMMs 0.79-0.84); where a fixed cost is missing it falls as kernels get shorter: the 1024 cube reads 0.51, the smallest decode-like weights 0.65, the two tiny GEMMs near 0.1. With the four fitted constants (CAL, blue) the points gather around 1, within 0.89-1.15 apart from the tiny GEMMs at 0.76 and 0.91.</desc>
