<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 510" role="img" aria-labelledby="title desc">
<title id="title">Prediction intervals against two held-out sweeps</title>
<desc id="desc">Two panels, TTFT on a log scale against the request rate for two held-out sweeps of Qwen3-8B on one RTX A6000. Left, 512 tokens in and 384 out at 2 to 4.5 requests per second; right, 1536 in and 192 out at 1.5 to 3.5. Each shows the median and 95th-percentile TTFT as shaded bands (the prediction intervals frozen before the runs), the point predictions as dashed lines, and the measured values as dots. The bands are narrow at low rates, open widest where TTFT turns sharply upward (the median&#x27;s band at 3.5 requests per second on the left spans a factor of 2.5), and narrow again past it. Every measured value lies in its band except the left sweep&#x27;s median at 3.25 requests per second, drawn as an open circle just above its band.</desc>
