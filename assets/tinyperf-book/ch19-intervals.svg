  .title { font: 700 22px system-ui, sans-serif; fill: #0f172a; }
  .sub { font: 500 14px system-ui, sans-serif; fill: #475569; }
  .head { font: 700 15px system-ui, sans-serif; fill: #0f172a; }
  .axis { font: 500 13px system-ui, sans-serif; fill: #334155; }
  .tick { font: 500 12px ui-monospace, monospace; fill: #475569; }
  .legend { font: 600 13px system-ui, sans-serif; fill: #334155; }
  .note { font: 500 12px system-ui, sans-serif; fill: #475569; }
  .num { font: 600 12px ui-monospace, monospace; fill: #0f172a; }
</style>
