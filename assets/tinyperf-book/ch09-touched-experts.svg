<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">Experts a gpt-oss-20b decode step touches, by workload</title>
<desc id="desc">Distinct experts of 32 touched per layer by a decode step of 1 to 128 sequences. Uniform routing reaches all 32 by 32 sequences. The measured router touches fewer at every batch: chat replies the fewest (24 at 128 sequences), a batch mixing prose, code and chat the most (31 at 128).</desc>
