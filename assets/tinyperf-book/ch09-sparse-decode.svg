<polyline points="80.0,372.2 159.0,357.4 238.0,357.4 317.0,357.4 396.0,357.4 475.0,357.4 554.0,357.4 633.0,357.4 712.0,357.4 791.0,357.4 870.0,357.4" fill="none" stroke="#15803d" stroke-width="2.2"/>
<line x1="95.8" y1="147.6" x2="125.8" y2="147.6" stroke="#15803d" stroke-width="2.2"/>
