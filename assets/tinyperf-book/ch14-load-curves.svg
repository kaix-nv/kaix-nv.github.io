<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 460" role="img" aria-labelledby="title desc">
<title id="title">TTFT and TPOT against load: Qwen3-8B under vLLM on one RTX A6000</title>
<desc id="desc">Two panels against the offered load, 0.5 to 8 requests per second, for 240 requests of 1024 tokens in and 128 out. Left: median and 95th-percentile TTFT on a log scale; up to 3.5 requests per second the median stays between about 230 and 440 ms and the p95 near or below 1 s; past 4 both rise steeply, to 11 and 27 seconds at 8. Right: mean TPOT rises steadily from 27 ms to about 110 ms at 4 requests per second, then levels off near 115 ms. The model (dashed) runs through the measured points at 1 to 8 requests per second.</desc>
