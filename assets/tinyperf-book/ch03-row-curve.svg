<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">A 4096 x 4096 weight GEMM by rows, RTX A6000</title>
<desc id="desc">Measured time of a bf16 GEMM with a 4096 by 4096 weight on an RTX A6000, from 1 to 1280 rows, against the tile model and a roofline with launch cost. All three are flat to 128 rows. Measured time jumps at 129, 257, 513 and 1025 rows; the tile model follows the trend but not the jumps, and sits below the measurement between 129 and 512 rows.</desc>
