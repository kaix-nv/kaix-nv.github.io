<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">Throughput per GPU against interactivity: Llama-3-70B decode</title>
<desc id="desc">Pareto fronts of tokens per second per GPU (log scale) against tokens per second per user, from a sweep of tensor and pipeline parallelism, precision and batch. Each front falls from high throughput at low interactivity to low throughput at high interactivity. The B200 front lies above and to the right of the H100&#x27;s; the H100&#x27;s bf16-only front lies below and to the left of its full front.</desc>
