<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">Time to first token as load passes the KV pool</title>
<desc id="desc">Median (p50) and 95th-percentile (p95) time to first token against the arrival rate, 0.25 to 2 requests per second, for Qwen3-8B served by vLLM on one RTX A6000 with a pool of 188,944 tokens (the H1 trace: prompts of 1,038 to 3,069 tokens, outputs of 517 to 1,533), log scale. The preempting model follows the measured points at 0.75, 1.25 and 2 requests per second: the median stays between 1 and 4 seconds while the 95th percentile jumps to about two minutes. The reserving model agrees below 0.75; from 0.75 its 95th percentile departs from the measurement, and above it it puts the median at 18 to 45 seconds.</desc>
<defs><style>
  .title { font: 700 22px system-ui, sans-serif; fill: #0f172a; }
  .axis { font: 500 14px system-ui, sans-serif; fill: #334155; }
  .tick { font: 500 12px system-ui, sans-serif; fill: #475569; }
  .legend { font: 600 13px system-ui, sans-serif; fill: #334155; }
  .note { font: 500 12px system-ui, sans-serif; fill: #64748b; }
</style></defs>
