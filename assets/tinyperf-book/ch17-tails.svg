<line x1="80" y1="450" x2="870" y2="450" stroke="#64748b"/>
<line x1="80" y1="60" x2="80" y2="450" stroke="#64748b"/>
<text x="475.0" y="498" class="axis" text-anchor="middle">arrival rate (requests per second)</text>
<text x="22" y="255.0" class="axis" text-anchor="middle" transform="rotate(-90 22 255.0)">time to first token (seconds)</text>
