<text x="80" y="36" class="title">Time to first token as load passes the KV pool</text>
<line x1="80" y1="450.0" x2="870" y2="450.0" stroke="#e2e8f0"/>
<text x="72" y="454.0" class="tick" text-anchor="end">0.3</text>
