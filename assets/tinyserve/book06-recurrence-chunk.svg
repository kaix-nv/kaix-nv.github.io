<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Sequential delta updates and their chunkwise form</title><desc id="desc">Starting from scalar state two, token zero produces correction one and state two; token one produces correction 1.5 and final state 1.75. A triangular solve recovers those corrections before computing outputs and final state.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0L8,3L0,6" fill="#48617a"/></marker></defs>
<rect width="1200" height="700" rx="18" fill="#f5f8fc"/><g font-family="Arial,sans-serif" fill="#172b43"><text x="35" y="48" font-size="28" font-weight="700">The same causal dependency in two execution forms</text>
<text x="35" y="92" font-size="21">Scalar example; initial state = 2; both queries = 1</text>
<g fill="white" stroke="#b5c7d8"><rect x="35" y="118" width="480" height="245" rx="12"/><rect x="675" y="118" width="490" height="245" rx="12"/></g>
<g font-size="23" font-weight="700"><text x="58" y="157">Token 0</text><text x="698" y="157">Token 1</text></g>
<g font-size="21"><text x="58" y="199">a = 0.5, k = 1, v = 3, beta = 0.5</text><text x="58" y="241">Decay: D = 0.5 × 2 = 1</text><text x="58" y="281">Correct: u0 = 0.5 × (3 − 1) = 1</text><text x="58" y="323">Write: S0 = 1 + 1 × 1 = 2</text><text x="698" y="199">a = 0.5, k = 0.5, v = 2, beta = 1</text><text x="698" y="241">Decay: D = 0.5 × 2 = 1</text><text x="698" y="281">Correct: u1 = 2 − 0.5 × 1 = 1.5</text><text x="698" y="323">Write: S1 = 1 + 0.5 × 1.5 = 1.75</text></g>
<path d="M518 280h137" stroke="#48617a" stroke-width="3" marker-end="url(#a)"/><text x="545" y="257" font-size="19">state 2</text>
<rect x="35" y="404" width="1130" height="232" rx="12" fill="#e3f0e8" stroke="#a3c4ae"/><text x="58" y="444" font-size="23" font-weight="700">One two-token chunk</text>
<g font-size="22"><text x="58" y="490">Cumulative decay: A0 = 0.5, A1 = 0.25</text><text x="58" y="535">u0 = 1</text><text x="58" y="577">u1 + 0.25 u0 = 1.75  →  u1 = 1.5</text><text x="698" y="490">Solve (I + L) U = R</text><text x="698" y="535">Outputs: [2, 1.75]</text><text x="698" y="577">Carry final state 1.75 onward</text></g>
<text x="35" y="675" font-size="20">A chunk changes execution order. It preserves the correction dependency and final state.</text>
</g></svg>
