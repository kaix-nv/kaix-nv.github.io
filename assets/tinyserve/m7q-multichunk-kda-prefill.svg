<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">M7p per-chunk submission compared with M7q multi-chunk KDA prefill</title>
  <desc id="desc">M7p returns to Python for cumulative decay, pair construction, correction, and state update for every chunk. M7q builds cumulative decay and pair matrices for all chunks with one launch each, then one tail program loops over chunks in causal order while carrying recurrent state locally.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 25px system-ui, sans-serif; fill: #0f172a; }
      .label { font: 700 18px system-ui, sans-serif; fill: #0f172a; }
      .body { font: 15px system-ui, sans-serif; fill: #334155; }
      .small { font: 13px system-ui, sans-serif; fill: #475569; }
      .box { stroke: #64748b; stroke-width: 2; rx: 12; }
      .arrow { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .state { stroke: #7c3aed; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="600" y="42" text-anchor="middle" class="title">KDA chunks are independent until recurrent state crosses the boundary</text>

  <rect x="30" y="72" width="550" height="605" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="55" y="108" class="label">M7p: Python submits every chunk separately</text>
  <text x="55" y="134" class="body">2,048 tokens / 64 = 32 trips through this loop</text>

  <rect x="62" y="170" width="116" height="58" class="box" fill="#e0f2fe"/>
  <text x="120" y="194" text-anchor="middle" class="body">cumsum</text>
  <text x="120" y="214" text-anchor="middle" class="small">chunk 0</text>
  <path d="M178 199 H205" class="arrow"/>
  <rect x="205" y="170" width="82" height="58" class="box" fill="#e0f2fe"/>
  <text x="246" y="204" text-anchor="middle" class="body">exp</text>
  <path d="M287 199 H314" class="arrow"/>
  <rect x="314" y="170" width="100" height="58" class="box" fill="#dcfce7"/>
  <text x="364" y="194" text-anchor="middle" class="body">pair</text>
  <text x="364" y="214" text-anchor="middle" class="small">L₀, P₀</text>
  <path d="M414 199 H441" class="arrow"/>
  <rect x="441" y="162" width="108" height="74" class="box" fill="#ede9fe"/>
  <text x="495" y="190" text-anchor="middle" class="body">solve/output</text>
  <text x="495" y="211" text-anchor="middle" class="body">state update</text>

  <text x="299" y="276" text-anchor="middle" class="label">Python loop boundary</text>
  <path d="M495 236 H565 V359 H550" class="state"/>
  <text x="305" y="296" text-anchor="middle" class="small">S₁ returns through global memory and host dispatch</text>

  <rect x="62" y="330" width="116" height="58" class="box" fill="#e0f2fe"/>
  <text x="120" y="354" text-anchor="middle" class="body">cumsum</text>
  <text x="120" y="374" text-anchor="middle" class="small">chunk 1</text>
  <path d="M178 359 H205" class="arrow"/>
  <rect x="205" y="330" width="82" height="58" class="box" fill="#e0f2fe"/>
  <text x="246" y="364" text-anchor="middle" class="body">exp</text>
  <path d="M287 359 H314" class="arrow"/>
  <rect x="314" y="330" width="100" height="58" class="box" fill="#dcfce7"/>
  <text x="364" y="354" text-anchor="middle" class="body">pair</text>
  <text x="364" y="374" text-anchor="middle" class="small">L₁, P₁</text>
  <path d="M414 359 H441" class="arrow"/>
  <rect x="441" y="322" width="108" height="74" class="box" fill="#ede9fe"/>
  <text x="495" y="350" text-anchor="middle" class="body">solve/output</text>
  <text x="495" y="371" text-anchor="middle" class="body">state update</text>

  <text x="305" y="447" text-anchor="middle" class="body">… repeat for chunks 2 through 31 …</text>
  <rect x="62" y="486" width="487" height="116" rx="12" fill="#ffedd5" stroke="#fb923c" stroke-width="2"/>
  <text x="82" y="518" class="label">At 2,048 tokens</text>
  <text x="82" y="547" class="body">32 cumsums + 32 exponentials + 96 native launches</text>
  <text x="82" y="574" class="body">The GPU repeatedly waits for Python to submit the next stage.</text>

  <rect x="620" y="72" width="550" height="605" rx="18" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="645" y="108" class="label">M7q: submit the prompt as a chunk grid</text>
  <text x="645" y="134" class="body">Chunks remain visible, but the host loop disappears</text>

  <rect x="660" y="174" width="205" height="72" class="box" fill="#e0f2fe"/>
  <text x="762" y="202" text-anchor="middle" class="body">one cumsum launch</text>
  <text x="762" y="225" text-anchor="middle" class="small">G[B,H,32,64,K]</text>
  <path d="M865 210 H900" class="arrow"/>
  <rect x="900" y="174" width="222" height="72" class="box" fill="#dcfce7"/>
  <text x="1011" y="202" text-anchor="middle" class="body">one pair-grid launch</text>
  <text x="1011" y="225" text-anchor="middle" class="small">all Lₙ and Pₙ in parallel</text>

  <rect x="660" y="292" width="462" height="238" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="891" y="326" text-anchor="middle" class="label">one ordered tail launch per KDA layer</text>
  <text x="687" y="361" class="body">Program owns one [K,16] recurrent-state tile</text>

  <rect x="690" y="385" width="118" height="70" class="box" fill="#faf5ff"/>
  <text x="749" y="411" text-anchor="middle" class="body">chunk 0</text>
  <text x="749" y="435" text-anchor="middle" class="small">S₀ → Y₀, S₁</text>
  <path d="M808 420 H847" class="state"/>
  <rect x="847" y="385" width="118" height="70" class="box" fill="#faf5ff"/>
  <text x="906" y="411" text-anchor="middle" class="body">chunk 1</text>
  <text x="906" y="435" text-anchor="middle" class="small">S₁ → Y₁, S₂</text>
  <path d="M965 420 H1004" class="state"/>
  <rect x="1004" y="385" width="88" height="70" class="box" fill="#faf5ff"/>
  <text x="1048" y="411" text-anchor="middle" class="body">… 31</text>
  <text x="1048" y="435" text-anchor="middle" class="small">→ S₃₂</text>
  <text x="891" y="493" text-anchor="middle" class="small">Rows inside each chunk also solve from token 0 → 63</text>

  <rect x="660" y="568" width="462" height="72" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="891" y="596" text-anchor="middle" class="label">Core submission: 3 launches</text>
  <text x="891" y="621" text-anchor="middle" class="body">cumsum once · pair once · state-carrying tail once</text>
</svg>
