<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Expert-parallel token dispatch and restoration</title>
  <desc id="desc">A four-step example routes four source tokens to top-two experts split across two GPUs, reverses the all-to-all, combines weighted expert outputs, and restores original token order on both ranks.</desc>
  <defs>
    <style>
      .title{font:700 28px system-ui,sans-serif;fill:#172033}.subtitle{font:16px system-ui,sans-serif;fill:#536078}
      .step{font:700 18px system-ui,sans-serif;fill:#172033}.label{font:600 15px system-ui,sans-serif;fill:#24304a}
      .small{font:13px system-ui,sans-serif;fill:#536078}.mono{font:14px ui-monospace,SFMono-Regular,monospace;fill:#24304a}
      .panel{fill:#f7f9fc;stroke:#cbd3e1;stroke-width:1.5}.gpu0{fill:#e9f3ff;stroke:#4484ce;stroke-width:2}
      .gpu1{fill:#fff0e8;stroke:#dc7847;stroke-width:2}.token0{fill:#cfe6ff;stroke:#4484ce}.token1{fill:#d9f0ff;stroke:#4484ce}
      .token2{fill:#ffe0d1;stroke:#dc7847}.token3{fill:#ffeadf;stroke:#dc7847}.expert{fill:#fff;stroke:#77839a;stroke-width:1.5}
      .arrow0{stroke:#4484ce;stroke-width:2.2;fill:none;marker-end:url(#blueArrow)}.arrow1{stroke:#dc7847;stroke-width:2.2;fill:none;marker-end:url(#orangeArrow)}
      .flow{stroke:#77839a;stroke-width:2;fill:none;marker-end:url(#grayArrow)}.dash{stroke-dasharray:6 5}
    </style>
    <marker id="blueArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4484ce"/></marker>
    <marker id="orangeArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#dc7847"/></marker>
    <marker id="grayArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#77839a"/></marker>
  </defs>

  <text x="48" y="48" class="title">One MoE layer: pack, dispatch, return, restore</text>
  <text x="48" y="76" class="subtitle">Teaching example: 4 tokens, 4 experts, top-2 routing, EP=2. Qwen3-30B-A3B uses 128 experts and top-8.</text>

  <rect x="40" y="105" width="250" height="620" rx="16" class="panel"/>
  <text x="60" y="140" class="step">1 · Choose source tokens</text>
  <text x="60" y="166" class="small">The hidden state is replicated, but each</text>
  <text x="60" y="185" class="small">rank dispatches only its token slice.</text>
  <rect x="60" y="215" width="210" height="176" rx="12" class="gpu0"/>
  <text x="76" y="242" class="label">rank 0 source slice</text>
  <rect x="78" y="260" width="70" height="38" rx="8" class="token0"/><text x="113" y="285" text-anchor="middle" class="mono">t0</text>
  <rect x="160" y="260" width="70" height="38" rx="8" class="token1"/><text x="195" y="285" text-anchor="middle" class="mono">t1</text>
  <text x="78" y="326" class="mono">t0 → E0 .7, E2 .3</text>
  <text x="78" y="352" class="mono">t1 → E1 .6, E3 .4</text>
  <rect x="60" y="420" width="210" height="176" rx="12" class="gpu1"/>
  <text x="76" y="447" class="label">rank 1 source slice</text>
  <rect x="78" y="465" width="70" height="38" rx="8" class="token2"/><text x="113" y="490" text-anchor="middle" class="mono">t2</text>
  <rect x="160" y="465" width="70" height="38" rx="8" class="token3"/><text x="195" y="490" text-anchor="middle" class="mono">t3</text>
  <text x="78" y="531" class="mono">t2 → E2 .8, E0 .2</text>
  <text x="78" y="557" class="mono">t3 → E3 .9, E1 .1</text>
  <text x="60" y="650" class="small">Router weights stay with the source;</text>
  <text x="60" y="670" class="small">only hidden rows cross the data plane.</text>

  <path d="M300 410 H340" class="flow"/>
  <rect x="350" y="105" width="250" height="620" rx="16" class="panel"/>
  <text x="370" y="140" class="step">2 · Pack by destination</text>
  <text x="370" y="166" class="small">Count exchange tells each rank how many</text>
  <text x="370" y="185" class="small">variable rows it will receive.</text>
  <text x="370" y="222" class="label">rank 0 send buffer</text>
  <rect x="370" y="240" width="210" height="112" rx="10" class="gpu0"/>
  <text x="385" y="267" class="mono">to rank 0: t0/E0, t1/E1</text>
  <text x="385" y="294" class="mono">to rank 1: t0/E2, t1/E3</text>
  <text x="385" y="326" class="small">send splits = [2, 2]</text>
  <text x="370" y="405" class="label">rank 1 send buffer</text>
  <rect x="370" y="423" width="210" height="112" rx="10" class="gpu1"/>
  <text x="385" y="450" class="mono">to rank 0: t2/E0, t3/E1</text>
  <text x="385" y="477" class="mono">to rank 1: t2/E2, t3/E3</text>
  <text x="385" y="509" class="small">send splits = [2, 2]</text>
  <path d="M385 570 C420 620 515 620 560 570" class="arrow0 dash"/>
  <path d="M560 590 C520 650 415 650 375 590" class="arrow1 dash"/>
  <text x="475" y="682" text-anchor="middle" class="label">all-to-all dispatch</text>

  <path d="M610 410 H650" class="flow"/>
  <rect x="660" y="105" width="230" height="620" rx="16" class="panel"/>
  <text x="680" y="140" class="step">3 · Run owned experts</text>
  <text x="680" y="166" class="small">Rows for one expert are grouped into</text>
  <text x="680" y="185" class="small">one local MLP call.</text>
  <rect x="680" y="215" width="190" height="175" rx="12" class="gpu0"/>
  <text x="696" y="242" class="label">GPU 0 owns E0, E1</text>
  <rect x="700" y="263" width="150" height="43" rx="8" class="expert"/><text x="775" y="290" text-anchor="middle" class="mono">E0(t0, t2)</text>
  <rect x="700" y="322" width="150" height="43" rx="8" class="expert"/><text x="775" y="349" text-anchor="middle" class="mono">E1(t1, t3)</text>
  <rect x="680" y="420" width="190" height="175" rx="12" class="gpu1"/>
  <text x="696" y="447" class="label">GPU 1 owns E2, E3</text>
  <rect x="700" y="468" width="150" height="43" rx="8" class="expert"/><text x="775" y="495" text-anchor="middle" class="mono">E2(t0, t2)</text>
  <rect x="700" y="527" width="150" height="43" rx="8" class="expert"/><text x="775" y="554" text-anchor="middle" class="mono">E3(t1, t3)</text>
  <text x="680" y="640" class="small">An empty expert performs no MLP call.</text>
  <text x="680" y="662" class="small">No token is dropped at inference.</text>

  <path d="M900 410 H940" class="flow"/>
  <rect x="950" y="105" width="210" height="620" rx="16" class="panel"/>
  <text x="970" y="140" class="step">4 · Return and restore</text>
  <text x="970" y="166" class="small">Reverse the same splits, undo the</text>
  <text x="970" y="185" class="small">sort, then weight and sum top-k.</text>
  <rect x="970" y="220" width="170" height="152" rx="12" class="gpu0"/>
  <text x="985" y="247" class="label">rank 0 combines</text>
  <text x="985" y="280" class="mono">t0 = .7E0 + .3E2</text>
  <text x="985" y="310" class="mono">t1 = .6E1 + .4E3</text>
  <text x="985" y="342" class="small">local order: [t0, t1]</text>
  <rect x="970" y="405" width="170" height="152" rx="12" class="gpu1"/>
  <text x="985" y="432" class="label">rank 1 combines</text>
  <text x="985" y="465" class="mono">t2 = .8E2 + .2E0</text>
  <text x="985" y="495" class="mono">t3 = .9E3 + .1E1</text>
  <text x="985" y="527" class="small">local order: [t2, t3]</text>
  <path d="M1055 570 V610" class="flow"/>
  <rect x="970" y="620" width="170" height="67" rx="10" class="expert"/>
  <text x="1055" y="647" text-anchor="middle" class="label">token all-gather</text>
  <text x="1055" y="673" text-anchor="middle" class="mono">[t0, t1, t2, t3]</text>

  <rect x="40" y="750" width="1120" height="45" rx="10" fill="#eef1f6"/>
  <text x="600" y="778" text-anchor="middle" class="label">Every rank now has the same ordered residual, so replicated attention and KV execution can continue.</text>
</svg>
