<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" role="img"
     aria-labelledby="title description">
  <title id="title">Continuous batching changes the running set between engine steps</title>
  <desc id="description">
    Four engine steps show requests A and B prefilling, then decoding until A
    finishes. Request C, which arrived while B was running, uses the released
    capacity and prefills in the next step. B pauses during that prefill step,
    then B and C decode together.
  </desc>

  <defs>
    <style>
      .title { font: 700 30px system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px system-ui, sans-serif; fill: #475569; }
      .step { font: 700 18px system-ui, sans-serif; fill: #0f172a; }
      .kind { font: 700 14px system-ui, sans-serif; letter-spacing: 0.08em; }
      .row { font: 700 19px system-ui, sans-serif; fill: #0f172a; }
      .label { font: 600 15px system-ui, sans-serif; fill: #334155; }
      .small { font: 500 13px system-ui, sans-serif; fill: #475569; }
      .cell { font: 700 15px system-ui, sans-serif; fill: #0f172a; }
      .mono { font: 600 14px ui-monospace, monospace; fill: #0f172a; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 3; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <pattern id="paused" width="10" height="10" patternUnits="userSpaceOnUse"
             patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#fff7ed"/>
      <rect width="3" height="10" fill="#fed7aa"/>
    </pattern>
  </defs>

  <rect width="1280" height="760" rx="20" fill="#f8fafc"/>
  <text x="50" y="52" class="title">Continuous batching: reconsider the batch every step</text>
  <text x="50" y="82" class="subtitle">
    A new request can enter after capacity is released; it does not wait for the old batch to drain.
  </text>

  <text x="78" y="128" class="label">engine time</text>
  <path d="M 180 122 L 1200 122" class="arrow" marker-end="url(#arrow)"/>

  <g>
    <rect x="250" y="146" width="210" height="86" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="355" y="176" text-anchor="middle" class="step">Step 0</text>
    <text x="355" y="205" text-anchor="middle" class="kind" fill="#2563eb">PREFILL A, THEN B</text>

    <rect x="485" y="146" width="210" height="86" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="590" y="176" text-anchor="middle" class="step">Step 1</text>
    <text x="590" y="205" text-anchor="middle" class="kind" fill="#7c3aed">DECODE A + B</text>

    <rect x="720" y="146" width="210" height="86" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="825" y="176" text-anchor="middle" class="step">Step 2</text>
    <text x="825" y="205" text-anchor="middle" class="kind" fill="#2563eb">PREFILL C</text>

    <rect x="955" y="146" width="210" height="86" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="1060" y="176" text-anchor="middle" class="step">Step 3</text>
    <text x="1060" y="205" text-anchor="middle" class="kind" fill="#7c3aed">DECODE B + C</text>
  </g>

  <text x="78" y="302" class="row">Request A</text>
  <text x="78" y="394" class="row">Request B</text>
  <text x="78" y="486" class="row">Request C</text>

  <rect x="250" y="260" width="210" height="62" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="355" y="297" text-anchor="middle" class="cell">prompt → first token</text>
  <rect x="485" y="260" width="210" height="62" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="590" y="287" text-anchor="middle" class="cell">one decode token</text>
  <text x="590" y="308" text-anchor="middle" class="small">finish → free KV</text>
  <rect x="720" y="260" width="445" height="62" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="942" y="297" text-anchor="middle" class="small">finished</text>

  <rect x="250" y="352" width="210" height="62" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="355" y="389" text-anchor="middle" class="cell">prompt → first token</text>
  <rect x="485" y="352" width="210" height="62" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="590" y="389" text-anchor="middle" class="cell">decode</text>
  <rect x="720" y="352" width="210" height="62" rx="10" fill="url(#paused)" stroke="#fb923c" stroke-width="2"/>
  <text x="825" y="378" text-anchor="middle" class="cell">paused</text>
  <text x="825" y="400" text-anchor="middle" class="small">C prefills this step</text>
  <rect x="955" y="352" width="210" height="62" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="1060" y="389" text-anchor="middle" class="cell">decode</text>

  <rect x="250" y="444" width="210" height="62" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="355" y="481" text-anchor="middle" class="small">pending</text>
  <rect x="485" y="444" width="210" height="62" rx="10" fill="#ffedd5" stroke="#fb923c"/>
  <text x="590" y="470" text-anchor="middle" class="cell">arrives</text>
  <text x="590" y="492" text-anchor="middle" class="small">waits for capacity</text>
  <rect x="720" y="444" width="210" height="62" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="825" y="481" text-anchor="middle" class="cell">prompt → first token</text>
  <rect x="955" y="444" width="210" height="62" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="1060" y="481" text-anchor="middle" class="cell">decode</text>

  <rect x="78" y="558" width="1087" height="94" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="106" y="589" class="label">KV capacity</text>
  <path d="M 225 584 L 1132 584" class="arrow" marker-end="url(#arrow)"/>
  <text x="355" y="620" text-anchor="middle" class="mono">A + B occupy blocks</text>
  <text x="590" y="620" text-anchor="middle" class="mono">A returns blocks</text>
  <text x="825" y="620" text-anchor="middle" class="mono">C reuses capacity</text>
  <text x="1060" y="620" text-anchor="middle" class="mono">B + C are running</text>

  <rect x="170" y="688" width="940" height="42" rx="10" fill="#ecfdf5" stroke="#86efac"/>
  <text x="640" y="714" text-anchor="middle" class="label">
    Continuous batching changes membership at step boundaries; it does not wait for B to finish.
  </text>
</svg>
