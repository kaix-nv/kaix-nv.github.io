<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" role="img"
     aria-labelledby="title description">
  <title id="title">LIFO preemption frees KV blocks and later recomputes them</title>
  <desc id="description">
    Three panels show requests A and B at decode block boundaries with only one
    free block. The scheduler preempts the most recently admitted request B,
    freeing all of its blocks so A can decode. B waits without KV storage but
    retains its token history, which is prefilled again when capacity returns.
  </desc>

  <defs>
    <style>
      .title { font: 700 30px system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px system-ui, sans-serif; fill: #475569; }
      .step { font: 700 15px system-ui, sans-serif; fill: #ffffff; }
      .panel-title { font: 700 20px system-ui, sans-serif; fill: #0f172a; }
      .label { font: 600 15px system-ui, sans-serif; fill: #334155; }
      .small { font: 500 13px system-ui, sans-serif; fill: #475569; }
      .mono { font: 600 14px ui-monospace, monospace; fill: #0f172a; }
      .block { font: 700 16px ui-monospace, monospace; fill: #0f172a; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 3; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a"
                    flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1280" height="780" rx="20" fill="#f8fafc"/>
  <text x="50" y="52" class="title">KV pressure: preempt, free, recompute</text>
  <text x="50" y="82" class="subtitle">
    M4 keeps token history, not a swapped KV copy. Readmission rebuilds K/V through normal prefill.
  </text>

  <path d="M 414 370 L 448 370" class="arrow" marker-end="url(#arrow)"/>
  <path d="M 824 370 L 858 370" class="arrow" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="50" y="116" width="358" height="520" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  </g>
  <circle cx="82" cy="152" r="18" fill="#dc2626"/>
  <text x="82" y="157" text-anchor="middle" class="step">1</text>
  <text x="112" y="159" class="panel-title">Decode needs 2 blocks</text>
  <text x="76" y="195" class="small">A and B are both at block boundaries.</text>

  <text x="76" y="238" class="label">Running, in admission order</text>
  <rect x="76" y="254" width="132" height="54" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="142" y="287" text-anchor="middle" class="mono">A needs +1</text>
  <path d="M 218 281 L 246 281" class="arrow" marker-end="url(#arrow)"/>
  <rect x="258" y="254" width="124" height="54" rx="9" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="320" y="287" text-anchor="middle" class="mono">B needs +1</text>
  <text x="320" y="329" text-anchor="middle" class="small">B is the LIFO tail</text>

  <text x="76" y="375" class="label">Six-block KV pool</text>
  <g>
    <rect x="76" y="392" width="47" height="58" rx="7" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="128" y="392" width="47" height="58" rx="7" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="180" y="392" width="47" height="58" rx="7" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="232" y="392" width="47" height="58" rx="7" fill="#ffedd5" stroke="#ea580c"/>
    <rect x="284" y="392" width="47" height="58" rx="7" fill="#ffedd5" stroke="#ea580c"/>
    <rect x="336" y="392" width="47" height="58" rx="7" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="99" y="427" text-anchor="middle" class="block">A</text>
    <text x="151" y="427" text-anchor="middle" class="block">A</text>
    <text x="203" y="427" text-anchor="middle" class="block">A</text>
    <text x="255" y="427" text-anchor="middle" class="block">B</text>
    <text x="307" y="427" text-anchor="middle" class="block">B</text>
    <text x="359" y="427" text-anchor="middle" class="small">free</text>
  </g>
  <rect x="76" y="482" width="306" height="70" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="229" y="511" text-anchor="middle" class="mono" fill="#b91c1c">need = 2, free = 1</text>
  <text x="229" y="536" text-anchor="middle" class="label">decode cannot start</text>
  <text x="229" y="595" text-anchor="middle" class="small">reserve_for_decode() must make room.</text>

  <g filter="url(#shadow)">
    <rect x="460" y="116" width="358" height="520" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  </g>
  <circle cx="492" cy="152" r="18" fill="#ea580c"/>
  <text x="492" y="157" text-anchor="middle" class="step">2</text>
  <text x="522" y="159" class="panel-title">Preempt B; decode A</text>
  <text x="486" y="195" class="small">Remove the running tail and free all its KV.</text>

  <rect x="486" y="230" width="306" height="70" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="639" y="258" text-anchor="middle" class="mono">running: [A]</text>
  <text x="639" y="283" text-anchor="middle" class="mono">waiting: [B, ...]</text>

  <text x="486" y="342" class="label">Pool after B is freed</text>
  <g>
    <rect x="486" y="360" width="47" height="58" rx="7" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="538" y="360" width="47" height="58" rx="7" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="590" y="360" width="47" height="58" rx="7" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="642" y="360" width="47" height="58" rx="7" fill="#f1f5f9" stroke="#94a3b8"/>
    <rect x="694" y="360" width="47" height="58" rx="7" fill="#f1f5f9" stroke="#94a3b8"/>
    <rect x="746" y="360" width="47" height="58" rx="7" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="509" y="395" text-anchor="middle" class="block">A</text>
    <text x="561" y="395" text-anchor="middle" class="block">A</text>
    <text x="613" y="395" text-anchor="middle" class="block">A</text>
    <text x="665" y="395" text-anchor="middle" class="small">free</text>
    <text x="717" y="395" text-anchor="middle" class="small">free</text>
    <text x="769" y="395" text-anchor="middle" class="small">free</text>
  </g>
  <rect x="486" y="452" width="306" height="70" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="639" y="481" text-anchor="middle" class="mono" fill="#1d4ed8">A: need = 1, free = 3</text>
  <text x="639" y="506" text-anchor="middle" class="label">allocate one block → decode</text>
  <text x="639" y="559" text-anchor="middle" class="small">B has zero resident KV blocks.</text>
  <text x="639" y="584" text-anchor="middle" class="small">Its tokens and request metadata remain.</text>

  <g filter="url(#shadow)">
    <rect x="870" y="116" width="358" height="520" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  </g>
  <circle cx="902" cy="152" r="18" fill="#15803d"/>
  <text x="902" y="157" text-anchor="middle" class="step">3</text>
  <text x="932" y="159" class="panel-title">Later: recompute B</text>
  <text x="896" y="195" class="small">Readmit only when B's full history fits again.</text>

  <rect x="896" y="230" width="306" height="76" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="1049" y="258" text-anchor="middle" class="label">Retained model history</text>
  <text x="1049" y="285" text-anchor="middle" class="mono">prompt + generated tokens</text>
  <path d="M 1049 320 L 1049 351" class="arrow" marker-end="url(#arrow)"/>
  <rect x="896" y="365" width="306" height="68" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="1049" y="394" text-anchor="middle" class="label">normal _paged_prefill()</text>
  <text x="1049" y="417" text-anchor="middle" class="small">rebuild K/V for every retained token</text>
  <path d="M 1049 447 L 1049 478" class="arrow" marker-end="url(#arrow)"/>
  <g>
    <rect x="896" y="491" width="47" height="58" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <rect x="948" y="491" width="47" height="58" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <rect x="1000" y="491" width="47" height="58" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
    <rect x="1052" y="491" width="47" height="58" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
    <rect x="1104" y="491" width="47" height="58" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
    <rect x="1156" y="491" width="47" height="58" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="919" y="526" text-anchor="middle" class="block">B</text>
    <text x="971" y="526" text-anchor="middle" class="block">B</text>
    <text x="1023" y="526" text-anchor="middle" class="small">free</text>
    <text x="1075" y="526" text-anchor="middle" class="small">free</text>
    <text x="1127" y="526" text-anchor="middle" class="small">free</text>
    <text x="1179" y="526" text-anchor="middle" class="small">free</text>
  </g>
  <text x="1049" y="584" text-anchor="middle" class="label">generation continues</text>
  <text x="1049" y="608" text-anchor="middle" class="small">same tokens, new physical blocks</text>

  <rect x="112" y="674" width="1056" height="66" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="640" y="702" text-anchor="middle" class="label">
    Preemption exchanges resident KV capacity for waiting time and repeated prefill work.
  </text>
  <text x="640" y="725" text-anchor="middle" class="small">
    It preserves output correctness for deterministic decoding, but it is not free memory.
  </text>
</svg>
