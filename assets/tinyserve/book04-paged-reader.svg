<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc" xml:space="preserve">
<title id="title">Reading paged history during a four-token append</title><desc id="desc">Logical positions 0 through 8 occupy physical pages 5, 2, and 4. Queries at positions 5 through 8 obey a shifted causal triangle. Direct reads avoid a contiguous gather temporary.</desc>
<style>text { white-space: pre; }</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0L8,3L0,6" fill="#48617a"/></marker></defs>
<rect width="1200" height="680" rx="18" fill="#f5f8fc"/><g font-family="Arial,sans-serif" fill="#172b43"><text x="35" y="48" font-size="28" font-weight="700">Logical positions survive physical indirection</text><text x="35" y="88" font-size="20">5 cached tokens + 4 appended queries; page size 4; page table [5, 2, 4]</text>
<g fill="white" stroke="#acc2d4"><rect x="35" y="115" width="340" height="126" rx="10"/><rect x="430" y="115" width="340" height="126" rx="10"/><rect x="825" y="115" width="340" height="126" rx="10"/></g>
<g font-size="22" font-weight="700"><text x="57" y="151">Physical page 5</text><text x="452" y="151">Physical page 2</text><text x="847" y="151">Physical page 4</text></g>
<g font-size="21"><text x="57" y="195">positions   0   1   2   3</text><text x="452" y="195">positions   4   5   6   7</text><text x="847" y="195">positions   8   ·   ·   ·</text></g><text x="847" y="225" font-size="17">Only the first slot is valid</text>
<rect x="35" y="278" width="565" height="264" rx="12" fill="white" stroke="#acc2d4"/>
<text x="57" y="317" font-size="22" font-weight="700">Append visibility: j ≤ 5 + query row</text>
<g font-family="monospace" font-size="23"><text x="57" y="361">key      0 1 2 3 4 5 6 7 8</text><text x="57" y="401">query 5  ✓ ✓ ✓ ✓ ✓ ✓ · · ·</text><text x="57" y="439">query 6  ✓ ✓ ✓ ✓ ✓ ✓ ✓ · ·</text><text x="57" y="477">query 7  ✓ ✓ ✓ ✓ ✓ ✓ ✓ ✓ ·</text><text x="57" y="515">query 8  ✓ ✓ ✓ ✓ ✓ ✓ ✓ ✓ ✓</text></g>
<g font-size="21"><text x="650" y="308" font-weight="700">Gather reader</text><text x="650" y="344">paged pool → contiguous K/V</text><text x="650" y="380">→ expanded heads → attention</text><text x="650" y="440" font-weight="700">Direct reader</text><text x="650" y="476">paged pool + page metadata</text><text x="650" y="512">→ tile loads inside attention</text></g>
<rect x="35" y="575" width="1130" height="68" rx="10" fill="#e3f0e8"/><text x="55" y="617" font-size="21">Both read the valid history. Direct reads avoid its separate full-context materialization.</text>
</g></svg>
