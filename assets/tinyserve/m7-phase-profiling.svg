<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Host and CUDA timing regions in one tinyserve engine step</title>
  <desc id="desc">A host lane schedules work, launches decode, samples, packs prompt tokens, and launches prefill. A CUDA lane executes decode, sampling, packing, and prefill asynchronously. Paged KV writes are nested inside the forward, while CUDA graph replay hides its internal per-layer writes.</desc>
  <defs>
    <style>
      title,desc{display:none}.title{font:700 29px system-ui,sans-serif;fill:#172033}.subtitle{font:15px system-ui,sans-serif;fill:#536078}
      .section{font:700 19px system-ui,sans-serif;fill:#172033}.label{font:600 15px system-ui,sans-serif;fill:#24304a}.small{font:13px system-ui,sans-serif;fill:#536078}
      .mono{font:14px ui-monospace,SFMono-Regular,monospace;fill:#24304a}.lane{fill:#f7f9fc;stroke:#cbd3e1;stroke-width:1.5}
      .sched{fill:#e9f3ff;stroke:#4484ce;stroke-width:1.5}.decode{fill:#d7ecff;stroke:#3178c6;stroke-width:1.7}
      .sample{fill:#fff0e8;stroke:#dc7847;stroke-width:1.5}.prefill{fill:#eaf7ed;stroke:#4a9a61;stroke-width:1.7}
      .pack{fill:#f4edff;stroke:#8764bd;stroke-width:1.5}.note{fill:#fff8dd;stroke:#c79a28;stroke-width:1.5}
      .line{stroke:#77839a;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke:#77839a;stroke-width:1.5;stroke-dasharray:5 5;fill:none}
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#77839a"/></marker>
  </defs>
  <rect width="1200" height="700" rx="20" fill="#fbfcfe"/>
  <text x="48" y="50" class="title">M7a: measure the phase that actually owns the time</text>
  <text x="48" y="79" class="subtitle">Host launch time and CUDA execution time are different clocks; one engine step records both.</text>

  <rect x="40" y="110" width="1120" height="390" rx="16" class="lane"/>
  <text x="64" y="147" class="section">Host lane</text>
  <line x1="170" y1="142" x2="1120" y2="142" class="line"/>
  <rect x="180" y="165" width="125" height="58" rx="10" class="sched"/><text x="242" y="190" text-anchor="middle" class="label">scheduler</text><text x="242" y="210" text-anchor="middle" class="small">admit + reserve</text>
  <rect x="325" y="165" width="130" height="58" rx="10" class="decode"/><text x="390" y="190" text-anchor="middle" class="label">launch decode</text><text x="390" y="210" text-anchor="middle" class="small">returns early</text>
  <rect x="475" y="165" width="115" height="58" rx="10" class="sample"/><text x="532" y="190" text-anchor="middle" class="label">sample</text><text x="532" y="210" text-anchor="middle" class="small">token sync</text>
  <rect x="610" y="165" width="115" height="58" rx="10" class="sched"/><text x="667" y="190" text-anchor="middle" class="label">scheduler</text><text x="667" y="210" text-anchor="middle" class="small">prefill plan</text>
  <rect x="745" y="165" width="115" height="58" rx="10" class="pack"/><text x="802" y="190" text-anchor="middle" class="label">pack</text><text x="802" y="210" text-anchor="middle" class="small">tokens + mask</text>
  <rect x="880" y="165" width="135" height="58" rx="10" class="prefill"/><text x="947" y="190" text-anchor="middle" class="label">launch prefill</text><text x="947" y="210" text-anchor="middle" class="small">async kernels</text>
  <rect x="1035" y="165" width="90" height="58" rx="10" class="sample"/><text x="1080" y="190" text-anchor="middle" class="label">sample</text><text x="1080" y="210" text-anchor="middle" class="small">first token</text>

  <text x="64" y="286" class="section">CUDA stream</text>
  <line x1="170" y1="281" x2="1120" y2="281" class="line"/>
  <rect x="335" y="306" width="220" height="70" rx="10" class="decode"/><text x="445" y="335" text-anchor="middle" class="label">decode forward</text><text x="445" y="359" text-anchor="middle" class="small">graph replay or eager</text>
  <rect x="565" y="306" width="55" height="70" rx="10" class="sample"/><text x="592" y="347" text-anchor="middle" class="small">argmax</text>
  <rect x="755" y="306" width="105" height="70" rx="10" class="pack"/><text x="807" y="335" text-anchor="middle" class="label">pack</text><text x="807" y="359" text-anchor="middle" class="small">GPU ops</text>
  <rect x="870" y="306" width="245" height="70" rx="10" class="prefill"/><text x="992" y="335" text-anchor="middle" class="label">prefill forward</text><text x="992" y="359" text-anchor="middle" class="small">matmuls + attention + cache writes</text>
  <rect x="890" y="385" width="205" height="42" rx="8" class="note"/><text x="992" y="411" text-anchor="middle" class="small">nested: one write event per layer</text>
  <path d="M900 376 V385 M930 376 V385 M960 376 V385 M990 376 V385 M1020 376 V385 M1050 376 V385 M1080 376 V385" class="dash"/>

  <path d="M390 223 V306" class="dash"/><path d="M532 223 V306" class="dash"/><path d="M802 223 V306" class="dash"/><path d="M947 223 V306" class="dash"/>
  <text x="64" y="462" class="small">CUDA events are queued with the work. The profiler synchronizes once after the request, not after each colored region.</text>

  <rect x="40" y="525" width="535" height="130" rx="14" class="lane"/>
  <text x="64" y="560" class="section">Read the two columns separately</text>
  <text x="64" y="591" class="mono">host_ms</text><text x="165" y="591" class="small">Python wall time inside the region, including any token sync</text>
  <text x="64" y="622" class="mono">device_ms</text><text x="165" y="622" class="small">elapsed CUDA stream work between the two recorded events</text>

  <rect x="600" y="525" width="560" height="130" rx="14" class="note"/>
  <text x="624" y="560" class="section">Two accounting rules prevent false conclusions</text>
  <text x="624" y="591" class="small">1. KV-write time is nested inside the forward, so never add it to the parent total.</text>
  <text x="624" y="616" class="small">2. A CUDA graph exposes replay time, not internal layer boundaries.</text>
  <text x="642" y="638" class="small">Use eager decode when that detail is required.</text>
</svg>
