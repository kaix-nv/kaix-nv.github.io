<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840" role="img" aria-labelledby="title desc">
<title id="title">Paged speculative rollback: release whole pages, overwrite a partial page</title>
<desc id="desc">Four slots per page. Five cached tokens map to physical pages 5 and 2. Verification writes pending 4 and candidates 7,9,2, allocating page 4. Accept 7 and reject 9: keep seven positions, free page 4, and overwrite the last slot of retained page 2 with correction 8 next round. The physical pool remains allocated.</desc>
<style>text { white-space: pre; }</style>
<rect width="1280" height="840" fill="white"/>
<g font-family="Arial,sans-serif" fill="#0f172a">
<text x="40" y="46" font-size="28" font-weight="700">One rejected suffix, two different storage actions</text>
<text x="40" y="77" font-size="18" fill="#475569">Illustrative target cache • page size B = 4 • 5 old tokens • pending 4 • proposals [7, 9, 2]</text>
<g font-size="18" fill="#475569"><text x="363" y="115">Logical positions 0–3</text><text x="674" y="115">4–7</text><text x="974" y="115">8–11</text></g>
<g fill="#eff6ff" stroke="#93c5fd"><rect x="320" y="131" width="270" height="87" rx="9"/><rect x="630" y="131" width="270" height="87" rx="9"/></g>
<g font-size="19"><text x="40" y="163" font-weight="700">1. Before verification</text><text x="40" y="195">C=5 · table [5, 2]</text><text x="339" y="160">Physical page 5</text><text x="649" y="160">Physical page 2</text></g>
<g font-family="monospace" font-size="22" xml:space="preserve"><text x="339" y="199">old old old old</text><text x="649" y="199">old  ·   ·   ·</text></g>
<path d="M760 227 V256" stroke="#64748b" stroke-width="3"/><path d="M752 249 L760 259 L768 249" fill="none" stroke="#64748b" stroke-width="3"/>
<g stroke="#93c5fd" fill="#eff6ff"><rect x="320" y="272" width="270" height="87" rx="9"/><rect x="630" y="272" width="270" height="87" rx="9"/></g>
<rect x="940" y="272" width="270" height="87" rx="9" fill="#fff7ed" stroke="#fdba74"/>
<g font-size="19"><text x="40" y="303" font-weight="700">2. Target verifies 4 inputs</text><text x="40" y="335">C=9 · table [5, 2, 4]</text><text x="339" y="302">Physical page 5</text><text x="649" y="302">Physical page 2</text><text x="959" y="302">New physical page 4</text></g>
<g font-family="monospace" font-size="22" xml:space="preserve"><text x="339" y="341">old old old old</text><text x="649" y="341">old  4   7   9</text><text x="959" y="341"> 2   ·   ·   ·</text></g>
<rect x="320" y="380" width="890" height="60" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="338" y="405" font-size="18">Predictions [7, 8, 13, 11]: accept 7, reject 9 → emit [7, 8]</text>
<text x="338" y="428" font-size="17" fill="#475569">8 is the new pending token. Committed cache length = 5 old + 4 + 7 = 7.</text>
<g fill="#f0fdf4" stroke="#86efac"><rect x="320" y="464" width="270" height="87" rx="9"/><rect x="630" y="464" width="270" height="87" rx="9"/></g>
<rect x="940" y="464" width="270" height="87" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/>
<g font-size="19"><text x="40" y="495" font-weight="700">3. Roll back to 7</text><text x="40" y="527">Keep ceil(7/4)=2 pages</text><text x="339" y="494">Keep page 5</text><text x="649" y="494">Keep partial page 2</text><text x="959" y="494">Free page 4</text></g>
<g font-family="monospace" font-size="22" xml:space="preserve"><text x="339" y="533">old old old old</text><text x="649" y="533">old  4   7</text><text x="822" y="533" fill="#c2410c">9</text><text x="959" y="533" fill="#94a3b8"> 2   ·   ·   ·</text></g>
<text x="641" y="576" font-size="16" fill="#c2410c">9's KV remains in memory but is outside the valid prefix.</text>
<path d="M760 593 V618" stroke="#64748b" stroke-width="3"/><path d="M752 611 L760 621 L768 611" fill="none" stroke="#64748b" stroke-width="3"/>
<g fill="#f0fdf4" stroke="#86efac"><rect x="320" y="636" width="270" height="87" rx="9"/><rect x="630" y="636" width="270" height="87" rx="9"/></g>
<g font-size="19"><text x="40" y="667" font-weight="700">4. Process pending 8</text><text x="40" y="699">Position 7 → slot 11</text><text x="339" y="666">Page 5 unchanged</text><text x="649" y="666">Page 2, offset 3: 9 → 8</text></g>
<g font-family="monospace" font-size="22" xml:space="preserve"><text x="339" y="705">old old old old</text><text x="649" y="705">old  4   7   8</text></g>
<text x="940" y="669" font-size="18">Page 4 can be reused</text><text x="940" y="697" font-size="18">when position 8 is written.</text>
<rect x="40" y="755" width="1170" height="58" rx="10" fill="#fff7ed" stroke="#fdba74"/>
<text x="59" y="790" font-size="18">Freeing a page changes ownership, not reserved GPU bytes. On request exit, both model pools return all pages.</text>
</g>
</svg>
