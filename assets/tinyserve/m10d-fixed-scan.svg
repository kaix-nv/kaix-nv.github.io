<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="440" viewBox="0 0 1100 440" role="img" aria-labelledby="title desc">
  <title id="title">A fixed two-pass prefix sum for top-p</title>
  <desc id="desc">A toy row with eight probabilities is split into two four-token tiles. Local scans produce totals 0.85 and 0.15. A fixed scan of totals gives offsets zero and 0.85. Adding offsets produces the complete cumulative probabilities. At top-p 0.9 the fifth token crosses the threshold and remains kept. Real tiles have 1024 tokens, with the same operation order regardless of batch size.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#52647c" stroke-width="1.5"/></marker></defs>
  <rect width="1100" height="440" rx="16" fill="#f5f8fc"/>
  <g font-family="Arial, sans-serif" fill="#18283e">
    <text x="30" y="40" font-size="24" font-weight="700">Same row, same addition tree</text>
    <text x="30" y="67" font-size="15">Toy tiles: 4 tokens. Implementation: 1024 tokens, fixed 4 warps, FP32.</text>
    <rect x="240" y="92" width="370" height="60" rx="8" fill="#e2edff" stroke="#7093c0"/>
    <rect x="650" y="92" width="420" height="60" rx="8" fill="#e2edff" stroke="#7093c0"/>
    <text x="30" y="128" font-size="17">Sorted probabilities</text>
    <text x="263" y="128" font-size="19" font-family="monospace">.40   .20   .15   .10</text>
    <text x="675" y="128" font-size="19" font-family="monospace">.06   .04   .03   .02</text>
    <rect x="240" y="182" width="370" height="60" rx="8" fill="#e4f4ee" stroke="#62a58a"/>
    <rect x="650" y="182" width="420" height="60" rx="8" fill="#e4f4ee" stroke="#62a58a"/>
    <text x="30" y="207" font-size="17" font-weight="700">1. Local tile scans</text>
    <text x="30" y="230" font-size="14">Save last value as tile total</text>
    <text x="263" y="218" font-size="19" font-family="monospace">.40   .60   .75   .85</text>
    <text x="675" y="218" font-size="19" font-family="monospace">.06   .10   .13   .15</text>
    <text x="30" y="279" font-size="17" font-weight="700">2. Scan totals; add offsets</text>
    <text x="344" y="279" font-size="18">+ 0.00</text>
    <text x="742" y="279" font-size="18">+ 0.85 (preceding tile)</text>
    <rect x="240" y="301" width="370" height="60" rx="8" fill="#e2edff" stroke="#7093c0"/>
    <rect x="650" y="301" width="420" height="60" rx="8" fill="#e2edff" stroke="#7093c0"/>
    <rect x="663" y="311" width="63" height="40" rx="6" fill="#ffdf9a"/>
    <text x="30" y="337" font-size="17">Complete prefix sum</text>
    <text x="263" y="337" font-size="19" font-family="monospace">.40   .60   .75   .85</text>
    <text x="675" y="337" font-size="19" font-family="monospace">.91   .95   .98  1.00</text>
    <text x="30" y="399" font-size="17">p = 0.9: token 5 crosses the boundary. The shifted mask keeps it; tokens 6–8 are dropped.</text>
    <text x="30" y="423" font-size="14">Batch size and row order do not select a different scan tree. RNG ownership is unchanged.</text>
  </g>
  <g fill="none" stroke="#52647c" stroke-width="2" marker-end="url(#arrow)">
    <path d="M425 154 V179"/><path d="M860 154 V179"/>
    <path d="M425 283 V298"/><path d="M860 283 V298"/>
  </g>
</svg>
