<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Graph replay and kernel fusion remove different overheads</title>
  <desc id="desc">Eager execution submits kernels A, B and C separately. Graph replay submits their captured dependencies once, while the GPU still executes three kernels. Fusion changes the device program into one kernel. This is a schematic, not a timing measurement.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#45556c"/></marker></defs>
  <rect width="1200" height="760" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" fill="#172a42">
    <text x="40" y="48" font-size="28" font-weight="700">Graph replay changes submission; fusion changes GPU work</text>
    <text x="40" y="82" font-size="18">Each row computes the same conceptual A → B → C operation. Widths are not durations.</text>
    <rect x="35" y="110" width="1130" height="165" rx="12" fill="#eaf1fb"/>
    <text x="60" y="146" font-size="23" font-weight="700">Eager</text>
    <text x="60" y="182" font-size="18">Host: three submissions</text>
    <text x="60" y="219" font-size="18">GPU: three kernels</text>
    <g fill="#d0e1fb" stroke="#3465a4" stroke-width="2"><rect x="405" y="142" width="165" height="46" rx="8"/><rect x="675" y="142" width="165" height="46" rx="8"/><rect x="945" y="142" width="165" height="46" rx="8"/></g>
    <g font-size="19" text-anchor="middle"><text x="487" y="172">launch A</text><text x="757" y="172">launch B</text><text x="1027" y="172">launch C</text></g>
    <g stroke="#45556c" stroke-width="2" marker-end="url(#arrow)"><path d="M487 189 V212"/><path d="M757 189 V212"/><path d="M1027 189 V212"/></g>
    <g fill="#fff" stroke="#3465a4" stroke-width="2"><rect x="405" y="216" width="165" height="40" rx="8"/><rect x="675" y="216" width="165" height="40" rx="8"/><rect x="945" y="216" width="165" height="40" rx="8"/></g>
    <g font-size="19" text-anchor="middle"><text x="487" y="243">A</text><text x="757" y="243">B</text><text x="1027" y="243">C</text></g>
    <g stroke="#45556c" stroke-width="2" marker-end="url(#arrow)"><path d="M575 236 H668"/><path d="M845 236 H938"/></g>
    <rect x="35" y="295" width="1130" height="170" rx="12" fill="#e7f4ef"/>
    <text x="60" y="335" font-size="23" font-weight="700">Graph replay</text>
    <text x="60" y="372" font-size="18">Host: one replay</text>
    <text x="60" y="409" font-size="18">GPU: still three kernels</text>
    <rect x="600" y="320" width="310" height="44" rx="8" fill="#bee5d4" stroke="#247552" stroke-width="2"/>
    <text x="755" y="349" text-anchor="middle" font-size="19">replay captured dependencies</text>
    <path d="M755 366 V391" stroke="#45556c" stroke-width="2" marker-end="url(#arrow)"/>
    <g fill="#fff" stroke="#247552" stroke-width="2"><rect x="405" y="400" width="165" height="43" rx="8"/><rect x="675" y="400" width="165" height="43" rx="8"/><rect x="945" y="400" width="165" height="43" rx="8"/></g>
    <g font-size="19" text-anchor="middle"><text x="487" y="429">A</text><text x="757" y="429">B</text><text x="1027" y="429">C</text></g>
    <g stroke="#45556c" stroke-width="2" marker-end="url(#arrow)"><path d="M575 421 H668"/><path d="M845 421 H938"/></g>
    <rect x="35" y="485" width="1130" height="165" rx="12" fill="#fff2df"/>
    <text x="60" y="525" font-size="23" font-weight="700">Fusion</text>
    <text x="60" y="562" font-size="18">Host: one kernel launch</text>
    <text x="60" y="599" font-size="18">GPU: one combined program</text>
    <rect x="600" y="510" width="310" height="44" rx="8" fill="#ffdfad" stroke="#a76412" stroke-width="2"/>
    <text x="755" y="539" text-anchor="middle" font-size="19">launch fused ABC</text>
    <path d="M755 556 V581" stroke="#45556c" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="405" y="588" width="705" height="42" rx="8" fill="#fff" stroke="#a76412" stroke-width="2"/>
    <text x="755" y="616" text-anchor="middle" font-size="19">A + B + C, with eligible intermediates kept inside the kernel</text>
    <text x="40" y="695" font-size="19" font-weight="700">These techniques compose: capture a graph that contains fused kernels.</text>
    <text x="40" y="728" font-size="18">Fewer launches are a mechanism to test—not a guarantee of lower end-to-end latency.</text>
  </g>
</svg>
