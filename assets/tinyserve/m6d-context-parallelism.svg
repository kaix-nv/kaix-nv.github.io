<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Context-parallel KV ownership and exact distributed softmax</title>
  <desc id="desc">A twelve-token sequence uses three four-token logical blocks. Rank zero owns blocks zero and two, rank one owns block one. Both ranks compute local attention scores, reduce a global maximum, then reduce shifted numerators and denominators to reconstruct the exact attention output.</desc>
  <defs>
    <style>
      title,desc{display:none}
      .title{font-family:system-ui,sans-serif;font-size:28px;font-weight:700;fill:#172033}
      .subtitle{font-family:system-ui,sans-serif;font-size:15px;fill:#536078}
      .section{font-family:system-ui,sans-serif;font-size:20px;font-weight:700;fill:#172033}
      .label{font-family:system-ui,sans-serif;font-size:15px;font-weight:600;fill:#24304a}
      .small{font-family:system-ui,sans-serif;font-size:13px;fill:#536078}
      .mono{font-family:ui-monospace,SFMono-Regular,monospace;font-size:14px;fill:#24304a}
      .panel{fill:#f7f9fc;stroke:#cbd3e1;stroke-width:1.5}.gpu0{fill:#e9f3ff;stroke:#4484ce;stroke-width:2}
      .gpu1{fill:#fff0e8;stroke:#dc7847;stroke-width:2}.block0{fill:#cfe6ff;stroke:#4484ce;stroke-width:1.5}
      .block1{fill:#ffe0d1;stroke:#dc7847;stroke-width:1.5}.reduce{fill:#eef1f6;stroke:#77839a;stroke-width:1.5}
      .arrow0{stroke:#4484ce;stroke-width:2.2;fill:none;marker-end:url(#blueArrow)}
      .arrow1{stroke:#dc7847;stroke-width:2.2;fill:none;marker-end:url(#orangeArrow)}
      .flow{stroke:#77839a;stroke-width:2;fill:none;marker-end:url(#grayArrow)}
    </style>
    <marker id="blueArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4484ce"/></marker>
    <marker id="orangeArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#dc7847"/></marker>
    <marker id="grayArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#77839a"/></marker>
  </defs>

  <rect width="1200" height="820" rx="20" fill="#fbfcfe"/>
  <text x="48" y="48" class="title">M6d: shard persistent KV, merge softmax statistics</text>
  <text x="48" y="76" class="subtitle">Concrete example: CP=2, block size 4, one 12-token sequence, query q at position 11</text>

  <rect x="40" y="105" width="1120" height="285" rx="16" class="panel"/>
  <text x="65" y="140" class="section">1. One logical block table, two physical pools</text>
  <text x="65" y="168" class="small">Global block ids remain in the sequence. owner(block) = block mod 2; local(block) = floor(block / 2).</text>

  <text x="65" y="215" class="label">logical sequence</text>
  <rect x="210" y="188" width="245" height="62" rx="10" class="block0"/>
  <text x="332" y="213" text-anchor="middle" class="label">global block 0 to rank 0</text>
  <text x="332" y="237" text-anchor="middle" class="mono">positions 0 1 2 3</text>
  <rect x="475" y="188" width="245" height="62" rx="10" class="block1"/>
  <text x="597" y="213" text-anchor="middle" class="label">global block 1 to rank 1</text>
  <text x="597" y="237" text-anchor="middle" class="mono">positions 4 5 6 7</text>
  <rect x="740" y="188" width="245" height="62" rx="10" class="block0"/>
  <text x="862" y="213" text-anchor="middle" class="label">global block 2 to rank 0</text>
  <text x="862" y="237" text-anchor="middle" class="mono">positions 8 9 10 11</text>
  <rect x="1010" y="188" width="110" height="62" rx="10" class="reduce"/>
  <text x="1065" y="213" text-anchor="middle" class="label">query</text>
  <text x="1065" y="237" text-anchor="middle" class="mono">q11</text>

  <path d="M332 252 C332 275 290 280 290 298" class="arrow0"/>
  <path d="M862 252 C862 275 405 280 405 298" class="arrow0"/>
  <path d="M597 252 C597 275 825 280 825 298" class="arrow1"/>
  <rect x="130" y="298" width="420" height="65" rx="12" class="gpu0"/>
  <text x="150" y="325" class="label">GPU 0 local pool</text>
  <text x="150" y="349" class="mono">local 0 = global 0   local 1 = global 2</text>
  <rect x="650" y="298" width="420" height="65" rx="12" class="gpu1"/>
  <text x="670" y="325" class="label">GPU 1 local pool</text>
  <text x="670" y="349" class="mono">local 0 = global 1</text>

  <rect x="40" y="415" width="1120" height="355" rx="16" class="panel"/>
  <text x="65" y="450" class="section">2. Local softmax is wrong; two reductions reconstruct the global softmax</text>
  <text x="65" y="478" class="small">Both ranks hold q11. Each reads only its owned K/V and produces query-shaped statistics; K/V never moves.</text>

  <rect x="65" y="510" width="300" height="115" rx="12" class="gpu0"/>
  <text x="85" y="540" class="label">rank 0 local scores</text>
  <text x="85" y="568" class="mono">s0...s3, s8...s11</text>
  <text x="85" y="598" class="mono">m0 = max(local scores)</text>
  <rect x="835" y="510" width="300" height="115" rx="12" class="gpu1"/>
  <text x="855" y="540" class="label">rank 1 local scores</text>
  <text x="855" y="568" class="mono">s4...s7</text>
  <text x="855" y="598" class="mono">m1 = max(local scores)</text>

  <path d="M365 568 H465" class="arrow0"/>
  <path d="M835 568 H735" class="arrow1"/>
  <rect x="465" y="520" width="270" height="95" rx="12" class="reduce"/>
  <text x="600" y="550" text-anchor="middle" class="label">MAX all-reduce</text>
  <text x="600" y="579" text-anchor="middle" class="mono">m = max(m0, m1)</text>
  <text x="600" y="602" text-anchor="middle" class="small">shared stable shift</text>

  <path d="M215 625 V655" class="flow"/>
  <path d="M985 625 V655" class="flow"/>
  <rect x="65" y="655" width="300" height="80" rx="12" class="gpu0"/>
  <text x="85" y="682" class="mono">d0 = sum exp(s - m)</text>
  <text x="85" y="712" class="mono">n0 = sum exp(s - m) v</text>
  <rect x="835" y="655" width="300" height="80" rx="12" class="gpu1"/>
  <text x="855" y="682" class="mono">d1 = sum exp(s - m)</text>
  <text x="855" y="712" class="mono">n1 = sum exp(s - m) v</text>

  <path d="M365 695 H455" class="arrow0"/>
  <path d="M835 695 H745" class="arrow1"/>
  <rect x="455" y="646" width="290" height="100" rx="12" class="reduce"/>
  <text x="600" y="674" text-anchor="middle" class="label">SUM all-reduce</text>
  <text x="600" y="702" text-anchor="middle" class="mono">d = d0 + d1; n = n0 + n1</text>
  <text x="600" y="729" text-anchor="middle" class="mono">attention(q11) = n / d</text>

  <rect x="40" y="785" width="1120" height="25" rx="8" fill="#eef1f6"/>
  <text x="600" y="803" text-anchor="middle" class="small">Per layer and forward: one MAX plus one SUM collective. Persistent KV halves per rank; replicated weights and communication remain.</text>
</svg>
