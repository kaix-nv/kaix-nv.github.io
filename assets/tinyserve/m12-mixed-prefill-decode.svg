<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
  <title id="title">Three request histories in one packed model forward</title>
  <desc id="desc">A and B each append one decode token. C appends eight prompt tokens. The reference executes decode and prefill forwards separately. The mixed path packs ten query rows, retains three separate causal histories, and projects only A and B to logits because C's prompt is incomplete.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#20334b;font-size:18px}.heading{font-size:24px;font-weight:700}.small{font-size:16px}.box{rx:10;stroke:#8ba0b6;stroke-width:1.5}.a{fill:#dbeafe}.b{fill:#dcfce7}.c{fill:#ffedd5}.arrow{stroke:#52677e;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52677e"/></marker></defs>
  <rect width="1120" height="650" fill="#fff"/>
  <text x="32" y="38" class="heading">M12: batch the token work, preserve each request's history</text>
  <text x="32" y="76">Before: two forwards in the same engine step</text>
  <rect x="32" y="94" width="330" height="66" class="box a"/><text x="52" y="122">Decode forward: A + B</text><text x="52" y="147" class="small">2 query rows; sample 2 tokens</text>
  <path d="M374 127H438" class="arrow"/>
  <rect x="452" y="94" width="420" height="66" class="box c"/><text x="472" y="122">Prefill forward: C's next chunk</text><text x="472" y="147" class="small">8 query rows; prompt not finished</text>
  <text x="32" y="206">After: one forward over a flat row of 10 tokens</text>
  <rect x="32" y="224" width="90" height="48" class="box a"/><text x="50" y="254">A: 1</text>
  <rect x="130" y="224" width="90" height="48" class="box b"/><text x="148" y="254">B: 1</text>
  <rect x="228" y="224" width="644" height="48" class="box c"/><text x="248" y="254">C: 8 prompt tokens</text>
  <text x="32" y="305" class="small">Query boundaries: [0, 1, 2, 10]   |   Absolute positions: [5, 3, 0, 1, 2, 3, 4, 5, 6, 7]</text>
  <path d="M452 317V346" class="arrow"/>
  <rect x="32" y="356" width="840" height="56" class="box" fill="#eef2ff"/>
  <text x="52" y="390">Shared projections / MLPs; independent, prefix-offset causal attention</text>
  <rect x="32" y="440" width="255" height="90" class="box a"/><text x="48" y="468">A: 5 cached + 1 new</text><text x="48" y="498" class="small">one query sees 6 KV tokens</text>
  <rect x="304" y="440" width="255" height="90" class="box b"/><text x="320" y="468">B: 3 cached + 1 new</text><text x="320" y="498" class="small">one query sees 4 KV tokens</text>
  <rect x="576" y="440" width="296" height="90" class="box c"/><text x="592" y="468">C: 8 new prompt tokens</text><text x="592" y="498" class="small">query i sees positions 0 to i</text>
  <path d="M884 384H904V554H452V574" class="arrow"/>
  <text x="920" y="375" class="small">Select output</text><text x="920" y="402" class="small">rows [0, 1]</text>
  <rect x="32" y="584" width="840" height="44" class="box" fill="#f1f5f9"/>
  <text x="52" y="612">Sample A and B only. C needs four more prompt tokens before sampling.</text>
</svg>
