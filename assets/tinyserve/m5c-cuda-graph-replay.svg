<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" role="img"
     aria-labelledby="title description">
  <title id="title">CUDA graph replay for a live batch of three requests</title>
  <desc id="description">
    A live batch of three selects the captured batch-four bucket. Three real
    rows and one dummy row are copied into persistent buffers. FlashInfer plan
    refreshes fixed page-table metadata, one CUDA graph replay launches the
    recorded model forward, and the dummy logit row is discarded. A lower
    comparison shows eager per-operation dispatch versus one graph replay.
  </desc>

  <defs>
    <style>
      .title { font: 700 30px system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px system-ui, sans-serif; fill: #475569; }
      .stage { font: 700 19px system-ui, sans-serif; fill: #0f172a; }
      .label { font: 600 15px system-ui, sans-serif; fill: #334155; }
      .small { font: 500 13px system-ui, sans-serif; fill: #475569; }
      .mono { font: 600 14px ui-monospace, monospace; fill: #0f172a; }
      .cell { font: 700 14px system-ui, sans-serif; fill: #0f172a; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 3; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <pattern id="scratch" width="10" height="10" patternUnits="userSpaceOnUse"
             patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#fff7ed"/>
      <rect width="3" height="10" fill="#fed7aa"/>
    </pattern>
  </defs>

  <rect width="1280" height="780" rx="20" fill="#f8fafc"/>
  <text x="50" y="52" class="title">Decode graph replay: dynamic values, fixed shapes and addresses</text>
  <text x="50" y="82" class="subtitle">
    Live B=3 uses the captured B=4 bucket; the fourth row is isolated in scratch storage.
  </text>

  <g>
    <rect x="50" y="126" width="220" height="356" rx="16" fill="#ffffff"
          stroke="#cbd5e1" stroke-width="2"/>
    <text x="160" y="160" text-anchor="middle" class="stage">Live batch</text>
    <text x="160" y="185" text-anchor="middle" class="mono">B = 3</text>

    <rect x="78" y="218" width="164" height="54" rx="9" fill="#dbeafe" stroke="#2563eb"/>
    <text x="160" y="251" text-anchor="middle" class="cell">request A</text>
    <rect x="78" y="286" width="164" height="54" rx="9" fill="#dbeafe" stroke="#2563eb"/>
    <text x="160" y="319" text-anchor="middle" class="cell">request B</text>
    <rect x="78" y="354" width="164" height="54" rx="9" fill="#dbeafe" stroke="#2563eb"/>
    <text x="160" y="387" text-anchor="middle" class="cell">request C</text>
    <text x="160" y="443" text-anchor="middle" class="small">tokens, positions, slots,</text>
    <text x="160" y="463" text-anchor="middle" class="small">block tables, context lengths</text>
  </g>

  <path d="M 280 304 L 334 304" class="arrow" marker-end="url(#arrow)"/>
  <text x="307" y="288" text-anchor="middle" class="small">ceil bucket</text>

  <g>
    <rect x="346" y="126" width="266" height="356" rx="16" fill="#ffffff"
          stroke="#cbd5e1" stroke-width="2"/>
    <text x="479" y="160" text-anchor="middle" class="stage">Persistent buffers</text>
    <text x="479" y="185" text-anchor="middle" class="mono">captured Bc = 4</text>

    <rect x="374" y="213" width="210" height="44" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="479" y="241" text-anchor="middle" class="cell">row 0 · real addresses</text>
    <rect x="374" y="267" width="210" height="44" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="479" y="295" text-anchor="middle" class="cell">row 1 · real addresses</text>
    <rect x="374" y="321" width="210" height="44" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="479" y="349" text-anchor="middle" class="cell">row 2 · real addresses</text>
    <rect x="374" y="375" width="210" height="44" rx="8" fill="url(#scratch)" stroke="#ea580c"/>
    <text x="479" y="403" text-anchor="middle" class="cell">row 3 · dummy → scratch</text>
    <text x="479" y="452" text-anchor="middle" class="small">copy_ changes values,</text>
    <text x="479" y="470" text-anchor="middle" class="small">never buffer identity</text>
  </g>

  <path d="M 622 304 L 676 304" class="arrow" marker-end="url(#arrow)"/>
  <text x="649" y="279" text-anchor="middle" class="small">plan()</text>
  <text x="649" y="296" text-anchor="middle" class="small">refresh CSR</text>

  <g>
    <rect x="688" y="126" width="260" height="356" rx="16" fill="#f5f3ff"
          stroke="#7c3aed" stroke-width="2"/>
    <text x="818" y="160" text-anchor="middle" class="stage">Captured forward</text>
    <text x="818" y="185" text-anchor="middle" class="mono">graph.replay()</text>

    <rect x="724" y="222" width="188" height="52" rx="9" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="818" y="254" text-anchor="middle" class="cell">embedding + layer 0</text>
    <path d="M 818 280 L 818 310" class="arrow" marker-end="url(#arrow)"/>
    <rect x="724" y="322" width="188" height="52" rx="9" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="818" y="354" text-anchor="middle" class="cell">layers 1 … 27</text>
    <path d="M 818 380 L 818 410" class="arrow" marker-end="url(#arrow)"/>
    <rect x="724" y="422" width="188" height="40" rx="9" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="818" y="447" text-anchor="middle" class="cell">LM head</text>
  </g>

  <path d="M 958 304 L 1012 304" class="arrow" marker-end="url(#arrow)"/>

  <g>
    <rect x="1024" y="126" width="206" height="356" rx="16" fill="#ffffff"
          stroke="#cbd5e1" stroke-width="2"/>
    <text x="1127" y="160" text-anchor="middle" class="stage">Persistent logits</text>

    <rect x="1052" y="218" width="150" height="48" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="1127" y="248" text-anchor="middle" class="cell">row 0 · return</text>
    <rect x="1052" y="278" width="150" height="48" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="1127" y="308" text-anchor="middle" class="cell">row 1 · return</text>
    <rect x="1052" y="338" width="150" height="48" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="1127" y="368" text-anchor="middle" class="cell">row 2 · return</text>
    <rect x="1052" y="398" width="150" height="48" rx="8" fill="url(#scratch)" stroke="#ea580c"/>
    <text x="1127" y="428" text-anchor="middle" class="cell">row 3 · discard</text>
  </g>

  <rect x="50" y="530" width="1180" height="190" rx="16" fill="#ffffff"
        stroke="#94a3b8" stroke-width="2"/>
  <text x="78" y="566" class="stage">What changes on the host each token?</text>

  <text x="78" y="612" class="label">Eager forward</text>
  <rect x="216" y="586" width="116" height="44" rx="8" fill="#fee2e2" stroke="#ef4444"/>
  <text x="274" y="614" text-anchor="middle" class="small">dispatch op 1</text>
  <path d="M 340 608 L 374 608" class="arrow" marker-end="url(#arrow)"/>
  <rect x="386" y="586" width="116" height="44" rx="8" fill="#fee2e2" stroke="#ef4444"/>
  <text x="444" y="614" text-anchor="middle" class="small">dispatch op 2</text>
  <text x="530" y="614" class="mono">… many eager dispatches …</text>
  <rect x="792" y="586" width="138" height="44" rx="8" fill="#fee2e2" stroke="#ef4444"/>
  <text x="861" y="614" text-anchor="middle" class="small">dispatch final op</text>

  <text x="78" y="681" class="label">Graph path</text>
  <rect x="216" y="654" width="164" height="44" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="298" y="682" text-anchor="middle" class="small">copy inputs + plan</text>
  <path d="M 390 676 L 438 676" class="arrow" marker-end="url(#arrow)"/>
  <rect x="450" y="654" width="190" height="44" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="545" y="682" text-anchor="middle" class="cell">one graph replay call</text>
  <path d="M 650 676 L 698 676" class="arrow" marker-end="url(#arrow)"/>
  <rect x="710" y="654" width="164" height="44" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="792" y="682" text-anchor="middle" class="small">read real logits</text>
  <text x="930" y="682" class="small">Sampling remains outside the captured model forward.</text>
</svg>
