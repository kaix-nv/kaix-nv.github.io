<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">Attention head and memory representations</title><desc id="desc">MHA stores eight KV heads for eight query heads, GQA stores two, and MQA stores one. MLA stores a latent and separate positional component and moves content projections around attention.</desc>
<rect width="1200" height="660" rx="18" fill="#f5f8fc"/><g font-family="Arial,sans-serif" fill="#172b43">
<text x="35" y="48" font-size="28" font-weight="700">Persistent history is an architectural choice</text>
<text x="35" y="87" font-size="20">Illustration: Hq = 8. Each colored KV box represents both a key and a value head.</text>
<g fill="white" stroke="#bccbda"><rect x="35" y="112" width="350" height="284" rx="12"/><rect x="425" y="112" width="350" height="284" rx="12"/><rect x="815" y="112" width="350" height="284" rx="12"/></g>
