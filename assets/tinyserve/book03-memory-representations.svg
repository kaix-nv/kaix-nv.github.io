<g font-size="19"><text x="58" y="342">8 KV heads per token</text><text x="448" y="342">2 KV heads per token</text><text x="838" y="342">1 KV head per token</text><text x="58" y="371">Payload: 16 d elements</text><text x="448" y="371">Payload: 4 d elements</text><text x="838" y="371">Payload: 2 d elements</text></g>
