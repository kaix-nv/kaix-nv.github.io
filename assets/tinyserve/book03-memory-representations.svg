<g font-size="20"><text x="60" y="503">Cache per token: latent c [r] + separate component [dr]</text><text x="60" y="539">Content score: (Wkᵀ q)ᵀ c       Value output: Wv Σ(p c)</text><text x="60" y="575">Kimi fixture: 512 + 64 BF16 elements = 1,152 bytes per token per MLA layer</text></g>
<text x="38" y="640" font-size="18">These architectures require matching trained weights. Cache savings are not measured latency gains.</text>
