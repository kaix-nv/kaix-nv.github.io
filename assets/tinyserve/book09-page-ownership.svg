<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Two histories can share physical prefix pages</title>
<desc id="desc">Requests A and B share their first eight tokens in physical pages seven and two, each with refcount two. Their tails reside in separate physical pages nine and four. Logical position five maps to physical page two offset one.</desc>
<defs>
<style>
text{font-family:system-ui,sans-serif;fill:#0f172a}
.title{font-size:28px;font-weight:700}.heading{font-size:22px;font-weight:700}
.body{font-size:20px}.small{font-size:17px;fill:#475569}.mono{font-size:21px;font-family:ui-monospace,monospace}
.blue{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.purple{fill:#ede9fe;stroke:#7c3aed;stroke-width:2}
.green{fill:#dcfce7;stroke:#16a34a;stroke-width:2}.orange{fill:#ffedd5;stroke:#ea580c;stroke-width:2}
.gray{fill:#e2e8f0;stroke:#94a3b8;stroke-width:2}.white{fill:#fff;stroke:#cbd5e1;stroke-width:2}
.arrow{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
<path d="M0 0L10 5L0 10Z" fill="#64748b"/>
</marker>
</defs>
<rect width="1200" height="700" rx="16" fill="#f8fafc"/>
<text x="32" y="44" class="title" text-anchor="start">Two histories can share physical prefix pages</text>
<text x="32" y="82" class="body" text-anchor="start">Illustrative page size: four tokens. Page IDs describe physical storage, not logical order.</text>
<rect x="32" y="115" width="548" height="175" rx="10" class="purple"/>
<text x="54" y="150" class="mono" text-anchor="start">Request A: 10 cached tokens</text>
<text x="54" y="194" class="mono" text-anchor="start">Tokens: [a b c d] [e f g h] [i j]</text>
<text x="54" y="238" class="mono" text-anchor="start">Table:          [7,       2,       9]</text>
<rect x="620" y="115" width="548" height="175" rx="10" class="blue"/>
<text x="642" y="150" class="mono" text-anchor="start">Request B: 10 cached tokens</text>
<text x="642" y="194" class="mono" text-anchor="start">Tokens: [a b c d] [e f g h] [x y]</text>
<text x="642" y="238" class="mono" text-anchor="start">Table:          [7,       2,       4]</text>
<path d="M180 294 L310 324 M700 294 L310 324" fill="none" stroke="#64748b" stroke-width="2.5"/>
<circle cx="310" cy="324" r="4" fill="#64748b"/>
<path d="M310 324 L158 348" class="arrow"/>
<path d="M310 324 L452 348" class="arrow"/>
<path d="M460 294 L720 348" class="arrow"/>
<path d="M1020 294 L1000 348" class="arrow"/>
<rect x="32" y="354" width="257" height="152" rx="10" class="green"/>
<text x="50" y="389" class="heading" text-anchor="start">Physical page 7</text>
<text x="50" y="436" class="mono" text-anchor="start">a  b  c  d</text>
<text x="50" y="479" class="small" text-anchor="start">A + B · refcount 2</text>
<rect x="325" y="354" width="257" height="152" rx="10" class="green"/>
<text x="343" y="389" class="heading" text-anchor="start">Physical page 2</text>
<text x="343" y="436" class="mono" text-anchor="start">e  f  g  h</text>
<text x="343" y="479" class="small" text-anchor="start">A + B · refcount 2</text>
<rect x="618" y="354" width="257" height="152" rx="10" class="purple"/>
<text x="636" y="389" class="heading" text-anchor="start">Physical page 9</text>
<text x="636" y="436" class="mono" text-anchor="start">i  j  —  —</text>
<text x="636" y="479" class="small" text-anchor="start">A only · refcount 1</text>
<rect x="911" y="354" width="257" height="152" rx="10" class="blue"/>
<text x="929" y="389" class="heading" text-anchor="start">Physical page 4</text>
<text x="929" y="436" class="mono" text-anchor="start">x  y  —  —</text>
<text x="929" y="479" class="small" text-anchor="start">B only · refcount 1</text>
<rect x="32" y="546" width="1136" height="120" rx="10" class="white"/>
<text x="52" y="580" class="body" text-anchor="start">A position 5 → logical page 1 → physical page 2 → offset 1 → flat slot 9</text>
<text x="52" y="610" class="body" text-anchor="start">slot(p) = 4 × table[floor(p / 4)] + (p mod 4)</text>
<text x="52" y="640" class="body" text-anchor="start">Shared pages are full and immutable. Each partial tail remains private.</text>
</svg>
