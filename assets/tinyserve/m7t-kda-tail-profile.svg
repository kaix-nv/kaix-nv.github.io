<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Why the multi-chunk KDA tail is the next optimization target</title>
  <desc id="desc">A 2048-token prompt becomes 32 ordered chunks. Pair construction launches many independent blocks, while the tail launches only 64 state-tile blocks on an 84-SM A6000. The profile selects a smaller value tile as the next experiment.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 25px ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .head { font: 700 17px ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .body { font: 14px ui-sans-serif, system-ui, sans-serif; fill: #334155; }
      .mono { font: 14px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1e293b; }
      .small { font: 12px ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; rx: 12; }
      .blue { fill: #dbeafe; stroke: #3b82f6; stroke-width: 1.5; rx: 7; }
      .green { fill: #dcfce7; stroke: #22c55e; stroke-width: 1.5; rx: 7; }
      .amber { fill: #fef3c7; stroke: #f59e0b; stroke-width: 1.5; rx: 7; }
      .red { fill: #fee2e2; stroke: #ef4444; stroke-width: 1.5; rx: 7; }
      .violet { fill: #ede9fe; stroke: #8b5cf6; stroke-width: 1.5; rx: 7; }
      .dash { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 2; stroke-dasharray: 7 5; rx: 12; }
      .line { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="40" y="42" class="title">M7t: the pair stage has parallel work; the state-carrying tail does not</text>

  <rect x="35" y="70" width="1130" height="115" class="box"/>
  <text x="55" y="100" class="head">Concrete prompt: T=2,048, C=64 → 32 algebra chunks</text>
  <rect x="55" y="122" width="64" height="34" class="blue"/><text x="75" y="144" class="mono">c0</text>
  <path d="M 119 139 L 144 139" class="line"/>
  <rect x="149" y="122" width="64" height="34" class="blue"/><text x="169" y="144" class="mono">c1</text>
  <path d="M 213 139 L 238 139" class="line"/>
  <rect x="243" y="122" width="64" height="34" class="blue"/><text x="263" y="144" class="mono">c2</text>
  <text x="329" y="144" class="mono">…</text>
  <rect x="367" y="122" width="74" height="34" class="blue"/><text x="382" y="144" class="mono">c31</text>
  <text x="475" y="132" class="body">Pair matrices: independent across chunks.</text>
  <text x="475" y="158" class="body">State carry:</text>
  <text x="562" y="158" class="mono">S(n+1) ← S(n)</text>
  <text x="735" y="158" class="body">so chunks stay ordered.</text>

  <rect x="35" y="215" width="535" height="330" class="box"/>
  <text x="55" y="247" class="head">Pair construction: enough independent blocks</text>
  <text x="55" y="274" class="mono">grid = rows × 4 source tiles = 65,536 blocks</text>
  <rect x="55" y="300" width="145" height="62" class="green"/>
  <text x="75" y="326" class="mono">chunk 0</text><text x="75" y="348" class="small">L[0], P[0]</text>
  <rect x="215" y="300" width="145" height="62" class="green"/>
  <text x="235" y="326" class="mono">chunk 1</text><text x="235" y="348" class="small">L[1], P[1]</text>
  <rect x="375" y="300" width="145" height="62" class="green"/>
  <text x="395" y="326" class="mono">… chunk 31</text><text x="395" y="348" class="small">independent</text>
  <text x="55" y="402" class="mono">56 registers/thread      0 local loads/stores</text>
  <text x="55" y="430" class="mono">86.69 waves/SM           72.75% achieved occupancy</text>
  <text x="55" y="458" class="mono">0.872 ms under NCU       44.93% MIO-throttle samples</text>
  <rect x="55" y="480" width="465" height="42" class="amber"/>
  <text x="72" y="506" class="body">Secondary issue: strided source-key loads waste 67% of sectors.</text>

  <rect x="600" y="215" width="565" height="330" class="box"/>
  <text x="620" y="247" class="head">Ordered tail: one large live tile per block</text>
  <text x="620" y="274" class="mono">grid = 8 heads × 8 value tiles = 64 blocks</text>
  <rect x="620" y="300" width="190" height="84" class="red"/>
  <text x="641" y="327" class="mono">state [128,16]</text>
  <text x="641" y="351" class="small">plus solved/output rows</text>
  <text x="641" y="372" class="small">kept across 32 chunks</text>
  <path d="M 810 342 L 845 342" class="line"/>
  <rect x="850" y="300" width="275" height="84" class="blue"/>
  <text x="870" y="326" class="mono">c0 → c1 → … → c31</text>
  <text x="870" y="350" class="small">causal order stays inside</text>
  <text x="870" y="372" class="small">each value-tile program</text>
  <text x="620" y="420" class="mono">255 registers/thread     36.86 KiB shared/block</text>
  <text x="620" y="448" class="mono">0.76 waves/SM            16.43% achieved occupancy</text>
  <text x="620" y="476" class="mono">6.98M local loads        1.97M local stores</text>
  <rect x="620" y="492" width="505" height="36" class="red"/>
  <text x="638" y="515" class="body">64 blocks leave 20 of the A6000's 84 SMs unused.</text>

  <path d="M 882 545 L 882 576" class="line"/>
  <rect x="250" y="585" width="700" height="88" class="dash"/>
  <text x="275" y="615" class="head">M7u experiment selected by the profile — not a result yet</text>
  <text x="275" y="642" class="mono">BLOCK_V: 16 → 8   |   state tile: [128,16] → [128,8]   |   grid: 64 → 128</text>
  <text x="275" y="662" class="small">Keep FP32 equations and the 32-chunk causal order; measure repeats, spills, occupancy, parity, and full-model latency.</text>
</svg>
