<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">M7c fuses nine RMSNorm kernels into one captured decode kernel</title>
  <desc id="desc">The PyTorch reference expresses RMSNorm as nine GPU operations for casts, reduction, normalization, and scaling. During CUDA graph capture, tinyserve uses one FlashInfer RMSNorm kernel instead. Qwen3-8B calls RMSNorm 145 times per decode token, reducing normalization nodes from 1305 to 145 and total graph kernels from 2353 to 1193. Eager prefill and decode retain the reference path.</desc>
  <defs>
    <style>
      .title{font:700 29px system-ui,sans-serif;fill:#172033}.subtitle{font:15px system-ui,sans-serif;fill:#536078}.head{font:700 20px system-ui,sans-serif;fill:#172033}.label{font:600 15px system-ui,sans-serif;fill:#24304a}.small{font:13px system-ui,sans-serif;fill:#536078}.mono{font:14px ui-monospace,SFMono-Regular,monospace;fill:#24304a}.panel{fill:#f7f9fc;stroke:#cbd3e1;stroke-width:1.5}.old{fill:#fff0e8;stroke:#d87847;stroke-width:1.5}.new{fill:#eaf7ed;stroke:#4a9a61;stroke-width:1.5}.node{fill:#fff;stroke:#8996aa;stroke-width:1.3}.capture{fill:#eaf2ff;stroke:#397fc3;stroke-width:1.5}.note{fill:#fff8dd;stroke:#c79a28;stroke-width:1.4}.arrow{stroke:#66748d;stroke-width:2;fill:none;marker-end:url(#arrow)}.oldarrow{stroke:#d87847;stroke-width:1.7;fill:none;marker-end:url(#oldarrow)}.newarrow{stroke:#4a9a61;stroke-width:2.2;fill:none;marker-end:url(#newarrow)}
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#66748d"/></marker>
    <marker id="oldarrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d87847"/></marker>
    <marker id="newarrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a9a61"/></marker>
  </defs>
  <rect width="1200" height="760" rx="20" fill="#fbfcfe"/>
  <text x="48" y="48" class="title">M7c: a CUDA graph replays every node you captured</text>
  <text x="48" y="77" class="subtitle">Graph replay removes Python dispatch; kernel fusion removes redundant device work inside the graph.</text>

  <rect x="40" y="108" width="545" height="410" rx="16" class="panel"/>
  <text x="64" y="143" class="head">Reference RMSNorm: 9 graph nodes</text>
  <text x="64" y="169" class="small">Readable PyTorch expression, expanded into casts and pointwise kernels</text>

  <rect x="66" y="195" width="112" height="48" rx="8" class="old"/>
  <text x="122" y="216" text-anchor="middle" class="label">1. cast x</text>
  <text x="122" y="234" text-anchor="middle" class="small">bf16 to fp32</text>
  <path d="M178 219 H201" class="oldarrow"/>
  <rect x="205" y="195" width="100" height="48" rx="8" class="node"/>
  <text x="255" y="225" text-anchor="middle" class="label">2. square</text>
  <path d="M305 219 H328" class="oldarrow"/>
  <rect x="332" y="195" width="100" height="48" rx="8" class="node"/>
  <text x="382" y="225" text-anchor="middle" class="label">3. mean</text>
  <path d="M432 219 H455" class="oldarrow"/>
  <rect x="459" y="195" width="100" height="48" rx="8" class="node"/>
  <text x="509" y="225" text-anchor="middle" class="label">4. + eps</text>

  <path d="M509 243 V270" class="oldarrow"/>
  <rect x="459" y="275" width="100" height="48" rx="8" class="node"/>
  <text x="509" y="305" text-anchor="middle" class="label">5. rsqrt</text>
  <path d="M459 299 H436" class="oldarrow"/>
  <rect x="316" y="275" width="116" height="48" rx="8" class="node"/>
  <text x="374" y="296" text-anchor="middle" class="label">6. x * inv_rms</text>
  <text x="374" y="314" text-anchor="middle" class="small">normalize</text>
  <path d="M316 299 H293" class="oldarrow"/>
  <rect x="177" y="275" width="112" height="48" rx="8" class="node"/>
  <text x="233" y="296" text-anchor="middle" class="label">8. * weight</text>
  <text x="233" y="314" text-anchor="middle" class="small">scale</text>
  <path d="M177 299 H154" class="oldarrow"/>
  <rect x="66" y="275" width="84" height="48" rx="8" class="old"/>
  <text x="108" y="296" text-anchor="middle" class="label">9. cast</text>
  <text x="108" y="314" text-anchor="middle" class="small">to bf16</text>

  <rect x="177" y="354" width="112" height="48" rx="8" class="node"/>
  <text x="233" y="375" text-anchor="middle" class="label">7. cast weight</text>
  <text x="233" y="393" text-anchor="middle" class="small">bf16 to fp32</text>
  <path d="M233 354 V327" class="oldarrow"/>
  <rect x="66" y="437" width="493" height="54" rx="9" class="old"/>
  <text x="312" y="459" text-anchor="middle" class="label">One CUDA graph launch still replays all nine nodes</text>
  <text x="312" y="480" text-anchor="middle" class="small">The CPU is gone from the hot path; the device dependency chain remains.</text>

  <rect x="615" y="108" width="545" height="410" rx="16" class="panel"/>
  <text x="639" y="143" class="head">Captured fast path: 1 graph node</text>
  <text x="639" y="169" class="small">The input, weight, epsilon, output dtype, and mathematics stay the same</text>
  <rect x="650" y="205" width="120" height="62" rx="9" class="capture"/>
  <text x="710" y="230" text-anchor="middle" class="label">x, weight</text>
  <text x="710" y="250" text-anchor="middle" class="small">bf16 rows</text>
  <path d="M770 236 H811" class="newarrow"/>
  <rect x="816" y="190" width="300" height="92" rx="12" class="new"/>
  <text x="966" y="220" text-anchor="middle" class="head">FlashInfer RMSNorm</text>
  <text x="966" y="245" text-anchor="middle" class="label">reduce + normalize + scale</text>
  <text x="966" y="266" text-anchor="middle" class="small">one kernel, bf16/fp16 input and output</text>

  <rect x="650" y="318" width="466" height="132" rx="12" class="capture"/>
  <text x="673" y="346" class="label">Capture is the semantic boundary</text>
  <text x="673" y="374" class="small">1. GraphRunner enables the fused kernel.</text>
  <text x="673" y="397" class="small">2. Warmup and capture record fused decode work.</text>
  <text x="673" y="420" class="small">3. The flag is restored; replay keeps the recorded node.</text>
  <text x="673" y="443" class="small">4. Eager prefill/decode still uses the PyTorch oracle.</text>
  <rect x="650" y="466" width="466" height="25" rx="8" class="new"/>
  <text x="883" y="484" text-anchor="middle" class="small">Optimization cannot leak into the reference path.</text>

  <rect x="40" y="548" width="1120" height="164" rx="16" class="panel"/>
  <text x="64" y="582" class="head">One Qwen3-8B decode token</text>
  <rect x="66" y="607" width="358" height="69" rx="10" class="capture"/>
  <text x="245" y="633" text-anchor="middle" class="label">36 layers x 4 norms + 1 final norm</text>
  <text x="245" y="657" text-anchor="middle" class="mono">= 145 RMSNorm calls</text>
  <path d="M424 641 H469" class="arrow"/>
  <rect x="474" y="607" width="286" height="69" rx="10" class="old"/>
  <text x="617" y="633" text-anchor="middle" class="label">Normalization nodes</text>
  <text x="617" y="657" text-anchor="middle" class="mono">1,305 to 145</text>
  <path d="M760 641 H805" class="arrow"/>
  <rect x="810" y="607" width="316" height="69" rx="10" class="new"/>
  <text x="968" y="633" text-anchor="middle" class="label">All decode graph kernels</text>
  <text x="968" y="657" text-anchor="middle" class="mono">2,353 to 1,193 per token</text>
  <rect x="66" y="688" width="1060" height="1" fill="#d8dee9"/>
  <text x="596" y="704" text-anchor="middle" class="small">Same RMSNorm equation; 1,160 fewer graph nodes to schedule on the GPU.</text>
</svg>
