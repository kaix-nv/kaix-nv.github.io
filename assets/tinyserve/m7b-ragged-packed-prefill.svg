<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">Padded and ragged packed prefill with two concrete prompts</title>
  <desc id="desc">The old path left-pads a three-token prompt to the five-token length and applies a dense mask. The new path concatenates both prompts into eight tokens, uses indptr boundaries zero, three, eight to isolate attention, writes each token to its physical KV slot, and selects flat hidden positions two and seven for logits.</desc>
  <defs>
    <style>
      .title{font:700 29px system-ui,sans-serif;fill:#172033}.subtitle{font:15px system-ui,sans-serif;fill:#536078}.head{font:700 20px system-ui,sans-serif;fill:#172033}.label{font:600 15px system-ui,sans-serif;fill:#24304a}.small{font:13px system-ui,sans-serif;fill:#536078}.mono{font:14px ui-monospace,SFMono-Regular,monospace;fill:#24304a}.panel{fill:#f7f9fc;stroke:#cbd3e1;stroke-width:1.5}.old{fill:#fff0e8;stroke:#d87847;stroke-width:1.5}.new{fill:#eaf7ed;stroke:#4a9a61;stroke-width:1.5}.a{fill:#dcecff;stroke:#397fc3;stroke-width:1.4}.b{fill:#efe4ff;stroke:#8561b8;stroke-width:1.4}.pad{fill:#e5e8ee;stroke:#9aa4b3;stroke-width:1.2}.mask{fill:#ffd9c6;stroke:#d87847;stroke-width:1}.boundary{stroke:#cf5d5d;stroke-width:3;stroke-dasharray:6 5}.arrow{stroke:#66748d;stroke-width:2;fill:none;marker-end:url(#arrow)}.thin{stroke:#9aa4b3;stroke-width:1.2;fill:none}.ok{fill:#dff4e5;stroke:#4a9a61;stroke-width:1.5}.note{fill:#fff8dd;stroke:#c79a28;stroke-width:1.4}
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#66748d"/></marker>
  </defs>
  <rect width="1200" height="780" rx="20" fill="#fbfcfe"/>
  <text x="48" y="48" class="title">M7b: one forward, zero prompt padding</text>
  <text x="48" y="76" class="subtitle">Concrete batch: prompt A has 3 tokens; prompt B has 5. Packing stays, but the tensor layout changes.</text>

  <rect x="40" y="105" width="525" height="355" rx="16" class="panel"/>
  <text x="64" y="140" class="head">Before: rectangular padded batch</text>
  <text x="64" y="166" class="small">Shape [2, 5] plus a dense [2, 1, 5, 5] mask</text>
  <text x="68" y="213" class="label">A</text>
  <rect x="100" y="185" width="72" height="48" rx="7" class="pad"/><text x="136" y="214" text-anchor="middle" class="mono">PAD</text>
  <rect x="180" y="185" width="72" height="48" rx="7" class="pad"/><text x="216" y="214" text-anchor="middle" class="mono">PAD</text>
  <rect x="260" y="185" width="72" height="48" rx="7" class="a"/><text x="296" y="214" text-anchor="middle" class="mono">a₀</text>
  <rect x="340" y="185" width="72" height="48" rx="7" class="a"/><text x="376" y="214" text-anchor="middle" class="mono">a₁</text>
  <rect x="420" y="185" width="72" height="48" rx="7" class="a"/><text x="456" y="214" text-anchor="middle" class="mono">a₂</text>
  <text x="68" y="277" class="label">B</text>
  <rect x="100" y="249" width="72" height="48" rx="7" class="b"/><text x="136" y="278" text-anchor="middle" class="mono">b₀</text>
  <rect x="180" y="249" width="72" height="48" rx="7" class="b"/><text x="216" y="278" text-anchor="middle" class="mono">b₁</text>
  <rect x="260" y="249" width="72" height="48" rx="7" class="b"/><text x="296" y="278" text-anchor="middle" class="mono">b₂</text>
  <rect x="340" y="249" width="72" height="48" rx="7" class="b"/><text x="376" y="278" text-anchor="middle" class="mono">b₃</text>
  <rect x="420" y="249" width="72" height="48" rx="7" class="b"/><text x="456" y="278" text-anchor="middle" class="mono">b₄</text>
  <path d="M296 314 L296 326 L456 326 L456 314" class="thin"/>
  <text x="376" y="348" text-anchor="middle" class="small">last real token aligned at column 4</text>
  <rect x="64" y="370" width="477" height="66" rx="10" class="old"/>
  <text x="82" y="397" class="label">Cost hidden by the convenient rectangle</text>
  <text x="82" y="421" class="small">padding work + dense mask + copied GQA KV heads</text>

  <rect x="590" y="105" width="570" height="355" rx="16" class="panel"/>
  <text x="614" y="140" class="head">After: one flat ragged token row</text>
  <text x="614" y="166" class="small">Shape [1, 8]; indptr = [0, 3, 8] carries the sequence boundaries</text>
  <rect x="620" y="190" width="58" height="48" rx="7" class="a"/><text x="649" y="219" text-anchor="middle" class="mono">a₀</text>
  <rect x="684" y="190" width="58" height="48" rx="7" class="a"/><text x="713" y="219" text-anchor="middle" class="mono">a₁</text>
  <rect x="748" y="190" width="58" height="48" rx="7" class="a"/><text x="777" y="219" text-anchor="middle" class="mono">a₂</text>
  <line x1="813" y1="180" x2="813" y2="249" class="boundary"/>
  <rect x="820" y="190" width="58" height="48" rx="7" class="b"/><text x="849" y="219" text-anchor="middle" class="mono">b₀</text>
  <rect x="884" y="190" width="58" height="48" rx="7" class="b"/><text x="913" y="219" text-anchor="middle" class="mono">b₁</text>
  <rect x="948" y="190" width="58" height="48" rx="7" class="b"/><text x="977" y="219" text-anchor="middle" class="mono">b₂</text>
  <rect x="1012" y="190" width="58" height="48" rx="7" class="b"/><text x="1041" y="219" text-anchor="middle" class="mono">b₃</text>
  <rect x="1076" y="190" width="58" height="48" rx="7" class="b"/><text x="1105" y="219" text-anchor="middle" class="mono">b₄</text>
  <text x="620" y="266" class="mono">positions = [0,1,2, 0,1,2,3,4]</text>

  <text x="620" y="302" class="label">Causal attention becomes two independent triangles</text>
  <g transform="translate(620 318)">
    <rect x="0" y="0" width="18" height="18" class="mask"/><rect x="0" y="20" width="18" height="18" class="mask"/><rect x="20" y="20" width="18" height="18" class="mask"/><rect x="0" y="40" width="18" height="18" class="mask"/><rect x="20" y="40" width="18" height="18" class="mask"/><rect x="40" y="40" width="18" height="18" class="mask"/>
    <text x="72" y="36" class="small">A sees only A</text>
  </g>
  <g transform="translate(790 318)">
    <rect x="0" y="0" width="12" height="12" class="b"/><rect x="0" y="14" width="12" height="12" class="b"/><rect x="14" y="14" width="12" height="12" class="b"/><rect x="0" y="28" width="12" height="12" class="b"/><rect x="14" y="28" width="12" height="12" class="b"/><rect x="28" y="28" width="12" height="12" class="b"/><rect x="0" y="42" width="12" height="12" class="b"/><rect x="14" y="42" width="12" height="12" class="b"/><rect x="28" y="42" width="12" height="12" class="b"/><rect x="42" y="42" width="12" height="12" class="b"/><rect x="0" y="56" width="12" height="12" class="b"/><rect x="14" y="56" width="12" height="12" class="b"/><rect x="28" y="56" width="12" height="12" class="b"/><rect x="42" y="56" width="12" height="12" class="b"/><rect x="56" y="56" width="12" height="12" class="b"/>
    <text x="84" y="40" class="small">B sees only B</text>
  </g>
  <rect x="1005" y="313" width="129" height="78" rx="10" class="ok"/>
  <text x="1069" y="341" text-anchor="middle" class="label">No cross-talk</text>
  <text x="1069" y="365" text-anchor="middle" class="small">No dense mask</text>
  <text x="1069" y="383" text-anchor="middle" class="small">No pad tokens</text>
  <text x="620" y="426" class="mono">final hidden indices = [2, 7] → logits [A, B]</text>

  <rect x="40" y="490" width="1120" height="240" rx="16" class="panel"/>
  <text x="64" y="527" class="head">What one packed-prefill forward does</text>
  <rect x="65" y="558" width="165" height="68" rx="10" class="new"/>
  <text x="147" y="585" text-anchor="middle" class="label">1. Flatten</text><text x="147" y="607" text-anchor="middle" class="small">IDs, positions, slots</text>
  <path d="M230 592 H275" class="arrow"/>
  <rect x="280" y="558" width="165" height="68" rx="10" class="new"/>
  <text x="362" y="585" text-anchor="middle" class="label">2. Plan once</text><text x="362" y="607" text-anchor="middle" class="small">indptr reused by layers</text>
  <path d="M445 592 H490" class="arrow"/>
  <rect x="495" y="548" width="200" height="88" rx="10" class="new"/>
  <text x="595" y="576" text-anchor="middle" class="label">3. Every layer</text><text x="595" y="599" text-anchor="middle" class="small">RoPE → write physical KV</text><text x="595" y="619" text-anchor="middle" class="small">→ ragged causal attention</text>
  <path d="M695 592 H740" class="arrow"/>
  <rect x="745" y="558" width="165" height="68" rx="10" class="new"/>
  <text x="827" y="585" text-anchor="middle" class="label">4. Select</text><text x="827" y="607" text-anchor="middle" class="small">hidden[2], hidden[7]</text>
  <path d="M910 592 H955" class="arrow"/>
  <rect x="960" y="558" width="165" height="68" rx="10" class="ok"/>
  <text x="1042" y="585" text-anchor="middle" class="label">5. Sample</text><text x="1042" y="607" text-anchor="middle" class="small">first token per request</text>
  <rect x="65" y="662" width="1060" height="43" rx="9" class="note"/>
  <text x="595" y="689" text-anchor="middle" class="small">Scheduler policy and physical page tables do not change; only the temporary attention layout changes.</text>
</svg>
