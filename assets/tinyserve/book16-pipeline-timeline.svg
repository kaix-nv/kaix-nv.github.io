<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 752" role="img" aria-labelledby="title desc">
<title id="title">Pipeline parallelism moves a residual between layer owners</title>
<desc id="desc">Rank zero owns early layers and rank one owns later layers and output projection. Four request-row microbatches fill and drain a two-stage pipeline across five ideal slots. Initial and final idle bubbles remain. Sampling stays on rank zero.</desc>
<defs><style>
text{font-family:system-ui,sans-serif;fill:#0f172a}
.title{font-size:28px;font-weight:700}.heading{font-size:22px;font-weight:700}
.body{font-size:20px}.small{font-size:17px;fill:#475569}.mono{font-size:21px;font-family:ui-monospace,monospace}
.blue{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.purple{fill:#ede9fe;stroke:#7c3aed;stroke-width:2}
.green{fill:#dcfce7;stroke:#16a34a;stroke-width:2}.orange{fill:#ffedd5;stroke:#ea580c;stroke-width:2}
.gray{fill:#e2e8f0;stroke:#94a3b8;stroke-width:2}.white{fill:#fff;stroke:#cbd5e1;stroke-width:2}
.arrow{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}
</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
<rect width="1200" height="752" rx="16" fill="#f8fafc"/>
<text x="32" y="44" class="title" text-anchor="start">Pipeline parallelism moves a residual between layer owners</text>
<rect x="32" y="110" width="522" height="145" rx="10" class="purple"/><text x="54" y="151" class="body" text-anchor="start">Rank 0: embedding + layers 0–13</text>
<text x="54" y="186" class="body" text-anchor="start">Owns KV for these fourteen layers</text>
<text x="54" y="221" class="body" text-anchor="start">Scheduler and sampler remain here</text><rect x="646" y="110" width="522" height="145" rx="10" class="blue"/><text x="668" y="151" class="body" text-anchor="start">Rank 1: layers 14–27 + final norm + LM head</text>
<text x="668" y="186" class="body" text-anchor="start">Owns KV for these fourteen layers</text>
<text x="668" y="221" class="body" text-anchor="start">Returns last-position logits to rank 0</text><path d="M559 155 L636 155" class="arrow"/><text x="600" y="141" class="small" text-anchor="middle">hidden</text><path d="M636 222 L564 222" class="arrow"/><text x="600" y="247" class="small" text-anchor="middle">logits</text><text x="32" y="319" class="heading" text-anchor="start">Four row microbatches through two balanced stages</text><text x="32" y="350" class="small" text-anchor="start">Schematic slots, not measured durations. Request order stays [7, 2, 9, 4].</text><text x="293" y="394" class="small" text-anchor="middle">Slot 1</text><text x="465" y="394" class="small" text-anchor="middle">Slot 2</text><text x="637" y="394" class="small" text-anchor="middle">Slot 3</text><text x="809" y="394" class="small" text-anchor="middle">Slot 4</text><text x="981" y="394" class="small" text-anchor="middle">Slot 5</text><text x="35" y="458" class="heading" text-anchor="start">Stage 0</text><rect x="215" y="416" width="158" height="64" rx="10" class="purple"/><text x="294" y="455" class="body" text-anchor="middle">MB0 · r7</text><rect x="387" y="416" width="158" height="64" rx="10" class="purple"/><text x="466" y="455" class="body" text-anchor="middle">MB1 · r2</text><rect x="559" y="416" width="158" height="64" rx="10" class="purple"/><text x="638" y="455" class="body" text-anchor="middle">MB2 · r9</text><rect x="731" y="416" width="158" height="64" rx="10" class="purple"/><text x="810" y="455" class="body" text-anchor="middle">MB3 · r4</text><rect x="903" y="416" width="158" height="64" rx="10" class="gray"/><text x="982" y="455" class="body" text-anchor="middle">bubble</text><text x="35" y="547" class="heading" text-anchor="start">Stage 1</text><rect x="215" y="505" width="158" height="64" rx="10" class="gray"/><text x="294" y="544" class="body" text-anchor="middle">bubble</text><rect x="387" y="505" width="158" height="64" rx="10" class="blue"/><text x="466" y="544" class="body" text-anchor="middle">MB0 · r7</text><rect x="559" y="505" width="158" height="64" rx="10" class="blue"/><text x="638" y="544" class="body" text-anchor="middle">MB1 · r2</text><rect x="731" y="505" width="158" height="64" rx="10" class="blue"/><text x="810" y="544" class="body" text-anchor="middle">MB2 · r9</text><rect x="903" y="505" width="158" height="64" rx="10" class="blue"/><text x="982" y="544" class="body" text-anchor="middle">MB3 · r4</text><rect x="32" y="618" width="1136" height="99" rx="10" class="white"/><text x="54" y="654" class="body" text-anchor="start">Ideal utilization = M / (M + stages − 1) = 4 / 5 for this balanced illustration.</text>
<text x="54" y="684" class="body" text-anchor="start">More microbatches reduce bubbles but create smaller GEMMs and more messages.</text>
</svg>
