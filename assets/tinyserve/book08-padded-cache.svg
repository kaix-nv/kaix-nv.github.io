<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 665" role="img" aria-labelledby="title desc">
<title id="title">Padding changes storage columns, not token positions</title>
<desc id="desc">Two prompts of lengths three and five occupy seven illustrated cache columns. A has two pad columns hidden by the mask. The shared physical decode column five uses logical position three for A and five for B. Newly sampled tokens enter KV only on the next forward.</desc>
<defs><style>
text{font-family:system-ui,sans-serif;fill:#0f172a}
.title{font-size:28px;font-weight:700}.heading{font-size:22px;font-weight:700}
.body{font-size:20px}.small{font-size:17px;fill:#475569}.mono{font-size:21px;font-family:ui-monospace,monospace}
.blue{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.purple{fill:#ede9fe;stroke:#7c3aed;stroke-width:2}
.green{fill:#dcfce7;stroke:#16a34a;stroke-width:2}.orange{fill:#ffedd5;stroke:#ea580c;stroke-width:2}
.gray{fill:#e2e8f0;stroke:#94a3b8;stroke-width:2}.white{fill:#fff;stroke:#cbd5e1;stroke-width:2}
.arrow{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}
</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
<rect width="1200" height="665" rx="16" fill="#f8fafc"/>
<text x="32" y="44" class="title" text-anchor="start">Padding changes storage columns, not token positions</text>
<text x="32" y="80" class="body" text-anchor="start">Two coordinate systems: physical columns hold the batch; logical positions belong to each request.</text><text x="32" y="138" class="heading" text-anchor="start">Physical column</text><text x="300" y="138" class="mono" text-anchor="middle">0</text><text x="424" y="138" class="mono" text-anchor="middle">1</text><text x="548" y="138" class="mono" text-anchor="middle">2</text><text x="672" y="138" class="mono" text-anchor="middle">3</text><text x="796" y="138" class="mono" text-anchor="middle">4</text><text x="920" y="138" class="mono" text-anchor="middle">5</text><text x="1044" y="138" class="mono" text-anchor="middle">6</text><text x="40" y="220" class="heading" text-anchor="start">Request A</text><text x="40" y="271" class="small" text-anchor="start">Logical position</text><rect x="246" y="180" width="110" height="62" rx="10" class="gray"/><text x="301" y="219" class="mono" text-anchor="middle">pad</text><text x="301" y="274" class="mono" text-anchor="middle">—</text><rect x="370" y="180" width="110" height="62" rx="10" class="gray"/><text x="425" y="219" class="mono" text-anchor="middle">pad</text><text x="425" y="274" class="mono" text-anchor="middle">—</text><rect x="494" y="180" width="110" height="62" rx="10" class="purple"/><text x="549" y="219" class="mono" text-anchor="middle">a</text><text x="549" y="274" class="mono" text-anchor="middle">0</text><rect x="618" y="180" width="110" height="62" rx="10" class="purple"/><text x="673" y="219" class="mono" text-anchor="middle">b</text><text x="673" y="274" class="mono" text-anchor="middle">1</text><rect x="742" y="180" width="110" height="62" rx="10" class="purple"/><text x="797" y="219" class="mono" text-anchor="middle">c</text><text x="797" y="274" class="mono" text-anchor="middle">2</text><rect x="866" y="180" width="110" height="62" rx="10" class="purple"/><text x="921" y="219" class="mono" text-anchor="middle">A1</text><text x="921" y="274" class="mono" text-anchor="middle">3</text><rect x="990" y="180" width="110" height="62" rx="10" class="purple"/><text x="1045" y="219" class="mono" text-anchor="middle">A2</text><text x="1045" y="274" class="mono" text-anchor="middle">4</text><text x="40" y="375" class="heading" text-anchor="start">Request B</text><text x="40" y="426" class="small" text-anchor="start">Logical position</text><rect x="246" y="335" width="110" height="62" rx="10" class="blue"/><text x="301" y="374" class="mono" text-anchor="middle">u</text><text x="301" y="429" class="mono" text-anchor="middle">0</text><rect x="370" y="335" width="110" height="62" rx="10" class="blue"/><text x="425" y="374" class="mono" text-anchor="middle">v</text><text x="425" y="429" class="mono" text-anchor="middle">1</text><rect x="494" y="335" width="110" height="62" rx="10" class="blue"/><text x="549" y="374" class="mono" text-anchor="middle">w</text><text x="549" y="429" class="mono" text-anchor="middle">2</text><rect x="618" y="335" width="110" height="62" rx="10" class="blue"/><text x="673" y="374" class="mono" text-anchor="middle">x</text><text x="673" y="429" class="mono" text-anchor="middle">3</text><rect x="742" y="335" width="110" height="62" rx="10" class="blue"/><text x="797" y="374" class="mono" text-anchor="middle">y</text><text x="797" y="429" class="mono" text-anchor="middle">4</text><rect x="866" y="335" width="110" height="62" rx="10" class="blue"/><text x="921" y="374" class="mono" text-anchor="middle">B1</text><text x="921" y="429" class="mono" text-anchor="middle">5</text><rect x="990" y="335" width="110" height="62" rx="10" class="blue"/><text x="1045" y="374" class="mono" text-anchor="middle">B2</text><text x="1045" y="429" class="mono" text-anchor="middle">6</text><rect x="32" y="504" width="1136" height="125" rx="10" class="white"/><text x="54" y="538" class="body" text-anchor="start">Prefill writes columns 0–4, then samples A1 and B1. These new outputs are still uncached.</text>
<text x="54" y="568" class="body" text-anchor="start">Decode consumes A1/B1 at physical column 5 with logical positions 3/5.</text>
<text x="54" y="598" class="body" text-anchor="start">A2/B2 wait outside KV until the next forward consumes them.</text>
</svg>
