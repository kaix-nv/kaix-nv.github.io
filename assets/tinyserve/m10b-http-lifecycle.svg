<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="title desc">
<title id="title">M10b: concurrent clients, one engine owner</title>
<desc id="desc">Alice and Bob submit through a bounded inbox. A single worker runs the session and routes output to independent bounded outboxes. Alice's disconnect marks cancellation for the next step boundary without stopping Bob.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6" fill="#486581"/></marker></defs>
<rect width="1120" height="580" fill="#fff"/>
<g font-family="sans-serif" fill="#203047">
<text x="32" y="40" font-size="25" font-weight="bold">Concurrent clients, one engine owner</text>
<text x="32" y="71" font-size="17">HTTP tasks exchange commands and events; only the worker calls the session.</text>
<g fill="#edf5ff" stroke="#91b5dc" stroke-width="2">
<rect x="32" y="115" width="180" height="76" rx="10"/>
<rect x="32" y="243" width="180" height="76" rx="10"/>
<rect x="280" y="166" width="190" height="105" rx="10"/>
<rect x="535" y="115" width="270" height="205" rx="10"/>
<rect x="867" y="115" width="221" height="76" rx="10"/>
<rect x="867" y="243" width="221" height="76" rx="10"/>
</g>
<g font-size="18">
<text x="53" y="145">Alice's HTTP task</text><text x="53" y="173">submit / read SSE</text>
<text x="53" y="274">Bob's HTTP task</text><text x="53" y="302">submit / read SSE</text>
<text x="302" y="199">Bounded inbox</text><text x="302" y="228">prompt + budget</text><text x="302" y="254" font-size="15">32 outstanding requests</text>
<text x="558" y="146" font-weight="bold">Single engine worker</text>
<text x="558" y="181">1. Observe commands</text><text x="558" y="213">2. session.step()</text>
<text x="558" y="245">3. Route decoded text</text><text x="558" y="287" font-size="16">Scheduler + KV + model owner</text>
<text x="886" y="145">Alice's outbox</text><text x="886" y="173">UTF-8 text → SSE</text>
<text x="886" y="274">Bob's outbox</text><text x="886" y="302">UTF-8 text → SSE</text>
</g>
<g fill="none" stroke="#486581" stroke-width="2.5" marker-end="url(#arrow)">
<path d="M212 153 H244 V197 H280"/><path d="M212 281 H244 V242 H280"/>
<path d="M470 218 H535"/><path d="M805 153 H867"/><path d="M805 282 H867"/>
</g>
<rect x="32" y="365" width="1056" height="175" rx="10" fill="#fff7e8" stroke="#dfb975" stroke-width="2"/>
<text x="54" y="400" font-size="21" font-weight="bold">Alice disconnects while a step is running</text>
<text x="54" y="434" font-size="18">HTTP marks cancel → worker observes it between steps → next step releases Alice's KV references.</text>
<text x="54" y="470" font-size="18">Bob continues. A full outbox fails only its own stream; the worker never waits for a reader.</text>
<text x="54" y="511" font-size="17">64 events per outbox + terminal slot. Token delivery still waits for the entire engine step to return.</text>
</g></svg>
