<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
<title id="title">Live requests enter and retire at step boundaries</title>
<desc id="desc">A begins in step one, B joins step two, and C joins after A is cancelled before step three. B finishes in step three, C in step four. Event lists return only after the entire synchronous iteration completes.</desc>
<defs><style>
text{font-family:system-ui,sans-serif;fill:#0f172a}
.title{font-size:28px;font-weight:700}.heading{font-size:22px;font-weight:700}
.body{font-size:20px}.small{font-size:17px;fill:#475569}.mono{font-size:21px;font-family:ui-monospace,monospace}
.blue{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.purple{fill:#ede9fe;stroke:#7c3aed;stroke-width:2}
.green{fill:#dcfce7;stroke:#16a34a;stroke-width:2}.orange{fill:#ffedd5;stroke:#ea580c;stroke-width:2}
.gray{fill:#e2e8f0;stroke:#94a3b8;stroke-width:2}.white{fill:#fff;stroke:#cbd5e1;stroke-width:2}
.arrow{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}
</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
<rect width="1200" height="740" rx="16" fill="#f8fafc"/>
<text x="32" y="44" class="title" text-anchor="start">Live requests enter and retire at step boundaries</text>
<text x="32" y="82" class="body" text-anchor="start">Prompt budget: four tokens per step. Cancellation is applied before selecting the next work.</text><text x="300" y="136" class="heading" text-anchor="middle">Step 1</text><text x="548" y="136" class="heading" text-anchor="middle">Step 2</text><text x="796" y="136" class="heading" text-anchor="middle">Step 3</text><text x="1044" y="136" class="heading" text-anchor="middle">Step 4</text><text x="48" y="216" class="heading" text-anchor="start">Request A</text><rect x="190" y="174" width="228" height="76" rx="10" class="purple"/><text x="304" y="218" class="small" text-anchor="middle">Prefill 0–3</text><rect x="438" y="174" width="228" height="76" rx="10" class="purple"/><text x="552" y="218" class="small" text-anchor="middle">Prefill 4 → A1</text><rect x="686" y="174" width="228" height="76" rx="10" class="purple"/><text x="800" y="218" class="small" text-anchor="middle">Cancel + release</text><rect x="934" y="174" width="228" height="76" rx="10" class="gray"/><text x="1048" y="218" class="small" text-anchor="middle">Terminal</text><text x="48" y="342" class="heading" text-anchor="start">Request B</text><rect x="190" y="300" width="228" height="76" rx="10" class="gray"/><text x="304" y="344" class="small" text-anchor="middle">Not submitted</text><rect x="438" y="300" width="228" height="76" rx="10" class="blue"/><text x="552" y="344" class="small" text-anchor="middle">Prefill 0–2 → B1</text><rect x="686" y="300" width="228" height="76" rx="10" class="blue"/><text x="800" y="344" class="small" text-anchor="middle">Decode → B2</text><rect x="934" y="300" width="228" height="76" rx="10" class="gray"/><text x="1048" y="344" class="small" text-anchor="middle">Terminal</text><text x="48" y="468" class="heading" text-anchor="start">Request C</text><rect x="190" y="426" width="228" height="76" rx="10" class="gray"/><text x="304" y="470" class="small" text-anchor="middle">Not submitted</text><rect x="438" y="426" width="228" height="76" rx="10" class="gray"/><text x="552" y="470" class="small" text-anchor="middle">Not submitted</text><rect x="686" y="426" width="228" height="76" rx="10" class="green"/><text x="800" y="470" class="small" text-anchor="middle">Prefill 0–1 → C1</text><rect x="934" y="426" width="228" height="76" rx="10" class="green"/><text x="1048" y="470" class="small" text-anchor="middle">Decode → C2</text><rect x="32" y="552" width="1136" height="152" rx="10" class="white"/><text x="54" y="590" class="body" text-anchor="start">Step 2 returns A1 and B1 only after both prefill forwards finish.</text>
<text x="54" y="620" class="body" text-anchor="start">Step 3 returns: A cancelled; B2; B length; C1.</text>
<text x="54" y="650" class="body" text-anchor="start">Step 4 returns: C2; C length.</text>
<text x="54" y="680" class="body" text-anchor="start">Tokens already returned are not retracted by a later cancellation.</text>
</svg>
