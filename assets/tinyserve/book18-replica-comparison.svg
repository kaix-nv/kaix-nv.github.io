<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Phase separation was slower than two replicas</title>
<desc id="desc">Equal-resource measurement compares two ordinary replicas with a prefill/decode pair on two RTX A6000s. Replica versus disaggregated tokens per second are 425.32 versus 357.63 for short, 168.99 versus 62.07 for long, and 232.71 versus 185.44 for mixed cohorts.</desc>
<defs><style>
text{font-family:system-ui,sans-serif;fill:#0f172a}
.title{font-size:28px;font-weight:700}.heading{font-size:22px;font-weight:700}
.body{font-size:20px}.small{font-size:17px;fill:#475569}.mono{font-size:21px;font-family:ui-monospace,monospace}
.blue{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.purple{fill:#ede9fe;stroke:#7c3aed;stroke-width:2}
.green{fill:#dcfce7;stroke:#16a34a;stroke-width:2}.orange{fill:#ffedd5;stroke:#ea580c;stroke-width:2}
.gray{fill:#e2e8f0;stroke:#94a3b8;stroke-width:2}.white{fill:#fff;stroke:#cbd5e1;stroke-width:2}
.arrow{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}
</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
<rect width="1200" height="800" rx="16" fill="#f8fafc"/>
<text x="32" y="44" class="title" text-anchor="start">Phase separation was slower than two replicas</text>
<rect x="32" y="111" width="536" height="151" rx="10" class="purple"/><text x="54" y="151" class="body" text-anchor="start">Two ordinary replicas</text>
<text x="54" y="183" class="body" text-anchor="start">GPU 0: prefill + decode for its requests</text>
<text x="54" y="215" class="body" text-anchor="start">GPU 1: prefill + decode for its requests</text>
<text x="54" y="247" class="body" text-anchor="start">Round-robin request assignment</text><rect x="632" y="111" width="536" height="151" rx="10" class="blue"/><text x="654" y="151" class="body" text-anchor="start">One prefill and one decode replica</text>
<text x="654" y="183" class="body" text-anchor="start">GPU P: prompt work, one request at a time</text>
<text x="654" y="215" class="body" text-anchor="start">GPU D: import + batched decode</text>
<text x="654" y="247" class="body" text-anchor="start">Every continuing request transfers its KV</text><text x="32" y="317" class="heading" text-anchor="start">Retained Qwen3-4B BF16 throughput on two RTX A6000s</text><text x="32" y="349" class="small" text-anchor="start">Eight-request cohorts; medians of ten measured cohorts. Higher is better.</text><text x="32" y="429" class="body" text-anchor="start">Short 128 / 128</text><rect x="270" y="394" width="701.7779999999999" height="31" rx="4" fill="#7c3aed"/><rect x="270" y="431" width="590.0894999999999" height="31" rx="4" fill="#2563eb"/><text x="984.7779999999999" y="417" class="small" text-anchor="start">425.32</text><text x="873.0894999999999" y="454" class="small" text-anchor="start">357.63</text><text x="32" y="521" class="body" text-anchor="start">Long 2048 / 32</text><rect x="270" y="486" width="278.8335" height="31" rx="4" fill="#7c3aed"/><rect x="270" y="523" width="102.4155" height="31" rx="4" fill="#2563eb"/><text x="561.8335" y="509" class="small" text-anchor="start">168.99</text><text x="385.4155" y="546" class="small" text-anchor="start">62.07</text><text x="32" y="613" class="body" text-anchor="start">Mixed arrivals</text><rect x="270" y="578" width="383.9715" height="31" rx="4" fill="#7c3aed"/><rect x="270" y="615" width="305.976" height="31" rx="4" fill="#2563eb"/><text x="666.9715" y="601" class="small" text-anchor="start">232.71</text><text x="588.976" y="638" class="small" text-anchor="start">185.44</text><rect x="270" y="690" width="20" height="20" fill="#7c3aed"/><rect x="600" y="690" width="20" height="20" fill="#2563eb"/><text x="303" y="707" class="body" text-anchor="start">Two replicas · tokens/s</text><text x="633" y="707" class="body" text-anchor="start">Prefill/decode · tokens/s</text><text x="32" y="763" class="small" text-anchor="start">Host-staged imports pause D. The comparison includes scheduling and batch-shape differences.</text>
</svg>
