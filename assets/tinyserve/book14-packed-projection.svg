<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc">
<title id="title">Packed NVFP4 weights consumed by a BF16 projection</title>
<desc id="desc">For a matrix with K equal to 64, W at row two channel nineteen selects byte 73 and its high nibble. Byte D2 contributes nibble D, or negative three. Scale byte nine is 38 hexadecimal, representing one, and global scale is one quarter. The reconstructed weight is negative three quarters. Only a weight tile is reconstructed inside the matrix kernel; persistent buffers remain packed.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 Z" fill="#52657a"/></marker></defs>
<rect width="1200" height="710" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#172b43">
<text x="40" y="48" font-size="28" font-weight="700">Packed storage survives all the way to the projection</text>
<text x="40" y="81" font-size="18">A6000 W4A16 path · K = 64 · four groups of sixteen channels per output row</text>
<rect x="40" y="117" width="350" height="140" rx="12" fill="#e8f0fd" stroke="#6088b7"/>
<text x="60" y="151" font-size="20" font-weight="700">E2M1 data bytes</text>
<text x="60" y="187" font-size="20">Shape [N, 32] · uint8</text>
<text x="60" y="225" font-size="20">W[2,19] → byte 73 = 0xD2</text>
<rect x="425" y="117" width="350" height="140" rx="12" fill="#fff3d9" stroke="#b39241"/>
<text x="445" y="151" font-size="20" font-weight="700">E4M3 block scales</text>
<text x="445" y="187" font-size="20">Shape [N, 4] · uint8</text>
<text x="445" y="225" font-size="20">Scale byte 9 = 0x38 → 1</text>
<rect x="810" y="117" width="350" height="140" rx="12" fill="#fff3d9" stroke="#b39241"/>
<text x="830" y="151" font-size="20" font-weight="700">FP32 global scale</text>
<text x="830" y="187" font-size="20">One scalar for the matrix</text>
<text x="830" y="225" font-size="20">Example: g = 0.25</text>
<path d="M215 261 V298 M600 261 V298 M985 261 V298" stroke="#52657a" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="40" y="316" width="1120" height="130" rx="12" fill="#edf0f7" stroke="#7d82a1"/>
<text x="62" y="352" font-size="22" font-weight="700">Inside the kernel, reconstruct the current weight tile</text>
<text x="62" y="390" font-size="22">Channel 19 is odd → high nibble 0xD → E2M1 value −3</text>
<text x="62" y="424" font-size="22">BF16((−3 × 1) × 0.25) = −0.75</text>
<path d="M850 450 V499" stroke="#52657a" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="40" y="518" width="320" height="100" rx="12" fill="#e2f2e8" stroke="#50826b"/>
<text x="62" y="555" font-size="21" font-weight="700">BF16 activation tile X</text><text x="62" y="589" font-size="20">Token rows × K channels</text>
<path d="M365 568 H420" stroke="#52657a" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="440" y="518" width="720" height="100" rx="12" fill="#e2f2e8" stroke="#50826b"/>
<text x="462" y="554" font-size="22" font-weight="700">BF16 dot → FP32 accumulation → BF16 output</text>
<text x="462" y="591" font-size="20">No complete floating [N,K] weight is stored on the GPU.</text>
<text x="40" y="666" font-size="20">Smaller resident weights establish storage savings. This path does not use native FP4 arithmetic.</text>
</g></svg>
