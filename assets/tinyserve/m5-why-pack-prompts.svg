<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" role="img"
     aria-label="Comparison of three separate short-prompt prefill forwards with one packed left-padded batched forward. Packing pays per-forward overhead once while preserving independent attention and KV cache state for every request.">

  <defs>
    <style>
      .title { font: 700 30px system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px system-ui, sans-serif; fill: #475569; }
      .panel-title { font: 700 21px system-ui, sans-serif; fill: #0f172a; }
      .panel-subtitle { font: 400 14px system-ui, sans-serif; fill: #475569; }
      .lane { font: 700 15px system-ui, sans-serif; fill: #334155; }
      .block { font: 700 15px system-ui, sans-serif; fill: #0f172a; }
      .small { font: 500 13px system-ui, sans-serif; fill: #475569; }
      .small-red { font: 600 13px system-ui, sans-serif; fill: #b91c1c; }
      .small-green { font: 600 13px system-ui, sans-serif; fill: #047857; }
      .cell { font: 600 13px ui-monospace, monospace; fill: #0f172a; }
      .timeline { stroke: #64748b; stroke-width: 2.5; }
    </style>
    <marker id="time-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1280" height="760" rx="20" fill="#f8fafc"/>
  <text x="48" y="48" class="title">Why pack a burst of short prompts?</text>
  <text x="48" y="78" class="subtitle">
    Packing changes the number of model invocations, not request isolation. Schematic; widths are not measured time.
  </text>

  <g transform="translate(680 94)">
    <rect x="0" y="0" width="24" height="17" rx="4" fill="#e2e8f0" stroke="#64748b"/>
    <text x="32" y="14" class="small">H: per-forward overhead</text>
    <rect x="210" y="0" width="24" height="17" rx="4" fill="#ffedd5" stroke="#ea580c"/>
    <text x="242" y="14" class="small">prompt compute</text>
    <rect x="368" y="0" width="24" height="17" rx="4" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="400" y="14" class="small">decode</text>
  </g>

  <!-- Separate forwards -->
  <g>
    <rect x="38" y="126" width="1204" height="232" rx="18" fill="#ffffff"
          stroke="#fecaca" stroke-width="2"/>
    <text x="62" y="162" class="panel-title">Without packing: one forward per prompt</text>
    <text x="62" y="187" class="panel-subtitle">
      C, D, and E fit the same scheduling budget, but the engine invokes the model three times.
    </text>

    <line x1="190" y1="207" x2="1198" y2="207" class="timeline"
          marker-end="url(#time-arrow)"/>
    <text x="1160" y="198" class="small">time</text>
    <text x="66" y="256" class="lane">GPU work</text>

    <rect x="190" y="226" width="54" height="58" rx="8" fill="#e2e8f0"
          stroke="#64748b" stroke-width="2"/>
    <text x="217" y="261" text-anchor="middle" class="block">H</text>
    <rect x="244" y="226" width="194" height="58" rx="8" fill="#ffedd5"
          stroke="#ea580c" stroke-width="2"/>
    <text x="341" y="252" text-anchor="middle" class="block">prefill C</text>
    <text x="341" y="273" text-anchor="middle" class="small">one first-token logit</text>

    <rect x="466" y="226" width="54" height="58" rx="8" fill="#e2e8f0"
          stroke="#64748b" stroke-width="2"/>
    <text x="493" y="261" text-anchor="middle" class="block">H</text>
    <rect x="520" y="226" width="194" height="58" rx="8" fill="#ffedd5"
          stroke="#ea580c" stroke-width="2"/>
    <text x="617" y="252" text-anchor="middle" class="block">prefill D</text>
    <text x="617" y="273" text-anchor="middle" class="small">one first-token logit</text>

    <rect x="742" y="226" width="54" height="58" rx="8" fill="#e2e8f0"
          stroke="#64748b" stroke-width="2"/>
    <text x="769" y="261" text-anchor="middle" class="block">H</text>
    <rect x="796" y="226" width="194" height="58" rx="8" fill="#ffedd5"
          stroke="#ea580c" stroke-width="2"/>
    <text x="893" y="252" text-anchor="middle" class="block">prefill E</text>
    <text x="893" y="273" text-anchor="middle" class="small">one first-token logit</text>

    <rect x="1020" y="226" width="172" height="58" rx="8" fill="#ede9fe"
          stroke="#7c3aed" stroke-width="2"/>
    <text x="1106" y="252" text-anchor="middle" class="block">next decode</text>
    <text x="1106" y="273" text-anchor="middle" class="small">A + B advance</text>

    <text x="66" y="324" class="lane">Streams A + B</text>
    <line x1="190" y1="316" x2="1020" y2="316" stroke="#ef4444" stroke-width="3"
          stroke-dasharray="8 7"/>
    <text x="605" y="339" text-anchor="middle" class="small-red">
      next decode waits across three model invocations; H is paid three times
    </text>
  </g>

  <!-- Packed forward -->
  <g>
    <rect x="38" y="382" width="1204" height="280" rx="18" fill="#ffffff"
          stroke="#a7f3d0" stroke-width="2"/>
    <text x="62" y="418" class="panel-title">With packing: one batched forward</text>
    <text x="62" y="443" class="panel-subtitle">
      C, D, and E become independent rows of one temporary left-padded batch.
    </text>

    <line x1="190" y1="463" x2="1198" y2="463" class="timeline"
          marker-end="url(#time-arrow)"/>
    <text x="1160" y="454" class="small">time</text>
    <text x="66" y="528" class="lane">GPU work</text>

    <rect x="190" y="482" width="72" height="122" rx="9" fill="#e2e8f0"
          stroke="#64748b" stroke-width="2"/>
    <text x="226" y="529" text-anchor="middle" class="block">H</text>
    <text x="226" y="551" text-anchor="middle" class="small">paid</text>
    <text x="226" y="570" text-anchor="middle" class="small">once</text>

    <rect x="262" y="482" width="620" height="122" rx="9" fill="#fff7ed"
          stroke="#ea580c" stroke-width="2"/>
    <text x="286" y="508" class="block">one batched prefill</text>

    <text x="304" y="536" class="cell">C</text>
    <rect x="340" y="520" width="62" height="24" rx="5" fill="#fed7aa"/>
    <rect x="408" y="520" width="62" height="24" rx="5" fill="#fed7aa"/>
    <rect x="476" y="520" width="62" height="24" rx="5" fill="#fed7aa"/>
    <rect x="544" y="520" width="62" height="24" rx="5" fill="#fed7aa"/>
    <text x="371" y="537" text-anchor="middle" class="cell">c0</text>
    <text x="439" y="537" text-anchor="middle" class="cell">c1</text>
    <text x="507" y="537" text-anchor="middle" class="cell">c2</text>
    <text x="575" y="537" text-anchor="middle" class="cell">c3</text>

    <text x="304" y="564" class="cell">D</text>
    <rect x="340" y="548" width="62" height="24" rx="5" fill="#e2e8f0"/>
    <rect x="408" y="548" width="62" height="24" rx="5" fill="#fed7aa"/>
    <rect x="476" y="548" width="62" height="24" rx="5" fill="#fed7aa"/>
    <rect x="544" y="548" width="62" height="24" rx="5" fill="#fed7aa"/>
    <text x="371" y="565" text-anchor="middle" class="small">pad</text>
    <text x="439" y="565" text-anchor="middle" class="cell">d0</text>
    <text x="507" y="565" text-anchor="middle" class="cell">d1</text>
    <text x="575" y="565" text-anchor="middle" class="cell">d2</text>

    <text x="304" y="592" class="cell">E</text>
    <rect x="340" y="576" width="62" height="24" rx="5" fill="#e2e8f0"/>
    <rect x="408" y="576" width="62" height="24" rx="5" fill="#e2e8f0"/>
    <rect x="476" y="576" width="62" height="24" rx="5" fill="#fed7aa"/>
    <rect x="544" y="576" width="62" height="24" rx="5" fill="#fed7aa"/>
    <text x="371" y="593" text-anchor="middle" class="small">pad</text>
    <text x="439" y="593" text-anchor="middle" class="small">pad</text>
    <text x="507" y="593" text-anchor="middle" class="cell">e0</text>
    <text x="575" y="593" text-anchor="middle" class="cell">e1</text>

    <text x="642" y="538" class="small-green">separate mask</text>
    <text x="642" y="560" class="small-green">separate positions</text>
    <text x="642" y="582" class="small-green">separate KV blocks</text>

    <line x1="882" y1="540" x2="914" y2="540" stroke="#10b981" stroke-width="3"/>
    <circle cx="926" cy="516" r="8" fill="#10b981" stroke="#047857" stroke-width="2"/>
    <circle cx="926" cy="540" r="8" fill="#10b981" stroke="#047857" stroke-width="2"/>
    <circle cx="926" cy="564" r="8" fill="#10b981" stroke="#047857" stroke-width="2"/>
    <text x="950" y="535" class="small-green">three independent</text>
    <text x="950" y="555" class="small-green">first-token logits</text>

    <rect x="1070" y="482" width="122" height="122" rx="9" fill="#ede9fe"
          stroke="#7c3aed" stroke-width="2"/>
    <text x="1131" y="529" text-anchor="middle" class="block">next decode</text>
    <text x="1131" y="551" text-anchor="middle" class="small">A + B + C</text>
    <text x="1131" y="570" text-anchor="middle" class="small">+ D + E</text>

    <text x="66" y="632" class="lane">Streams A + B</text>
    <line x1="190" y1="624" x2="1070" y2="624" stroke="#10b981" stroke-width="3"/>
    <text x="620" y="647" text-anchor="middle" class="small-green">
      next decode waits across one model invocation; H is paid once
    </text>
  </g>

  <rect x="92" y="686" width="1096" height="50" rx="13" fill="#eff6ff"
        stroke="#60a5fa" stroke-width="2"/>
  <text x="640" y="717" text-anchor="middle" class="block">
    Packing handles many short prompts; chunking bounds one oversized prompt. They solve different delays.
  </text>
</svg>
