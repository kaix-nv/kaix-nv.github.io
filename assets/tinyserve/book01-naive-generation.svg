<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 920" role="img" aria-labelledby="title desc">
  <title id="title">Three output tokens from three full-history forwards without a KV cache</title>
  <desc id="desc">A prompt contains IDs seven, twelve, and five at logical positions zero, one, and two. Iteration one processes those three positions and selects symbolic output y1 from the last row of logits. Iteration two processes the same prompt plus y1 at position three and selects y2. Iteration three processes the prompt plus y1 and y2 at positions three and four and selects y3. All prior positions are recomputed on every call. The three forwards process three plus four plus five equals twelve token positions. The last output y3 is not fed back because generation stops. Output names are symbolic and do not represent trained language output.</desc>
  <defs>
    <style>
      text { font-family: system-ui, sans-serif; fill: #0f172a; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #475569; }
      .heading { font-size: 20px; font-weight: 700; }
      .body { font-size: 17px; }
      .small { font-size: 15px; fill: #475569; }
      .mono { font-family: ui-monospace, monospace; font-size: 22px; }
      .prompt { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .generated { fill: #ede9fe; stroke: #7c3aed; stroke-width: 2; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
  </defs>
  <rect width="1280" height="920" rx="18" fill="#f8fafc"/>
  <text x="40" y="48" class="title">Without a KV cache, every new token repeats the older work</text>
  <text x="40" y="82" class="subtitle">Prompt IDs [7, 12, 5]; request three output tokens; ignore EOS for this example.</text>
  <rect x="40" y="109" width="1200" height="54" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text x="59" y="142" class="body">Blue = prompt IDs. Purple = earlier generated IDs. y1, y2, y3 are symbolic output names, not actual token values.</text>

  <text x="55" y="205" class="heading">Iteration</text>
  <text x="220" y="205" class="heading">Full input history</text>
  <text x="777" y="205" class="heading">Model forward</text>
  <text x="1060" y="205" class="heading">Choose next ID</text>

  <rect x="40" y="224" width="1200" height="143" rx="12" fill="#fff" stroke="#cbd5e1"/>
  <text x="103" y="284" text-anchor="middle" class="heading">1</text>
  <text x="103" y="317" text-anchor="middle" class="small">T = 3</text>
  <rect x="220" y="244" width="80" height="57" rx="8" class="prompt"/>
  <rect x="310" y="244" width="80" height="57" rx="8" class="prompt"/>
  <rect x="400" y="244" width="80" height="57" rx="8" class="prompt"/>
  <text x="260" y="281" text-anchor="middle" class="mono">7</text>
  <text x="350" y="281" text-anchor="middle" class="mono">12</text>
  <text x="440" y="281" text-anchor="middle" class="mono">5</text>
  <text x="167" y="331" text-anchor="middle" class="small">position</text>
  <text x="260" y="331" text-anchor="middle" class="small">0</text>
  <text x="350" y="331" text-anchor="middle" class="small">1</text>
  <text x="440" y="331" text-anchor="middle" class="small">2</text>
  <path d="M487 274H742" class="edge"/>
  <rect x="750" y="244" width="246" height="99" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="873" y="275" text-anchor="middle" class="body">Compute all 3 positions</text>
  <text x="873" y="306" text-anchor="middle" class="body">use logits at position 2</text>
  <text x="873" y="332" text-anchor="middle" class="small">last row chooses the output</text>
  <path d="M1003 294H1047" class="edge"/>
  <rect x="1055" y="250" width="145" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1127" y="286" text-anchor="middle" class="mono">y1</text>
  <text x="1127" y="315" text-anchor="middle" class="small">append at 3</text>

  <rect x="40" y="387" width="1200" height="143" rx="12" fill="#fff" stroke="#cbd5e1"/>
  <text x="103" y="447" text-anchor="middle" class="heading">2</text>
  <text x="103" y="480" text-anchor="middle" class="small">T = 4</text>
  <rect x="220" y="407" width="80" height="57" rx="8" class="prompt"/>
  <rect x="310" y="407" width="80" height="57" rx="8" class="prompt"/>
  <rect x="400" y="407" width="80" height="57" rx="8" class="prompt"/>
  <rect x="490" y="407" width="80" height="57" rx="8" class="generated"/>
  <text x="260" y="444" text-anchor="middle" class="mono">7</text>
  <text x="350" y="444" text-anchor="middle" class="mono">12</text>
  <text x="440" y="444" text-anchor="middle" class="mono">5</text>
  <text x="530" y="444" text-anchor="middle" class="mono">y1</text>
  <text x="167" y="494" text-anchor="middle" class="small">position</text>
  <text x="260" y="494" text-anchor="middle" class="small">0</text>
  <text x="350" y="494" text-anchor="middle" class="small">1</text>
  <text x="440" y="494" text-anchor="middle" class="small">2</text>
  <text x="530" y="494" text-anchor="middle" class="small">3</text>
  <path d="M577 437H742" class="edge"/>
  <rect x="750" y="407" width="246" height="99" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="873" y="438" text-anchor="middle" class="body">Recompute all 4 positions</text>
  <text x="873" y="469" text-anchor="middle" class="body">use logits at position 3</text>
  <text x="873" y="495" text-anchor="middle" class="small">no saved KV from iteration 1</text>
  <path d="M1003 457H1047" class="edge"/>
  <rect x="1055" y="413" width="145" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1127" y="449" text-anchor="middle" class="mono">y2</text>
  <text x="1127" y="478" text-anchor="middle" class="small">append at 4</text>

  <rect x="40" y="550" width="1200" height="143" rx="12" fill="#fff" stroke="#cbd5e1"/>
  <text x="103" y="610" text-anchor="middle" class="heading">3</text>
  <text x="103" y="643" text-anchor="middle" class="small">T = 5</text>
  <rect x="220" y="570" width="80" height="57" rx="8" class="prompt"/>
  <rect x="310" y="570" width="80" height="57" rx="8" class="prompt"/>
  <rect x="400" y="570" width="80" height="57" rx="8" class="prompt"/>
  <rect x="490" y="570" width="80" height="57" rx="8" class="generated"/>
  <rect x="580" y="570" width="80" height="57" rx="8" class="generated"/>
  <text x="260" y="607" text-anchor="middle" class="mono">7</text>
  <text x="350" y="607" text-anchor="middle" class="mono">12</text>
  <text x="440" y="607" text-anchor="middle" class="mono">5</text>
  <text x="530" y="607" text-anchor="middle" class="mono">y1</text>
  <text x="620" y="607" text-anchor="middle" class="mono">y2</text>
  <text x="167" y="657" text-anchor="middle" class="small">position</text>
  <text x="260" y="657" text-anchor="middle" class="small">0</text>
  <text x="350" y="657" text-anchor="middle" class="small">1</text>
  <text x="440" y="657" text-anchor="middle" class="small">2</text>
  <text x="530" y="657" text-anchor="middle" class="small">3</text>
  <text x="620" y="657" text-anchor="middle" class="small">4</text>
  <path d="M667 600H742" class="edge"/>
  <rect x="750" y="570" width="246" height="99" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="873" y="601" text-anchor="middle" class="body">Recompute all 5 positions</text>
  <text x="873" y="632" text-anchor="middle" class="body">use logits at position 4</text>
  <text x="873" y="658" text-anchor="middle" class="small">no saved KV from iteration 2</text>
  <path d="M1003 620H1047" class="edge"/>
  <rect x="1055" y="576" width="145" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1127" y="612" text-anchor="middle" class="mono">y3</text>
  <text x="1127" y="641" text-anchor="middle" class="small">limit met: stop</text>

  <rect x="40" y="724" width="1200" height="158" rx="12" fill="#fff" stroke="#cbd5e1"/>
  <text x="62" y="760" class="heading">3 forwards → 3 output tokens · 3 + 4 + 5 = 12 input-token positions processed</text>
  <text x="62" y="795" class="body">Every call uses positions 0 … T−1 for its full history; existing tokens keep the same logical position.</text>
  <text x="62" y="829" class="body">The final output y3 is appended to the history but never fed into another forward in this request.</text>
  <text x="62" y="861" class="small">This counts processed token positions, not FLOPs or measured time. The repeated work motivates KV caching.</text>
</svg>
