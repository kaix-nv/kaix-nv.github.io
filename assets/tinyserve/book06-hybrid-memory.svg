<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Request-owned memory in a hybrid model</title><desc id="desc">A request owns fixed recurrent state and convolution tails plus a growing full-attention or MLA history. Transient batch rows gather and return those states. Qwen3.5 valid payload contains 18.63 MiB fixed state plus 12 KiB per cached token.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0L8,3L0,6" fill="#48617a"/></marker></defs>
<rect width="1200" height="700" rx="18" fill="#f5f8fc"/><g font-family="Arial,sans-serif" fill="#172b43"><text x="35" y="48" font-size="28" font-weight="700">A hybrid request owns all of its state families</text>
<rect x="35" y="91" width="700" height="368" rx="14" fill="white" stroke="#acc1d3"/><text x="57" y="129" font-size="23" font-weight="700">Request A cache</text>
<rect x="57" y="151" width="655" height="80" rx="10" fill="#dfeaf8"/><text x="78" y="184" font-size="22">Recurrent matrices [layers, heads, K, V]</text><text x="78" y="214" font-size="19">Fixed shape per request; updated for every real token</text>
<rect x="57" y="248" width="655" height="80" rx="10" fill="#e5edf5"/><text x="78" y="281" font-size="22">Causal convolution tails</text><text x="78" y="311" font-size="19">Previous three raw projected inputs for width-four filters</text>
<rect x="57" y="345" width="655" height="88" rx="10" fill="#e1f0e6"/><text x="78" y="380" font-size="22">Full-attention KV or compressed MLA history</text><text x="78" y="413" font-size="19">Valid payload grows with context; positions remain request-local</text>
<rect x="841" y="168" width="325" height="207" rx="12" fill="#fff1d8" stroke="#d4ba88"/><text x="860" y="209" font-size="22" font-weight="700">Temporary batch row</text><text x="860" y="250" font-size="20">Gather request state</text><text x="860" y="291" font-size="20">Run real-token updates</text><text x="860" y="332" font-size="20">Scatter to same owner</text>
<path d="M739 225h82M840 350h-82" stroke="#48617a" stroke-width="3" marker-end="url(#a)"/>
<text x="841" y="416" font-size="18">Batch row can change next step.</text><text x="841" y="445" font-size="18">Request identity does not.</text>
<rect x="35" y="494" width="1130" height="118" rx="12" fill="white" stroke="#acc1d3"/><text x="57" y="531" font-size="23" font-weight="700">Qwen3.5-0.8B example</text><text x="57" y="571" font-size="22">18.63 MiB fixed + 12 KiB × valid token count</text><text x="694" y="571" font-size="22">2,048 tokens → 42.63 MiB</text>
<text x="35" y="654" font-size="20">Payload accounting excludes preallocated unused history and transient batch buffers.</text><text x="35" y="684" font-size="20">Padding must preserve state. Kernel chunks and scheduler token budgets are different boundaries.</text>
</g></svg>
