<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 920" role="img"
     aria-label="Comparison of unchunked and chunked prefill. A long whole-prompt prefill creates a large gap between tokens for active requests, while bounded prompt chunks allow decode batches to run between chunks.">

  <defs>
    <style>
      .title { font: 700 30px system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px system-ui, sans-serif; fill: #475569; }
      .panel-title { font: 700 22px system-ui, sans-serif; fill: #0f172a; }
      .panel-subtitle { font: 400 15px system-ui, sans-serif; fill: #475569; }
      .lane { font: 700 15px system-ui, sans-serif; fill: #334155; }
      .block { font: 700 15px system-ui, sans-serif; fill: #0f172a; }
      .small { font: 500 13px system-ui, sans-serif; fill: #475569; }
      .small-red { font: 600 13px system-ui, sans-serif; fill: #b91c1c; }
      .small-green { font: 600 13px system-ui, sans-serif; fill: #047857; }
      .mono { font: 600 14px ui-monospace, monospace; fill: #0f172a; }
      .timeline { stroke: #64748b; stroke-width: 2.5; }
      .waiting { stroke: #ef4444; stroke-width: 3; stroke-dasharray: 8 7; }
      .progress { stroke: #fb923c; stroke-width: 3; }
    </style>
    <marker id="time-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <pattern id="long-prompt" width="12" height="12" patternUnits="userSpaceOnUse"
             patternTransform="rotate(45)">
      <rect width="12" height="12" fill="#ffedd5"/>
      <rect width="4" height="12" fill="#fed7aa"/>
    </pattern>
  </defs>

  <rect width="1280" height="920" rx="20" fill="#f8fafc"/>
  <text x="48" y="48" class="title">Why chunked prefill is required</text>
  <text x="48" y="78" class="subtitle">
    Same workload: A and B are streaming when a long prompt C arrives.
  </text>

  <g transform="translate(770 96)">
    <rect x="0" y="0" width="22" height="16" rx="4" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="30" y="13" class="small">decode batch</text>
    <rect x="132" y="0" width="22" height="16" rx="4" fill="#ffedd5" stroke="#ea580c"/>
    <text x="162" y="13" class="small">prefill work</text>
    <circle cx="284" cy="8" r="7" fill="#10b981" stroke="#047857"/>
    <text x="300" y="13" class="small">streamed token</text>
  </g>

  <!-- Unchunked panel -->
  <g>
    <rect x="38" y="132" width="1204" height="306" rx="18" fill="#ffffff"
          stroke="#fecaca" stroke-width="2"/>
    <text x="62" y="169" class="panel-title">Without chunking: the whole prompt delays the next decode</text>
    <text x="62" y="196" class="panel-subtitle">
      M4 treats C as indivisible. Its prefill work scales with the full prompt length L.
    </text>

    <line x1="190" y1="224" x2="1198" y2="224" class="timeline"
          marker-end="url(#time-arrow)"/>
    <text x="1158" y="215" class="small">time</text>

    <text x="66" y="278" class="lane">GPU work</text>
    <rect x="190" y="244" width="132" height="58" rx="9" fill="#ede9fe"
          stroke="#7c3aed" stroke-width="2"/>
    <text x="256" y="269" text-anchor="middle" class="block">decode A + B</text>
    <text x="256" y="290" text-anchor="middle" class="small">one token each</text>

    <line x1="348" y1="214" x2="348" y2="414" stroke="#94a3b8"
          stroke-width="2" stroke-dasharray="5 5"/>
    <path d="M 348 232 l -7 -12 h 14 z" fill="#0f172a"/>
    <text x="348" y="326" text-anchor="middle" class="small">C arrives</text>

    <rect x="374" y="244" width="628" height="58" rx="9" fill="url(#long-prompt)"
          stroke="#ea580c" stroke-width="2"/>
    <text x="688" y="269" text-anchor="middle" class="block">prefill all L tokens of C</text>
    <text x="688" y="290" text-anchor="middle" class="small">one indivisible scheduling step</text>

    <rect x="1028" y="244" width="164" height="58" rx="9" fill="#ede9fe"
          stroke="#7c3aed" stroke-width="2"/>
    <text x="1110" y="269" text-anchor="middle" class="block">decode A + B + C</text>
    <text x="1110" y="290" text-anchor="middle" class="small">generation resumes</text>

    <text x="66" y="359" class="lane">Streams A + B</text>
    <circle cx="322" cy="352" r="9" fill="#10b981" stroke="#047857" stroke-width="2"/>
    <circle cx="1192" cy="352" r="9" fill="#10b981" stroke="#047857" stroke-width="2"/>
    <line x1="334" y1="352" x2="1180" y2="352" class="waiting"/>
    <line x1="322" y1="380" x2="1192" y2="380" stroke="#ef4444" stroke-width="2"/>
    <line x1="322" y1="371" x2="322" y2="389" stroke="#ef4444" stroke-width="2"/>
    <line x1="1192" y1="371" x2="1192" y2="389" stroke="#ef4444" stroke-width="2"/>
    <text x="757" y="403" text-anchor="middle" class="small-red">
      one large inter-token gap includes all L prompt tokens
    </text>
  </g>

  <!-- Chunked panel -->
  <g>
    <rect x="38" y="466" width="1204" height="348" rx="18" fill="#ffffff"
          stroke="#a7f3d0" stroke-width="2"/>
    <text x="62" y="503" class="panel-title">With chunking: decode runs between bounded pieces of C</text>
    <text x="62" y="530" class="panel-subtitle">
      M5a decodes first, then spends at most chunk_size prompt tokens in that iteration.
    </text>

    <line x1="190" y1="558" x2="1198" y2="558" class="timeline"
          marker-end="url(#time-arrow)"/>
    <text x="1158" y="549" class="small">time</text>

    <text x="66" y="614" class="lane">GPU work</text>
    <rect x="190" y="578" width="112" height="58" rx="9" fill="#ede9fe"
          stroke="#7c3aed" stroke-width="2"/>
    <text x="246" y="603" text-anchor="middle" class="block">decode A + B</text>
    <text x="246" y="624" text-anchor="middle" class="small">+1 each</text>

    <rect x="302" y="578" width="158" height="58" rx="9" fill="#ffedd5"
          stroke="#ea580c" stroke-width="2"/>
    <text x="381" y="603" text-anchor="middle" class="block">C: chunk 1</text>
    <text x="381" y="624" text-anchor="middle" class="mono">≤ chunk_size</text>

    <rect x="486" y="578" width="112" height="58" rx="9" fill="#ede9fe"
          stroke="#7c3aed" stroke-width="2"/>
    <text x="542" y="603" text-anchor="middle" class="block">decode A + B</text>
    <text x="542" y="624" text-anchor="middle" class="small">+1 each</text>

    <rect x="598" y="578" width="158" height="58" rx="9" fill="#ffedd5"
          stroke="#ea580c" stroke-width="2"/>
    <text x="677" y="603" text-anchor="middle" class="block">C: chunk 2</text>
    <text x="677" y="624" text-anchor="middle" class="mono">≤ chunk_size</text>

    <rect x="782" y="578" width="112" height="58" rx="9" fill="#ede9fe"
          stroke="#7c3aed" stroke-width="2"/>
    <text x="838" y="603" text-anchor="middle" class="block">decode A + B</text>
    <text x="838" y="624" text-anchor="middle" class="small">+1 each</text>

    <rect x="894" y="578" width="158" height="58" rx="9" fill="#ffedd5"
          stroke="#ea580c" stroke-width="2"/>
    <text x="973" y="603" text-anchor="middle" class="block">C: final chunk</text>
    <text x="973" y="624" text-anchor="middle" class="small">C's first token</text>

    <rect x="1078" y="578" width="114" height="58" rx="9" fill="#ede9fe"
          stroke="#7c3aed" stroke-width="2"/>
    <text x="1135" y="603" text-anchor="middle" class="block">decode A+B+C</text>
    <text x="1135" y="624" text-anchor="middle" class="small">continue</text>

    <text x="66" y="687" class="lane">Streams A + B</text>
    <circle cx="302" cy="680" r="9" fill="#10b981" stroke="#047857" stroke-width="2"/>
    <circle cx="598" cy="680" r="9" fill="#10b981" stroke="#047857" stroke-width="2"/>
    <circle cx="894" cy="680" r="9" fill="#10b981" stroke="#047857" stroke-width="2"/>
    <circle cx="1192" cy="680" r="9" fill="#10b981" stroke="#047857" stroke-width="2"/>
    <line x1="314" y1="680" x2="586" y2="680" stroke="#86efac" stroke-width="3"/>
    <line x1="610" y1="680" x2="882" y2="680" stroke="#86efac" stroke-width="3"/>
    <line x1="906" y1="680" x2="1180" y2="680" stroke="#86efac" stroke-width="3"/>

    <line x1="302" y1="704" x2="598" y2="704" stroke="#10b981" stroke-width="2"/>
    <line x1="302" y1="696" x2="302" y2="712" stroke="#10b981" stroke-width="2"/>
    <line x1="598" y1="696" x2="598" y2="712" stroke="#10b981" stroke-width="2"/>
    <text x="450" y="730" text-anchor="middle" class="small-green">
      at most one prompt chunk
    </text>

    <line x1="598" y1="704" x2="894" y2="704" stroke="#10b981" stroke-width="2"/>
    <line x1="894" y1="696" x2="894" y2="712" stroke="#10b981" stroke-width="2"/>
    <text x="746" y="730" text-anchor="middle" class="small-green">
      at most one prompt chunk
    </text>

    <text x="66" y="775" class="lane">Request C</text>
    <line x1="190" y1="768" x2="1052" y2="768" class="progress"/>
    <circle cx="190" cy="768" r="7" fill="#ffffff" stroke="#ea580c" stroke-width="3"/>
    <text x="190" y="793" text-anchor="middle" class="small">arrives</text>
    <circle cx="1052" cy="768" r="9" fill="#10b981" stroke="#047857" stroke-width="2"/>
    <text x="1052" y="793" text-anchor="middle" class="small">first token after final chunk</text>
  </g>

  <rect x="92" y="842" width="1096" height="52" rx="13" fill="#ecfdf5"
        stroke="#34d399" stroke-width="2"/>
  <text x="640" y="874" text-anchor="middle" class="block">
    Chunking does not remove prefill work; it bounds how much of that work can sit between decode batches.
  </text>
</svg>
