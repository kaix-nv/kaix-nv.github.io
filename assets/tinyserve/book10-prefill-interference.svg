<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1050" role="img" aria-labelledby="title desc">
  <title id="title">Chunked prefill gives ongoing decoders more opportunities to run</title>
  <desc id="desc">Requests A and B stay active throughout this simplified illustration; C has a ten-token prompt ready. Without chunking, one decode batch is followed by all ten prompt tokens before the next decode batch. With a shared four-token prompt budget per scheduling iteration, the ordinary decode-then-prefill path processes C in chunks of four, four, and two tokens, with A and B decoding between chunks. C samples its first output token only after the final prompt chunk. Green markers show token sampling with internal timestamps, not client delivery. The synchronous step returns events only after the full iteration and synchronization; online streaming happens after that return. The drawing shows execution order, not measured durations. Model calls are not preempted mid-call, and all ten prompt tokens still have to be processed.</desc>
  <defs>
    <style>
      text { font-family: system-ui, sans-serif; fill: #0f172a; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #475569; }
      .heading { font-size: 21px; font-weight: 700; }
      .body { font-size: 16px; }
      .small { font-size: 14px; fill: #475569; }
      .block { font-size: 15px; font-weight: 650; }
      .lane { font-size: 15px; font-weight: 650; fill: #334155; }
      .purple { fill: #ede9fe; stroke: #7c3aed; stroke-width: 2; }
      .orange { fill: #ffedd5; stroke: #ea580c; stroke-width: 2; }
      .token { fill: #10b981; stroke: #047857; stroke-width: 2; }
      .guide { fill: none; stroke: #94a3b8; stroke-width: 1.5; }
      .connect { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1280" height="1050" rx="18" fill="#f8fafc"/>
  <text x="42" y="48" class="title">One prompt can delay every active decoder</text>
  <text x="42" y="79" class="subtitle">A and B stay active throughout this schematic. C is ready with 10 prompt tokens. Model calls execute in order.</text>
  <rect x="44" y="101" width="20" height="16" rx="3" class="purple"/>
  <text x="74" y="115" class="small">decode batch</text>
  <rect x="216" y="101" width="20" height="16" rx="3" class="orange"/>
  <text x="246" y="115" class="small">C's prefill</text>
  <circle cx="390" cy="109" r="7" class="token"/>
  <text x="407" y="115" class="small">token sampled (internal timestamp)</text>

  <rect x="30" y="142" width="1220" height="322" rx="16" fill="#fff" stroke="#fecaca" stroke-width="2"/>
  <text x="52" y="178" class="heading">Whole-prompt prefill: the next decode waits for all 10 tokens</text>
  <path d="M170 225V215H930V225" class="guide"/>
  <text x="550" y="204" text-anchor="middle" class="small">iteration 1</text>
  <path d="M968 225V215H1208V225" class="guide"/>
  <text x="1088" y="204" text-anchor="middle" class="small">iteration 2</text>
  <text x="52" y="273" class="lane">Model calls</text>
  <rect x="170" y="240" width="150" height="64" rx="8" class="purple"/>
  <text x="245" y="266" text-anchor="middle" class="block">decode A + B</text>
  <text x="245" y="289" text-anchor="middle" class="small">one token each</text>
  <path d="M325 272H344" class="connect"/>
  <rect x="350" y="240" width="580" height="64" rx="8" class="orange"/>
  <text x="640" y="266" text-anchor="middle" class="block">prefill C: all 10 prompt tokens</text>
  <text x="640" y="289" text-anchor="middle" class="small">one model call; no decode batch runs inside it</text>
  <path d="M935 272H962" class="connect"/>
  <rect x="968" y="240" width="240" height="64" rx="8" class="purple"/>
  <text x="1088" y="266" text-anchor="middle" class="block">decode A + B + C</text>
  <text x="1088" y="289" text-anchor="middle" class="small">next opportunity to decode</text>
  <text x="52" y="350" class="lane">A and B</text>
  <path d="M320 306V343M1208 306V343" class="guide"/>
  <line x1="331" y1="343" x2="1197" y2="343" stroke="#ef4444" stroke-width="3" stroke-dasharray="7 6"/>
  <circle cx="320" cy="343" r="8" class="token"/>
  <circle cx="1208" cy="343" r="8" class="token"/>
  <text x="764" y="369" text-anchor="middle" class="small">This internal sampling gap includes C's entire prefill, then the next decode call.</text>
  <text x="52" y="411" class="lane">C</text>
  <path d="M930 306V350M930 380V404" class="guide"/>
  <circle cx="930" cy="404" r="8" class="token"/>
  <text x="930" y="435" text-anchor="middle" class="small">C1 sampled after the full prompt</text>

  <rect x="30" y="487" width="1220" height="353" rx="16" fill="#fff" stroke="#a7f3d0" stroke-width="2"/>
  <text x="52" y="524" class="heading">Chunked prefill: decode first, then process at most 4 prompt tokens</text>
  <path d="M168 571V561H434V571" class="guide"/>
  <text x="301" y="551" text-anchor="middle" class="small">iteration 1</text>
  <path d="M456 571V561H722V571" class="guide"/>
  <text x="589" y="551" text-anchor="middle" class="small">iteration 2</text>
  <path d="M744 571V561H990V571" class="guide"/>
  <text x="867" y="551" text-anchor="middle" class="small">iteration 3</text>
  <path d="M1020 571V561H1208V571" class="guide"/>
  <text x="1114" y="551" text-anchor="middle" class="small">iteration 4</text>
  <text x="52" y="618" class="lane">Model calls</text>
  <rect x="168" y="585" width="116" height="64" rx="8" class="purple"/>
  <text x="226" y="611" text-anchor="middle" class="block">decode A+B</text>
  <text x="226" y="634" text-anchor="middle" class="small">+1 each</text>
  <rect x="284" y="585" width="150" height="64" rx="8" class="orange"/>
  <text x="359" y="611" text-anchor="middle" class="block">C: 4 tokens</text>
  <text x="359" y="634" text-anchor="middle" class="small">positions 0–3</text>
  <path d="M438 617H450" class="connect"/>
  <rect x="456" y="585" width="116" height="64" rx="8" class="purple"/>
  <text x="514" y="611" text-anchor="middle" class="block">decode A+B</text>
  <text x="514" y="634" text-anchor="middle" class="small">+1 each</text>
  <rect x="572" y="585" width="150" height="64" rx="8" class="orange"/>
  <text x="647" y="611" text-anchor="middle" class="block">C: 4 tokens</text>
  <text x="647" y="634" text-anchor="middle" class="small">positions 4–7</text>
  <path d="M726 617H738" class="connect"/>
  <rect x="744" y="585" width="116" height="64" rx="8" class="purple"/>
  <text x="802" y="611" text-anchor="middle" class="block">decode A+B</text>
  <text x="802" y="634" text-anchor="middle" class="small">+1 each</text>
  <rect x="860" y="585" width="130" height="64" rx="8" class="orange"/>
  <text x="925" y="611" text-anchor="middle" class="block">C: 2 tokens</text>
  <text x="925" y="634" text-anchor="middle" class="small">positions 8–9</text>
  <path d="M994 617H1014" class="connect"/>
  <rect x="1020" y="585" width="188" height="64" rx="8" class="purple"/>
  <text x="1114" y="611" text-anchor="middle" class="block">decode A + B + C</text>
  <text x="1114" y="634" text-anchor="middle" class="small">C joins the decode batch</text>
  <text x="52" y="695" class="lane">A and B</text>
  <path d="M284 651V688M572 651V688M860 651V688M1208 651V688" class="guide"/>
  <path d="M294 688H562M582 688H850M870 688H1198" fill="none" stroke="#86efac" stroke-width="3"/>
  <circle cx="284" cy="688" r="8" class="token"/>
  <circle cx="572" cy="688" r="8" class="token"/>
  <circle cx="860" cy="688" r="8" class="token"/>
  <circle cx="1208" cy="688" r="8" class="token"/>
  <text x="428" y="715" text-anchor="middle" class="small">4 prompt tokens between decodes</text>
  <text x="716" y="715" text-anchor="middle" class="small">4 prompt tokens</text>
  <text x="1034" y="715" text-anchor="middle" class="small">2 prompt tokens</text>
  <text x="52" y="761" class="lane">C</text>
  <path d="M990 651V696M990 727V754" class="guide"/>
  <circle cx="990" cy="754" r="8" class="token"/>
  <text x="990" y="785" text-anchor="middle" class="small">C1 sampled after the final chunk</text>
  <text x="52" y="816" class="small">The budget is shared across all PREFILLING requests; this example has only one, C.</text>

  <rect x="30" y="863" width="1220" height="159" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="52" y="893" class="body">Chunking bounds prompt-token work per scheduling iteration; it does not impose a wall-clock latency bound.</text>
  <text x="52" y="921" class="body">All 10 prompt tokens still run. A model call is not interrupted mid-call to serve another request.</text>
  <text x="52" y="949" class="small">Schematic execution order: widths are not timings, iterations are not equal-duration time slots, and host/network delay is omitted.</text>
  <text x="52" y="977" class="body">Markers show internal sampling, not client delivery. step() returns events after the full iteration and synchronization.</text>
  <text x="52" y="1005" class="body">The online service streams those events after step() returns; these dots are not network-send timestamps.</text>
</svg>
