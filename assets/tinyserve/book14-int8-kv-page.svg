<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">INT8 KV codes and scales follow the same page table</title>
<desc id="desc">With page size four and logical block table five then two, logical token five maps to physical page two offset one. For each layer and head the key and value each have D signed INT8 codes and one FP32 scale. At D equal to 128 the combined representation costs 132 bytes per vector instead of 256 for BF16. Old token scales remain unchanged during append.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 Z" fill="#52657a"/></marker></defs>
<rect width="1200" height="720" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#172b43">
<text x="40" y="48" font-size="28" font-weight="700">One logical token selects both its codes and its scales</text>
<text x="40" y="80" font-size="18">Page size = 4 · block table = [5, 2] · example selects layer 3, head 0</text>
<rect x="40" y="117" width="340" height="105" rx="12" fill="#e8f0fd" stroke="#6088b7"/>
<text x="62" y="154" font-size="22" font-weight="700">Logical token position 5</text>
<text x="62" y="190" font-size="20">Logical page 1, offset 1</text>
<path d="M385 169 H473" stroke="#52657a" stroke-width="3" marker-end="url(#arrow)"/>
<text x="411" y="145" font-size="18">table[1]</text>
<rect x="495" y="117" width="665" height="105" rx="12" fill="#e8f0fd" stroke="#6088b7"/>
<text x="517" y="154" font-size="22" font-weight="700">Physical page 2, offset 1</text>
<text x="517" y="190" font-size="20">Flat token slot = 2 × 4 + 1 = 9</text>
<path d="M827 226 V270" stroke="#52657a" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="40" y="287" width="1120" height="235" rx="12" fill="#ffffff" stroke="#bbc7d6"/>
<text x="62" y="325" font-size="22" font-weight="700">The selected page slot has separate K and V records</text>
<rect x="62" y="351" width="675" height="62" rx="7" fill="#e2f2e8" stroke="#50826b"/>
<text x="84" y="391" font-size="21">K codes [D] · example: [−127, −25, 38, 89]</text>
<rect x="765" y="351" width="373" height="62" rx="7" fill="#fff3d9" stroke="#b39241"/>
<text x="787" y="391" font-size="21">K scale · FP32 · ≈ 1/127</text>
<rect x="62" y="435" width="675" height="62" rx="7" fill="#e2f2e8" stroke="#50826b"/>
<text x="84" y="475" font-size="21">V codes [D] · independent value vector</text>
<rect x="765" y="435" width="373" height="62" rx="7" fill="#fff3d9" stroke="#b39241"/>
<text x="787" y="475" font-size="21">V scale · its own FP32 value</text>
<text x="40" y="568" font-size="21">Read: decode codes with the matching scale, then use floating attention.</text>
<text x="40" y="607" font-size="21">Append: write only the new token. Existing tokens retain their own scales.</text>
<rect x="40" y="634" width="1120" height="50" rx="8" fill="#edf0f7"/>
<text x="62" y="666" font-size="20">At D = 128: 128 code bytes + 4 scale bytes = 132, versus 256 BF16 bytes per K or V vector.</text>
</g></svg>
