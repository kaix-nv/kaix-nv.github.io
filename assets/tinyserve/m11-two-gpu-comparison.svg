<title id="title">M11: compare phase separation with two ordinary replicas</title>
<desc id="desc">Measured throughput and first-text latency for short, long, and mixed eight-request cohorts. Both modes use two A6000s and the same per-GPU KV budget. Bars show medians and whiskers observed ranges, not confidence intervals.</desc>
