<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Four-token causal attention with two query heads</title><desc id="desc">A triangular visibility matrix permits ten pairs. The final head-A query produces scores 1, 0, 1, negative 1 and a weighted value output. A second query head shares KV but has its own result.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#48617a"/></marker></defs>
<rect width="1200" height="640" rx="18" fill="#f5f8fc"/>
<g font-family="Arial,sans-serif" fill="#172b43"><text x="38" y="48" font-size="28" font-weight="700">One history, two questions, causal visibility</text>
<text x="45" y="100" font-size="22" font-weight="700">Allowed query / key pairs</text>
<text x="136" y="141" font-size="18">k0</text><text x="206" y="141" font-size="18">k1</text><text x="276" y="141" font-size="18">k2</text><text x="346" y="141" font-size="18">k3</text>
<g fill="#dce9f4" stroke="#aebed0"><path d="M120 154h280v224H120z"/><path d="M190 154v224M260 154v224M330 154v224M120 210h280M120 266h280M120 322h280"/></g>
<path d="M120 154h70v56h70v56h70v56h70v56H120z" fill="#3d7695"/>
<g fill="white" font-size="22" text-anchor="middle"><text x="155" y="189">✓</text><text x="155" y="245">✓</text><text x="225" y="245">✓</text><text x="155" y="301">✓</text><text x="225" y="301">✓</text><text x="295" y="301">✓</text><text x="155" y="357">✓</text><text x="225" y="357">✓</text><text x="295" y="357">✓</text><text x="365" y="357">✓</text></g>
<g font-size="18"><text x="66" y="188">q0</text><text x="66" y="244">q1</text><text x="66" y="300">q2</text><text x="66" y="356">q3</text><text x="52" y="421">Blue: allowed before softmax</text><text x="52" y="453">Pale: future keys excluded</text></g>
<rect x="445" y="92" width="710" height="309" rx="12" fill="white" stroke="#b2c4d6"/>
<text x="468" y="127" font-size="22" font-weight="700">Head A at position 3</text>
<g font-size="20"><text x="470" y="168">q = [√2, 0]       scale = 1 / √2</text><text x="470" y="210">scores       [1,       0,       1,      −1]</text><text x="470" y="252">softmax    [0.3995, 0.1470, 0.3995, 0.0541]</text><text x="470" y="294">values       [1,0]    [0,2]    [2,1]    [−1,1]</text></g>
<text x="470" y="366" font-size="24" font-weight="700" fill="#276047">weighted sum = [1.144394, 0.747476]</text>
<rect x="445" y="430" width="710" height="92" rx="12" fill="#e8f2ec" stroke="#a4c4ae"/><text x="467" y="464" font-size="21">Head B: q = [0, √2] uses the same keys and values</text><text x="467" y="498" font-size="21">Different scores → output [0.731059, 1.231059]</text>
<path d="M800 525v32" stroke="#48617a" stroke-width="3" marker-end="url(#arrow)"/>
<text x="440" y="598" font-size="22">Join both outputs [4] → output projection → residual width H</text>
</g></svg>
